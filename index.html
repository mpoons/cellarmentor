*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:var(--sans); color:var(--ink); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; /* dubbeltik zoomt niet meer per ongeluk in; knijpen blijft gewoon werken */
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#app{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
/* ---------- header ---------- */
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 14px}
.brand{font-family:var(--serif);font-size:30px;letter-spacing:.01em;color:var(--ink)}
.brand .dot{color:var(--acc)}
.hdr-sub{font-size:12.5px;color:var(--ink2)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.h2{font-family:var(--serif);font-size:21px;margin:4px 0 10px}
.sect{margin-top:22px}
/* ---------- search & chips ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--ink3)}
.search svg{flex:none;color:var(--ink3)}
.search .sortbtn{flex:none;width:32px;height:32px;margin:-4px -6px -4px 0;border-radius:9px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.search .sortbtn:active{background:var(--card2)}
.search .swis{flex:none;width:28px;height:28px;margin:-4px -8px -4px 0;border-radius:50%;border:0;background:none;color:var(--ink3);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.search .swis:active{background:var(--card2)}
.search .swis[hidden]{display:none}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:10px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink)}
.chip .tdot{width:8px;height:8px}
.chip.on .tdot{outline:1.5px solid rgba(255,247,242,.85);outline-offset:1px}
/* ---------- wijnkaart ---------- */
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);text-align:left;width:100%}
.wthumb{flex:none;width:52px;border-radius:9px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center;min-height:68px;position:relative}
.wthumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.wthumb svg{color:var(--ink3);opacity:.8}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.wname{font-family:var(--serif);font-size:16.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wsub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wsub{display:flex;min-width:0}
.wcard .wprod{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wcard .wjaar{flex:none;white-space:pre}
.wmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.wside{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px;padding:2px 0}
.wtap{display:flex;gap:12px;flex:1;min-width:0;align-items:stretch;text-align:left}
.dbtn{width:36px;height:36px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.dbtn.leeg{opacity:.55}
.dbtn:active{transform:scale(.92)}
.qty{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--ink);background:var(--card2);border-radius:8px;padding:3px 8px}
.wloc{font-size:11px;color:var(--ink3);max-width:104px;text-align:right;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tlabel{font-size:12px;color:var(--ink2)}
.t-rood{background:var(--t-rood)} .t-wit{background:var(--t-wit)} .t-rose{background:var(--t-rose)}
.t-mousserend{background:var(--t-mous)} .t-zoet{background:var(--t-zoet)} .t-versterkt{background:var(--t-vers)} .t-oranje{background:var(--t-oranje)}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-op{background:var(--ok-bg);color:var(--ok)}
.b-nu{background:var(--warn-bg);color:var(--warn)}
.b-top{background:transparent;color:var(--gold-ink);border:1px solid var(--gold)}
.ik{vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block;margin-right:2px;flex:none}
.banner > span:first-child .ik{width:18px;height:18px;margin:2px 0 0}
.eyebrow .ik{width:13px;height:13px;vertical-align:-2px}
.medal{vertical-align:-2px;margin-right:1px}
.verdict{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0 0 10px}
.drow{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:9px 0}
.drow .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600;min-width:60px}
.drow .loc{margin-left:auto;text-align:right;font-size:13px;color:var(--ink2);line-height:1.35}
.waarde{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:0 0 12px}
.waarde b{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.waarde span{font-size:12px;color:var(--ink2);line-height:1.4}
.waarde a{color:var(--acc-ink);text-decoration:underline;text-underline-offset:2px}
.schaal{display:flex;gap:2px;align-items:flex-end;height:12px;margin-top:10px}
.schaal i{flex:1;height:6px;background:var(--line);display:block}
.schaal i.in{background:var(--ink2);height:8px}
.schaal i.nu{background:var(--acc);height:12px}
.schaal-as{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin:3px 0 6px;font-variant-numeric:tabular-nums}
.b-jong{background:var(--info-bg);color:var(--info)}
.b-over{background:var(--bad-bg);color:var(--bad)}
.b-rijp{background:var(--warn-bg);color:var(--warn)}
.b-onb{background:var(--neut-bg);color:var(--neut)}
/* ---------- knoppen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--btn-bg);color:var(--btn-ink);width:100%;transition:transform .06s ease,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card);color:var(--acc-ink);border:1.5px solid var(--acc);box-shadow:none}
:root[data-theme="dark"] .btn.ghost{border-color:var(--acc)}
.btn.soft{background:var(--acc-soft);color:var(--acc-ink)}
.btn.plain{background:var(--card2);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--bad-bg)}
.btn.sm{padding:8px 13px;font-size:13.5px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}
.linkbtn{color:var(--acc-ink);font-weight:600;font-size:14px}
/* ---------- lege staat / banners ---------- */
.empty{text-align:center;padding:44px 22px;color:var(--ink2)}
.empty .big{font-family:var(--serif);font-size:21px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13.5px;margin-bottom:18px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink2);margin:10px 0}
.banner b{color:var(--ink)}
.srcchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--gold-ink);border:1px solid var(--line);border-radius:999px;padding:2px 9px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(31,18,22,.45);backdrop-filter:blur(2px);z-index:40;opacity:0;transition:opacity .2s}
.overlay.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);max-height:90dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,.33,1)}
.sheet.show{transform:translateY(0)}
.sheet-in{overflow-y:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.sheet-title{font-family:var(--serif);font-size:20px}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
@media (min-width:560px){.sheet{max-width:560px;left:50%;transform:translate(-50%,100%);}.sheet.show{transform:translate(-50%,0)}}
/* ---------- detail ---------- */
.dphoto{border-radius:14px;overflow:hidden;background:var(--card2);max-height:230px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.dphoto img{object-fit:contain;max-height:230px;width:auto;margin:0 auto}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.dcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.dcell .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.dcell .v{font-size:14.5px;margin-top:2px}
.grapes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.grape{font-size:12px;background:var(--card2);border-radius:999px;padding:3px 10px;color:var(--ink2)}
/* stepper */
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepbtn{width:44px;height:44px;border-radius:50%;background:var(--card2);font-size:22px;font-weight:600;color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.stepval{font-family:var(--serif);font-size:30px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
/* tijdlijn */
.tl{margin:8px 0 4px}
.tl-track{position:relative;height:10px;border-radius:5px;background:var(--bar-track);overflow:visible}
.tl-fill{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--t-mous),var(--ok) 30%,var(--warn) 78%,var(--bad))}
.tl-now{position:absolute;top:-4px;width:2.5px;height:18px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--sheet)}
.tl-lab{position:relative;height:15px;font-size:11.5px;color:var(--ink3);margin-top:7px;font-variant-numeric:tabular-nums}
.tl-lab span{position:absolute;top:0;white-space:nowrap}
.tl-lab span.now{color:var(--ink);font-weight:600}
/* ---------- formulieren ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:64px}
/* iOS zoomt vanzelf in zodra je een tekstveld kleiner dan 16px aantikt, en zoomt daarna
   niet terug, dus op een aanraakscherm 16px, zodat de app niet scheef ingezoomd blijft staan. */
@media (pointer:coarse){ .inp, .search input, input, select, textarea { font-size:16px } }
.frow{display:flex;gap:9px}
.frow>.field{flex:1;min-width:0}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:31%;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.qquick{display:flex;gap:7px;margin-top:8px;justify-content:center}
.qquick button{font-size:12.5px;font-weight:600;color:var(--acc-ink);background:var(--acc-soft);border-radius:999px;padding:5px 13px}
/* rek met vakjes */
.rekwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 4px}
.rek{display:grid;gap:4px;align-items:center;width:max-content;min-width:100%}
.rek .rl{font-size:10.5px;color:var(--ink3);text-align:center;font-weight:600;font-variant-numeric:tabular-nums;min-width:18px}
.vak{width:100%;min-width:22px;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:block;padding:0;transition:transform .12s}
.vak.vol{border-color:transparent}
.vak.mijn{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--acc)}
.rek.kies .vak:not(.vol){border-style:dashed}
.rek.kies .vak.vol:not(.mijn){opacity:.35}
.vak:not(:disabled):active{transform:scale(.88)}
.reklegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--ink2)}
.reklegend span{display:inline-flex;align-items:center;gap:5px}
/* sterren */
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0}
.stars button{font-size:30px;line-height:1;color:var(--line);transition:transform .08s}
.stars button.on{color:var(--gold)}
.stars button.half{background:linear-gradient(90deg,var(--gold) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars button:active{transform:scale(1.2)}
.starmini{color:var(--gold);font-size:12.5px;letter-spacing:1px}
/* ---------- pairing ---------- */
.pairtoggle{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:14px}
.pairtoggle button{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.pairtoggle button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.match-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mscore{flex:none;font-family:var(--serif);font-size:19px;color:var(--acc-ink);font-variant-numeric:tabular-nums}
.mscore small{font-size:11px;color:var(--ink3);font-family:var(--sans)}
.mreason{font-size:13.5px;color:var(--ink2);margin-top:6px}
.dishcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.dishcard .d{font-weight:600;font-size:14.5px}
.dishcard .r{font-size:13px;color:var(--ink2);margin-top:3px}
/* ---------- overzicht ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);text-align:left}
.tile .n{font-family:var(--serif);font-size:27px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tile .s{font-size:11.5px;color:var(--ink2);margin-top:2px}
.brow{display:grid;grid-template-columns:minmax(86px,30%) 1fr auto;align-items:center;gap:10px;padding:5px 0}
.brow .l{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brow .track{display:block;height:9px;border-radius:5px;background:var(--bar-track);overflow:hidden}
.brow .fill{display:block;height:100%;border-radius:5px 4px 4px 5px;background:var(--bar);min-width:3px}
.brow .fill.t-rood{background:var(--t-rood)} .brow .fill.t-wit{background:var(--t-wit)} .brow .fill.t-rose{background:var(--t-rose)}
.brow .fill.t-mousserend{background:var(--t-mous)} .brow .fill.t-zoet{background:var(--t-zoet)} .brow .fill.t-versterkt{background:var(--t-vers)} .brow .fill.t-oranje{background:var(--t-oranje)}
.brow .v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:12px}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.rowline:last-child{border-bottom:0}
.rowline .a{min-width:0}
.rowline .t{font-size:14px;font-weight:600;font-family:var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowline .u{font-size:12px;color:var(--ink2)}
.rowline .z{flex:none;text-align:right}
/* ---------- meer ---------- */
.menu{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;border-bottom:1px solid var(--line2);text-align:left;font-size:15px}
.mitem:last-child{border-bottom:0}
.mitem svg{color:var(--acc-ink);flex:none}
.mitem .grow{flex:1}
.mitem .cnt{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mitem .chev{color:var(--ink3)}
.mitem .todo{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:3px 9px}
.backrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--acc-ink);font-weight:600;font-size:14px}
/* ---------- navigatie ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-in{max-width:640px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.nbtn.on{color:var(--acc-ink)}
.nbtn svg{width:23px;height:23px}
.nfab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3);margin-top:-24px}
.nfab .fab{width:56px;height:56px;border-radius:50%;background:var(--fab1);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(125,42,60,.38);border:3px solid var(--bg)}
.nfab.on .fab{background:var(--fab2)}
:root[data-theme="dark"] .nfab .fab{box-shadow:0 6px 18px rgba(0,0,0,.45)}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:13.5px;display:flex;gap:14px;align-items:center;width:max-content;text-align:left;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 40px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{color:var(--gold);font-weight:700;font-size:13.5px;flex:none}
.toast span{flex:1 1 200px;min-width:0}
.toast{flex-wrap:wrap}
.toast button{margin-left:auto}
/* ---------- scan ---------- */
.scanhero{text-align:center;padding:26px 18px 10px}
.scanbig{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--fab1) 0%,var(--fab2) 90%);color:#FFF7F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin:18px auto;box-shadow:0 14px 40px rgba(125,42,60,.35);font-weight:600;font-size:14px}
:root[data-theme="dark"] .scanbig{box-shadow:0 14px 40px rgba(0,0,0,.5)}
.scanbig:active{transform:scale(.97)}
.scanprev{border-radius:16px;overflow:hidden;max-height:300px;display:flex;align-items:center;justify-content:center;background:var(--card2);margin-bottom:14px}
.scanprev img{object-fit:contain;max-height:300px}
/* laadbeeld terwijl de sommelier werkt: een glas dat volloopt */
.pour{flex:none;width:22px;height:30px;display:block}
.pour .wine{fill:var(--acc);animation:pourfill 2.1s cubic-bezier(.4,0,.5,1) infinite}
.pour .glass{fill:none;stroke:var(--acc);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
@keyframes pourfill{
  0%{transform:translateY(16px);opacity:1}
  62%{transform:translateY(3.6px);opacity:1}
  84%{transform:translateY(3.6px);opacity:1}

        bron:rq ? rijpheidZin(rq) : ''};
    }
    /* Zei een gepubliceerde bron dat deze streek-jaargang nog leven had, dan houden we
       "Over de piek?" tegen — maar alleen als die uitspraak tot vandaag reikt. Een "nog niet toe"
       uit 2015 over een 1997 gaat over een wijn van achttien, niet over een wijn van negenentwintig.
       Eén kant op: verlengen mag, inkorten niet.
       De naam van de uitgever gaat niet in sub maar in bron. Sub staat op elke suggestiekaart, en
       daar hoort geen "volgens Berry Bros & Rudd" bij elke fles te staan: dan wordt het behang en
       leest niemand het meer. Bron wordt getoond waar iemand er om vraagt. */
    const rp = rijpheidVan(w), oud = y - w.vintage;
    if(rp && rp.stand <= 2 && rijpheidReikt(rp, t - (f || t)) >= oud)
      return {k:'rijp',cls:'b-rijp',label:'Op z’n rijpst',
        sub:'venster liep tot '+t+', een bron geeft hem meer tijd', bron:rijpheidZin(rp)};
    return {k:'over',cls:'b-over',label:'Over de piek?',sub:'was op dronk '+(f?f+'–'+t:'t/m '+t),
      bron:(rp && rp.stand >= 3 ? rijpheidZin(rp) : '')};
  }
  if(t){
    const span = Math.max(1, t-(f||t)), rem = t-y;
    if(rem <= Math.min(3, Math.max(1, Math.round(span*0.18))))
      { const rq = rijpheidVan(w);
        return {k:'nu',cls:'b-nu',label:'Drink binnenkort',sub:(f?'venster '+f+'–'+t:'nog t/m '+t),bron:rq ? rijpheidZin(rq) : ''}; }
  }
  const rq = rijpheidVan(w);
  return {k:'op',cls:'b-op',label:'Op dronk',sub:t?(f?'venster '+f+'–'+t:'tot '+t):'',bron:rq ? rijpheidZin(rq) : ''};
}

      rq.onupgradeneeded = () => rq.result.createObjectStore('p');
      rq.onsuccess = () => { _db = rq.result; res(_db); };

/* ================= sheets & toast ================= */
const sheets = [];
let sheetSkipPops = 0, sheetNaPop = [], sheetPopsOnderweg = []; /* per history.go die nog niet is aangekomen: hoeveel stappen terug */
function openSheet(html, opts={}){
  const host = document.getElementById('sheetHost');
  const ov = document.createElement('div'); ov.className = 'overlay';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true');
  sh.innerHTML = `<div class="sheet-grip"></div><div class="sheet-in">${html}</div>`;
  host.appendChild(ov); host.appendChild(sh);
  requestAnimationFrame(()=>{ ov.classList.add('show'); sh.classList.add('show'); });
  ov.addEventListener('click', ()=>closeSheet());
  /* Elk venster is een stap in de browsergeschiedenis: de terugknop (Android) en de
     randveeg van Safari sluiten dan het venster in plaats van de app te verlaten. */
  const idx = sheets.length + 1, stap = () => { try{ history.pushState({sheet: idx}, ''); }catch(e){} };
  /* is er nog een terugstap onderweg (venster net gesloten), dan pas erna een nieuwe stap zetten */
  if(sheetSkipPops > 0) sheetNaPop.push(stap); else stap();
  sheets.push({ov, sh, onClose:opts.onClose});
  wireSwipeBack(sh);
  document.body.style.overflow = 'hidden';
  return sh;
}
function closeSheet(all, viaPop){
  const doOne = () => {
    const s = sheets.pop(); if(!s) return;
    s.ov.classList.remove('show'); s.sh.classList.remove('show');
    setTimeout(()=>{ s.ov.remove(); s.sh.remove(); }, 300);
    if(s.onClose) try{ s.onClose(); }catch(e){}
  };
  if(all){ while(sheets.length) doOne(); } else doOne();
  if(!sheets.length) document.body.style.overflow = '';
  /* Onderweg is er opgeslagen (voorraad +1 in het detail): de lijst erachter toont nog het oude getal */
  if(!sheets.length && renderNaSluiten) setTimeout(() => { if(renderNaSluiten && !sheets.length){ renderNaSluiten = false; renderTenzijFormulier(); } }, 0);
  if(!viaPop){
    /* gesloten via de app zelf: de bijbehorende geschiedenisstappen weer weghalen. history.go is asynchroon en
       history.state loopt dus achter; wat een vorige aanroep al terugstuurde telt niet nog eens mee (twee sluitingen
       vlak na elkaar, zoals bevestigen + alles dichtdoen, stuurden anders te ver terug: de app uit, of een
       terugstap die nooit aankomt en de terugknop daarna één keer laat "slikken") */
    const st = (history.state && history.state.sheet) || 0;
    const onderweg = sheetPopsOnderweg.reduce((a, b) => a + b, 0);
    const terug = st - onderweg - sheets.length;
    if(terug > 0){ sheetSkipPops++; sheetPopsOnderweg.push(terug); try{ history.go(-terug); }catch(e){ sheetSkipPops--; sheetPopsOnderweg.pop(); } }
  }
}
addEventListener('popstate', () => {
  if(sheetSkipPops > 0){ sheetSkipPops--; sheetPopsOnderweg.shift(); sheetNaPop.splice(0).forEach(f => f()); return; }
  const want = (history.state && history.state.sheet) || 0;
  while(sheets.length > want) closeSheet(false, true);
});
/* Veeg vanaf de linkerrand naar rechts, of naar beneden als de inhoud bovenaan staat:
   sluit het bovenste venster. Op de iPhone als app op het beginscherm bestaat geen
   randveeg van Safari, dus die doen we zelf. */
function wireSwipeBack(sh){
  let x0 = null, y0 = null, t0 = 0, richting = null; /* 'x' = vanaf de linkerrand, 'y' = naar beneden */
  const inhoud = sh.querySelector('.sheet-in');
  sh.addEventListener('touchstart', e => {
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); richting = null;
  }, {passive:true});
  sh.addEventListener('touchmove', e => {
    if(x0 == null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if(!richting){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if(x0 <= 36 && dx > Math.abs(dy)) richting = 'x';
      /* naar beneden alleen als de inhoud bovenaan staat, anders is het gewoon scrollen */
      else if(dy > Math.abs(dx) && (!inhoud || inhoud.scrollTop <= 0)) richting = 'y';
      else { x0 = null; return; }
    }
    sh.style.transition = 'none';
    sh.style.translate = richting === 'x' ? Math.max(0, dx) + 'px 0' : '0 ' + Math.max(0, dy) + 'px';
  }, {passive:true});
  const einde = e => {
    if(x0 == null) return;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const dx = t ? t.clientX - x0 : 0, dy = t ? t.clientY - y0 : 0, snel = Date.now() - t0 < 300;
    sh.style.transition = ''; sh.style.translate = '';
    const bovenste = sheets.length && sheets[sheets.length-1].sh === sh;
    const r = richting; x0 = null; richting = null;
    if(!bovenste) return;
    if(r === 'x' && (dx > 80 || (snel && dx > 40))) closeSheet();
    if(r === 'y' && (dy > 110 || (snel && dy > 50))) closeSheet();
  };
  sh.addEventListener('touchend', einde, {passive:true});
  sh.addEventListener('touchcancel', einde, {passive:true});
}
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheets.length) closeSheet(); });

}

let toastTimer = null;
function toast(msg, actionLabel, actionFn, ms=4200){
  const host = document.getElementById('toastHost');
  host.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${actionLabel?`<button id="toastAct">${esc(actionLabel)}</button>`:''}</div>`;

}

/* Ligt deze gescande fles al in de kelder?

   Naam en producent worden apart gewogen. Ze eerst op één hoop gooien was de fout:
   een domein maakt meestal meerdere cuvées, dus "Domaine des Baumard" alleen al
   leverde genoeg overeenkomende woorden op om een Clos du Papillon voor een Quarts
   de Chaume aan te zien. De naam moet nu kloppen; de producent is bevestiging, nooit
   bewijs. Een fout hier is duur: twee verschillende wijnen samenvoegen richt meer
   schade aan dan een dubbele regel, dus bij twijfel liever geen match. */
/* Woorden die in vrijwel elke producentnaam staan en dus niets onderscheiden.
   Zonder deze lijst lijken "Domaine Lefevre" en "Domaine Bernard" op elkaar. */
const HUISWOORDEN = new Set(['domaine','domaines','chateau','weingut','bodega','bodegas',
  'tenuta','azienda','agricola','cantina','cantine','quinta','maison','cave','caves','clos',
  'estate','winery','vineyard','vineyards','fattoria','castello','marques','marchesi',
  'famille','family','fils','freres','herdade','vinicola','wijngoed','wijnhuis',
  'des','del','dela','della','delle','dei','der','den','van','von','the','and','los','las']);
function matchWine(x){
  const woorden = t => new Set(norm(t||'').split(' ').filter(w => w.length > 2));
  const huis = t => new Set([...woorden(t)].filter(w => !HUISWOORDEN.has(w)));
  /* deelverzameling telt als treffer: "Talbot" hoort bij "Château Talbot" */
  const overlap = (a, b) => {
    if(!a.size || !b.size) return 0;
    let hit = 0; for(const t of a) if(b.has(t)) hit++;
    return hit / Math.min(a.size, b.size);
  };
  const xn = woorden(x.name), xp = huis(x.producer);
  if(!xn.size && !xp.size) return null;
  let best = null, bestScore = 0;
  for(const w of S.wines){
    /* in een kelder is een andere jaargang gewoon een andere fles */
    if(x.vintage && w.vintage && String(x.vintage) !== String(w.vintage)) continue;
    const wn = woorden(w.name), wp = huis(w.producer);
    const naam = overlap(xn, wn);
    if(naam < 0.6) continue;
    /* twee huizen die toevallig dezelfde cuvéenaam gebruiken zijn niet dezelfde wijn */
    const prod = overlap(xp, wp);
    if(xp.size && wp.size && prod === 0) continue;
    const score = naam * 0.75 + prod * 0.25;
    if(score > bestScore){ bestScore = score; best = w; }
  }
  return bestScore >= 0.6 ? best : null;
}

/* De tabellen één keer uitpakken: een string per streek leest prettiger dan honderd regels object.
   Een plus achter het niveau (2016:5+) betekent: dit jaar is tegen gepubliceerde bronnen gelegd,
   met minstens twee onafhankelijke bronnen, en het staat in JAARGANGEN.md met de vindplaats erbij.
   Zonder plus is het een eigen schatting die nog niet is nagetrokken. Dat onderscheid moet in de
   tabel zelf staan en niet in een voetnoot, want de app zegt het per fles tegen de gebruiker, en
   een oordeel dat zich voordoet als gecontroleerd terwijl het dat niet is, is precies het soort
   zelfverzekerdheid dat een kelderapp onbetrouwbaar maakt. */
/* JAARBRON[streek][jaar] telt hoe hard het oordeel is: 2 = tegen twee onafhankelijke bronnen
   gelegd (een plus in de tabel), 1 = op één betrouwbare bron gebaseerd (een ster), afwezig = eigen
   schatting. Die middelste stand bestaat omdat weggooien wat één goede bron zegt slechter is dan
   het bewaren met de juiste vlag erbij: het is beduidend meer waard dan een gok en minder dan twee. */
let JAARBRON = {};
const JAARTABEL = (() => {
  const m = {}, g = {};
  for(const s of STREKEN){
    const t = {}, c = {};
    for(const p of s.j.split(' ')){
      if(!p) continue;
      const [j, n] = p.split(':');
      t[+j] = parseInt(n, 10);
      if(n.endsWith('+')) c[+j] = 2;
      else if(n.endsWith('*')) c[+j] = 1;
    }
    m[s.k] = t; g[s.k] = c;
  }
  JAARBRON = g;
  return m;
})();
/* Etiketten korten Saint af, de tabel doet dat niet. Gemeten over 18.675 echte wijnnamen uit de
   catalogus van Berry Bros: 661 vielen buiten elke streek, en 170 daarvan alleen omdat er "St
   Joseph" of "Nuits St Georges" stond. Dat is geen randgeval maar hoe mensen hun flessen invoeren. */
const streekTekst = w => ' ' + norm([w.appellation, w.region, w.country, w.name, w.producer].filter(Boolean).join(' '))
  .replace(/\bst\b/g, 'saint').replace(/\bste\b/g, 'sainte') + ' ';
/* Welke streek uit de tabel hoort bij deze fles? De eerste die past; null als geen enkele past.
   Het antwoord wordt onthouden per herkomsttekst: windowStatus wordt bij het sorteren van een
   grote kelder duizenden keren aangeroepen, en dan is achtendertig streken naslaan zonde. */
const _streekCache = new Map();
function streekVan(w){
  const s = (w.type || '?') + streekTekst(w);
  if(_streekCache.has(s)) return _streekCache.get(s);
  let uit = null;
  const tekst = streekTekst(w);
  for(const st of STREKEN){
    if(st.t && !st.t.includes(w.type)) continue;
    /* niet: een uitzondering voor een trefwoord dat op zichzelf klopt maar botst met een
       beroemde naam elders. 'sicilia' is een goede sleutel voor Sicilië en staat toch in
       Vega Sicilia, de bekendste Ribera del Duero; 'alicante' is een Spaanse DO en ook de
       druif Alicante Bouschet in de Alentejo en de Douro. Een verkeerde streek geeft een
       verkeerd drinkadvies, en dat is erger dan geen advies. */
    if(st.niet && st.niet.some(k => tekst.includes(' ' + k + ' '))) continue;
    if(st.kw.some(k => tekst.includes(' ' + k + ' '))){ uit = st; break; }
  }
  if(_streekCache.size > 3000) _streekCache.clear();
  _streekCache.set(s, uit);
  return uit;
}
/* Het oordeel over de jaargang van déze fles, of null als we het niet weten.
   Jaren buiten de tabel geven niveau 3 terug zonder woord: dat is "geen mening". */
function jaargangOordeel(w){
  const jr = Number(w && w.vintage) || 0;
  if(!jr) return null;
  const st = streekVan(w);
  if(!st) return null;
  const n = JAARTABEL[st.k][jr];
  return { streek: st.l, key: st.k, jaar: jr, niveau: n || 3, woord: n ? JAAR_WOORD[n] : null,
    bron: (JAARBRON[st.k] && JAARBRON[st.k][jr]) || 0 };
}

   Twee tabellen die niet uit ons oordeel komen maar uit de bron. Ze worden geschreven door
   tools/zet-bronnen.py uit bronnen/bevindingen.json en bronnen/rijpheid-*.json; nooit met de hand
   bewerken, want dan loopt de app uit de pas met het onderzoeksdossier.

   RIJP_TABEL is een momentopname: wat een handelaar of criticus vandaag over de rijpheid van een
   streek-jaargang zegt. 0 = nog niet toe, 1 = jong maar open, 2 = op z'n best, 3 = rijp. Hij wordt
   maar één kant op gebruikt, en dat is met opzet: hij mag een venster verlengen en nooit inkorten.
   De reden staat in JAARGANGEN.md en is gemeten: van 452 streek-jaargangen zei de app dertien keer
   "Over de piek?" terwijl Berry Bros de wijn op z'n best noemde, onder meer Bordeaux 1982, 1986 en
   1988 en een Loire 1989. Te vroeg "over de piek" roepen is de ergste fout die deze app kan maken;
   een fles te lang laten liggen controleert de gebruiker zelf bij de eerste slok. */

function citaatVan(w){
  const jr = Number(w && w.vintage) || 0;
  if(!jr) return null;
  const st = streekVan(w);
  if(!st || !CITAAT[st.k]) return null;
  const c = CITAAT[st.k][jr];
  if(!c) return null;
  return { uitgever: c.u, url: (CITAAT_BASIS[c.u] || '') + c.p,

    geschreven: c.y || null, rijptaal: !!c.r };
}

const TITELWOORD = ['chateau','ch','domaine','dom','maison','tenuta','castello','quinta','bodega',
  'bodegas','weingut','cantina','azienda','podere','fattoria','vina','casa','marques','baron','barone',
  'conte','conti','famille','family','clos','chateaux','herdade','herdade do','casal','cave','caves'];
function naamGaatVerder(tekst, n){
  /* Alle plekken waar de naam staat, niet alleen de eerste. Een fles draagt de naam van het huis
     vaak twee keer, in het producentveld en in de wijnnaam, en dan staat achter de eerste de
     tweede: " herdade de sao miguel herdade de sao miguel ". Eén schone plek is genoeg. */
  const naamwoord = w => w.length > 2 && !/^\d+$/.test(w) && !NAAM_STOP.has(w);
  const zoek = ' ' + n + ' ';
  for(let i = tekst.indexOf(zoek); i >= 0; i = tekst.indexOf(zoek, i + 1)){
    const voor = tekst.slice(0, i).trim().split(' ').pop() || '';
    const rest = tekst.slice(i + n.length + 2).trim();
    const na = rest.split(' ')[0] || '';
    if(rest.startsWith(n + ' ') || rest === n) return false;          // dezelfde naam nog een keer
    if(naamwoord(na)) continue;
    if(naamwoord(voor) && !TITELWOORD.includes(voor)) continue;
    return false;
  }
  return true;
}
/* De staat van dienst van de maker, voor een fles waarvan de eigen jaargang niet in de lijst staat.
   Dit zegt niets over deze fles, en dat is ook precies wat er komt te staan. */
function vaakGenoemd(w){
  const jr = Number(w && w.vintage) || 0;
  const st = streekVan(w);
  if(!st || !PROD_VAAK[st.k]) return null;
  const naam = huisVan(w, st);
  if(!naam || !PROD_VAAK[st.k][naam]) return null;
  const jaren = PROD_VAAK[st.k][naam] || [];
  if(jr && jaren.includes(jr)) return null;   // dan zegt genoemdDoor het al, en preciezer
  return { naam, bron: PROD_BRON, streek: st.l, jaren, aantal: jaren.length,
    url: (PROD_URL[st.k] || {})[jaren[jaren.length - 1]] || '' };
}


/* ================= drinkvenster-schatting =================
   Hoe lang een fles meegaat, in jaren na de jaargang. De getallen gaan over de bovenkant van
   wat er in een kelder van deze soort ligt, want dat is wat mensen bewaren, en ze zijn ruim aan
   de achterkant: te vroeg "over de piek" roepen is de ergste fout die een kelderapp kan maken.
   Een fles die nog goed is en volgens de app op moet, gaat open op het verkeerde moment; een
   fles die volgens de app nog kan wachten, controleert de gebruiker zelf bij de eerste slok.

   Daarna gaat de jaargangfactor eroverheen: een uitzonderlijk jaar rekt het venster met dertig
   procent en begint wat later, een moeilijk jaar kort het met een derde. */
const G_LONG_WHITE = ['riesling','chardonnay','chenin','semillon','savagnin','assyrtiko','gruner','furmint','albarino','godello','marsanne','roussanne','verdicchio','vermentino','viognier'];

const R_BIG        = ['barolo','barbaresco','brunello','pauillac','margaux','saint julien','saint estephe','pessac','pomerol','saint emilion','medoc','hermitage','cote rotie','cornas','chateauneuf','gran reserva','ribera','priorat','bandol','madiran','taurasi','amarone','napa','bolgheri','sagrantino','vega sicilia','coonawarra','barossa','stags leap','howell mountain','chambertin','musigny','romanee','richebourg','clos de vougeot','clos de tart','echezeaux','bonnes mares','clos saint denis','la tache','grands echezeaux','clos de la roche','latricieres','mazis','ruchottes','griotte','charmes chambertin','clos des lambrays'];
const R_WHITE_LONG = ['meursault','puligny','chassagne','corton','montrachet','chablis grand','chablis premier','savennieres','vouvray','montlouis','mosel','moezel','saar','ruwer','rheingau','nahe','pfalz','grand cru','premier cru','smaragd','hunter','wachau','hermitage blanc','chateau grillet','chateau chalon','jasnieres','santorini'];
/* Champagnes waar de huizen zelf decennia voor rekenen. Staat los van de prijs: dit is de
   categorie, niet de kwaliteit van de fles. */
const PRESTIGE = ['dom perignon','cristal','comtes de champagne','salon','clos du mesnil','clos d ambonnay','grande dame','belle epoque','winston churchill','nicolas francois','palmes d or','la francaise','grand siecle','william deutz','amour de deutz','les chetillons','substance','vieilles vignes francaises','cuvee sir','noble cuvee','perle','cuvee prestige','rare','femme de champagne','absolu','esprit de','venus','fleur de passion','cazanove','hommage'];
/* Wijnen die juist jong moeten: die krijgen nooit een lang venster, wat de druif ook zegt. */
const VROEG = ['nouveau','primeur','joven','vinho verde','moscato d asti','frizzante','vin de soif','glou glou','piquette','txakoli','retsina','maceration','carbonique'];
/* Edelzoet: botrytis, ijswijn en strowijn gaan decennia mee. Lichtzoet niet. */
const EDELZOET = ['sauternes','barsac','tokaji','aszu','trockenbeerenauslese','beerenauslese','eiswein','ice wine','icewine','quarts de chaume','bonnezeaux','coteaux du layon','chaume','vin de paille','passito','recioto','monbazillac','loupiac','sainte croix du mont','auslese','vendanges tardives','selection de grains nobles','noble rot','essencia','szamorodni','strohwein','ausbruch','muffa','vin santo'];

/* Een fles zonder jaargang heeft geen rekenpunt. Vandaag nemen laat het venster elk jaar
   meeschuiven, en dan is een brut sans annee die vijf jaar in de kelder ligt nog altijd "net
   gekocht". Het jaar dat de fles in de kelder kwam is het eerlijkste anker dat we hebben. */
const vensterAnker = w => {
  const j = w && w.addedAt ? new Date(w.addedAt).getFullYear() : 0;
  return (j >= 1990 && j <= YR()) ? j : YR();
};
function estimateWindow(w){
  const v = Number(w.vintage) || vensterAnker(w);
  const g = norm((w.grapes||[]).join(' '));
  const r = norm([w.region, w.appellation, w.country, w.name, w.producer].filter(Boolean).join(' '));
  const has = (arr, s) => arr.some(x => s.includes(x));
  const b = vensterBasis(w, v, g, r, has);
  /* De jaargang rekt of kort, maar alleen bij een fles met een jaargang en een streek in de tabel. */
  const o = w.vintage ? jaargangOordeel(w) : null;
  const n = o ? o.niveau : 3;
  const dak = b.soort === 'madeira' ? 150 : 60;
  const duur = Math.min(dak, Math.max(1, Math.round((b.tot - v) * JAAR_FACTOR[n])));
  const start = Math.max(0, Math.round((b.van - v) * JAAR_START[n]));
  return { from: v + start, to: v + Math.max(start + 1, duur), soort: b.soort };
}
/* De kale categorie, zonder jaargangoordeel: van welk jaar tot welk jaar. */
function vensterBasis(w, v, g, r, has){
  if(has(VROEG, r)) return { van:v, tot:v+2, soort:'een fles voor de eerste jeugd' };
  switch(w.type){
    case 'mousserend': {
      /* Zonder jaargang is er geen rekenpunt: een brut sans année is klaar als je hem koopt en
         blijft een paar jaar goed. Mét jaargang is het een bewaarwijn, en champagne van een
         goed jaar is er een van decennia. Dat de oude regel hier op vijftien jaar stopte, is
         precies waarom gerijpte flessen ten onrechte "over de piek" heetten. */
      if(!w.vintage) return r.includes('champagne')
        ? { van:v, tot:v+7, soort:'champagne zonder jaargang' }
        : { van:v, tot:v+3, soort:'mousserende wijn zonder jaargang' };
      if(r.includes('champagne')){
        if(has(PRESTIGE, r)) return { van:v+8, tot:v+40, soort:'prestige cuvée uit de Champagne' };
        const druiven = (w.grapes||[]).map(norm).filter(Boolean);
        const bdb = /blanc de blancs/.test(r) || (druiven.length === 1 && druiven[0].includes('chardonnay'));
        return bdb ? { van:v+7, tot:v+30, soort:'vintage champagne, blanc de blancs' }
                   : { van:v+6, tot:v+25, soort:'vintage champagne' };
      }
      if(/franciacorta|trentodoc|cava de paraje|gran reserva|blanc de blancs|traditional method|methode traditionnelle|klassieke methode|sekt brut nature/.test(r))
        return { van:v+3, tot:v+15, soort:'mousserend van de traditionele methode' };
      if(/cava|cremant|sekt|espumante|metodo classico/.test(r)) return { van:v+1, tot:v+8, soort:'cava, crémant of sekt' };
      return { van:v, tot:v+3, soort:'lichte mousserende wijn' };
    }
    case 'oranje': return { van:v+1, tot:v+8, soort:'oranjewijn' };
    case 'rose':
      if(has(['bandol','tavel'], r)) return { van:v+1, tot:v+8, soort:'rosé om te bewaren' };
      return { van:v, tot:v+3, soort:'rosé voor het jaar erop' };
    case 'wit':
      if(has(R_WHITE_LONG, r)) return { van:v+2, tot:v+18, soort:'witte wijn uit een streek die rijpt' };
      if(has(G_LONG_WHITE, g)) return { van:v+1, tot:v+9, soort:'witte wijn van een druif die rijpt' };
      return { van:v, tot:v+4, soort:'witte wijn voor de eerste jaren' };
    case 'zoet':
      if(has(EDELZOET, r)) return { van:v+3, tot:v+45, soort:'edelzoete wijn' };
      if(/spatlese|kabinett|halbtrocken|feinherb/.test(r)) return { van:v+2, tot:v+35, soort:'restzoete riesling' };
      if(/riesling|chenin|furmint|moelleux|demi sec/.test(r)) return { van:v+2, tot:v+25, soort:'zoete wijn van een druif die rijpt' };
      return { van:v+1, tot:v+8, soort:'zoete wijn' };
    case 'versterkt': {
      if(/madeira|verdelho|bual|malmsey|sercial|terrantez/.test(r)) return { van:v, tot:v+150, soort:'madeira' };
      if(/vintage port|single quinta|colheita/.test(r) || (/\bport\b|porto/.test(r) && w.vintage && !/tawny|lbv|late bottled|ruby|white port|reserve/.test(r)))
        return { van:v+12, tot:v+55, soort:'vintage port' };
      if(/lbv|late bottled/.test(r)) return { van:v+4, tot:v+20, soort:'LBV-port' };
      if(/tawny|ruby|white port/.test(r)) return { van:v, tot:v+5, soort:'tawny of ruby, klaar bij het bottelen' };
      if(/fino|manzanilla/.test(r)) return { van:v, tot:v+2, soort:'fino of manzanilla, hoe verser hoe beter' };
      if(/amontillado|oloroso|palo cortado|px|pedro ximenez|cream|sherry|jerez/.test(r)) return { van:v, tot:v+25, soort:'sherry uit het vat' };
      if(/grenat|rimage/.test(r)) return { van:v+1, tot:v+12, soort:'vin doux naturel in de jonge stijl' };
      if(/banyuls|maury|rivesaltes|rasteau|vin doux|mavrodaphne|marsala|moscatel de setubal/.test(r)) return { van:v+2, tot:v+30, soort:'versterkte zoete wijn' };
      return { van:v, tot:v+15, soort:'versterkte wijn' };
    }
    default: {
      /* Rood. De oude regel gaf een Barolo achttien jaar en een geklasseerde Bordeaux net zo
         veel; dat is de helft van wat ze halen. Een grote naam uit een groot jaar is een fles
         van dertig jaar en meer, en dat mag de app niet wegpoetsen. */
      const top = /premier grand cru|grand cru class|1er grand cru|premier cru|grand cru|gran reserva|riserva|grosse lage|grosses gewachs|vega sicilia|unico/.test(r);
      if(has(R_BIG, r)) return top ? { van:v+8, tot:v+35, soort:'grote bewaarwijn uit een klassieke streek' }
                                   : { van:v+5, tot:v+25, soort:'rode wijn uit een streek die rijpt' };
      if(top) return { van:v+4, tot:v+20, soort:'rode wijn met een classificatie' };
      if(has(G_BIG_RED, g)) return { van:v+3, tot:v+15, soort:'rode wijn van een stevige druif' };
      if(has(G_LIGHT_RED, g)) return { van:v+1, tot:v+8, soort:'lichte rode wijn' };
      return { van:v+1, tot:v+9, soort:'rode wijn' };
    }
  }
}
/* Eenmalig rechtzetten van vensters die de oude regels hebben gezet.
   Een venster dat exact gelijk is aan wat oudVenster() zou geven, is door de app zelf bedacht
   en mag dus door de app zelf worden herzien: dat zijn de flessen die ten onrechte "over de
   piek" heetten. Alles wat iemand zelf invulde of uit een bestand kwam, wijkt daarvan af en
   blijft staan. Idempotent zonder vlag in de instellingen: wat hier langsgaat krijgt
   drinkSrc:'regels' en past daarna niet meer op de oude formule. Draait bij het opstarten, na
   een cloud-overname en na het inlezen van een back-up, want die brengen oude flessen mee. */
function vensterMigratie(){
  let n = 0;
  for(const w of (S.wines || [])){
    if(w.drinkSrc || (!w.drinkFrom && !w.drinkTo)) continue;
    const o = oudVenster(w);
    if(w.drinkFrom !== o.from || w.drinkTo !== o.to) continue;
    const nieuw = estimateWindow(w);
    w.drinkFrom = nieuw.from; w.drinkTo = nieuw.to; w.drinkSrc = 'regels';
    n++;
  }
  if(n) save(true);
  return n;
}

/* De jaargangtabel verandert bij elke onderzoeksronde: een jaar krijgt een niveau, een bron gaat
   iets anders zeggen, een appellation komt eindelijk in de goede streek terecht. Een venster dat
   de app zelf heeft gezet hoort dan mee te bewegen, anders loopt de kelder van iemand die de app
   een jaar geleden heeft gevuld achter op wat we sindsdien hebben uitgezocht.

   Wat níet meebeweegt: een venster dat jij zelf hebt gezet, dat van een etiketscan komt of dat uit
   een geïmporteerd bestand kwam. Alleen drinkSrc === 'regels' wordt herrekend, en dat veld wordt
   alleen gezet wanneer de app het getal zelf heeft bedacht. Een fles zonder dat veld blijft ook
   staan: van die vensters weten we de herkomst niet, en gokken is erger dan niets doen.

   TABEL_VERSIE gaat omhoog zodra STREKEN, RIJP_TABEL of de kelderregels wijzigen. */
const TABEL_VERSIE = 94;
function tabelMigratie(){
  if(!S || !S.settings) return 0;
  /* Alleen vooruit. Staat er een hoger nummer dan deze versie kent, dan heeft een nieuwere versie
     van de app dit al gedaan en zou herrekenen met oudere tabellen zijn werk terugdraaien. Dat kan
     gebeuren op een tweede apparaat dat nog niet is bijgewerkt: de kelder synct wel, het
     versienummer niet, want dat staat in de instellingen en die gaan niet mee de cloud in. */
  if(S.settings.tabelVersie >= TABEL_VERSIE) return 0;
  let n = 0;
  for(const w of (S.wines || [])){
    if(w.drinkSrc !== 'regels') continue;
    if(!w.drinkFrom && !w.drinkTo) continue;   // niets opgeslagen, dus ook niets te herrekenen
    const nieuw = estimateWindow(w);
    if(w.drinkFrom === nieuw.from && w.drinkTo === nieuw.to) continue;
    w.drinkFrom = nieuw.from; w.drinkTo = nieuw.to;
    n++;
  }
  /* De opgeslagen spijs-wijncombinaties zijn het enige dat niet vanzelf meebeweegt: alles wat de
     app op het scherm zet wordt bij elke render opnieuw uit de tabellen gerekend, maar de zin die
     de sommelier bij een gerecht schreef staat vast in de cache. Die is geschreven tegen de oude
     jaargangoordelen en kan de nieuwe badge op dezelfde kaart tegenspreken. Weggooien kost niets
     blijvends: het is een gemakscache van hoogstens dertig gerechten, hij wordt bij de volgende
     vraag opnieuw gevuld, en er zat al een knop "vernieuw" bij. De flessen zelf, de geschiedenis,
     de verlanglijst, de locaties en wat er vanavond op tafel staat blijven onaangeroerd. */
  const gerechten = (S.pairCache || []).length;
  if(gerechten) S.pairCache = [];
  S.settings.tabelVersie = TABEL_VERSIE;
  save(true);
  return n;
}

/* De oude formule, bevroren. Alleen nog in gebruik om te herkennen dat een venster in een
   bestaande kelder door de oude regels is gezet en dus veilig herrekend mag worden
   (vensterMigratie). Nooit ergens anders aanroepen. */
function oudVenster(w){
  const v = w.vintage || YR();
  const g = norm((w.grapes||[]).join(' '));
  const r = norm([w.region, w.appellation, w.country, w.name].filter(Boolean).join(' '));
  const inLijst = (arr, s) => arr.some(x => s.includes(x));
  const OUD_LONG_WHITE = ['riesling','chardonnay','chenin','semillon','savagnin','assyrtiko','gruner','furmint'];
  const OUD_LIGHT_RED = ['gamay','pinot','frappato','zweigelt','schiava','cinsault','trousseau','poulsard'];
  const OUD_BIG_RED = ['cabernet','syrah','shiraz','nebbiolo','sangiovese','tempranillo','mourvedre','monastrell','tannat','malbec','aglianico','touriga','petit verdot','sagrantino','xinomavro'];
  const OUD_R_BIG = ['barolo','barbaresco','brunello','pauillac','margaux','saint julien','saint estephe','pessac','pomerol','saint emilion','medoc','hermitage','cote rotie','cornas','chateauneuf','gran reserva','ribera','priorat','bandol','madiran','taurasi','amarone','napa','bolgheri'];
  const OUD_WHITE_LONG = ['meursault','puligny','chassagne','corton','chablis grand','chablis premier','savennieres','vouvray','mosel','rheingau','grand cru','smaragd','hunter'];
  switch(w.type){
    case 'mousserend':
      if(!w.vintage){ const y = YR(); return {from:y, to:y+2}; }
      return r.includes('champagne') ? {from:v+5, to:v+15} : {from:v+1, to:v+6};
    case 'oranje': return {from:v+1, to:v+6};
    case 'rose': return {from:v, to:v+2};
    case 'wit':
      if(inLijst(OUD_WHITE_LONG, r)) return {from:v+2, to:v+10};
      if(inLijst(OUD_LONG_WHITE, g)) return {from:v+1, to:v+6};
      return {from:v, to:v+3};
    case 'zoet': return {from:v+2, to:v+20};
    case 'versterkt': return /vintage/.test(r) ? {from:v+10, to:v+40} : {from:v, to:v+15};
    default:
      if(inLijst(OUD_R_BIG, r)) return {from:v+5, to:v+18};
      if(inLijst(OUD_BIG_RED, g)) return {from:v+3, to:v+12};
      if(inLijst(OUD_LIGHT_RED, g)) return {from:v+1, to:v+6};
      return {from:v+2, to:v+8};
  }
}

/* Eén plek die bepaalt of een trefwoord in een gerecht staat, gedeeld door de kelderregels,
   de zoekbalk en de kaartgids. Werkt op de genormaliseerde tekst (kleine letters, leestekens
   weg), dus "kalfsfond-witte-wijn-saus" wordt "kalfsfond witte wijn saus". */
const kwReCache = new Map();
function kwRe(k){
  let re = kwReCache.get(k);
  if(!re){
    const prefix = k.endsWith('*'), suffix = k.startsWith('*');
    const kern = norm(k.replace(/^\*|\*$/g, '')).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    re = new RegExp((suffix ? '' : '(^| )') + kern + (prefix ? '' : '( |$)'));
    kwReCache.set(k, re);
  }
  return re;
}
const foodCats = text => { const t = norm(text); return FOODS.filter(f => f.kw.some(k => kwRe(k).test(t))); };

/* scoort de hele kelder tegen een gerecht; gedeeld door de kelderregels
   (winesForDish) en het voorfilter dat de AI-prompt klein houdt */
/* gewicht van een gerecht voor een type; oranje leent van wit en rood */
const foodW = (c, t) => c.w[t] ?? (t === 'oranje' ? Math.max(c.w.wit || 0, (c.w.rood || 0) - 1) : 0);
function scoreWines(text){
  const cats = foodCats(text);
  const scored = S.wines.filter(w => w.qty > 0).map(w => {
    let sc = 0; let reason = ''; let grapeHit = false; let cat = null, catW = 0, fit = 0;
    const pt = pairType(w);
    if(cats.length){
      for(const c of cats){
        const tw = foodW(c, pt); sc += tw; fit += tw;
        if(tw > 0 && (w.grapes||[]).some(g => c.g.some(cg => norm(g).includes(cg)))){ sc += 1.6; grapeHit = true; }
        if(tw >= 3 && !reason) reason = c.rW;
        if(tw > catW){ catW = tw; cat = c; }   /* de categorie waar deze fles het best bij past, voor de reden */
      }
      sc = sc / cats.length;
      /* past de kleur nergens bij (zoet bij bisque), dan mag urgentie of smaak hem niet alsnog in de lijst tillen */
      if(fit <= 0) return null;
    } else sc = 1.6;
    const st = windowStatus(w);
    /* urgentie telt mee: wat op moet en past, schenk je juist nú */
    if(st.k==='op') sc += 0.9; else if(st.k==='nu') sc += 1.4; else if(st.k==='jong') sc -= 1.3; else if(st.k==='over') sc += 0.8;
    /* je smaak: een druif of streek waar je van houdt krijgt een duwtje, een afkeer een tikje */
    sc += 0.8 * smaakMatch(w);
    return {w, sc, reason, grapeHit, st, cat, catW};
  }).filter(x => x && x.sc > 1).sort((a,b) => b.sc - a.sc);
  return {cats, scored};
}

function winesForDish(text){
  const {cats, scored:all} = scoreWines(text);
  const scored = all.slice(0,5);
  const mx = Math.max(4.8, ...scored.map(x=>x.sc));
  scored.forEach(x => {
    x.score = Math.max(4, Math.min(10, Math.round(x.sc / mx * 10)));
    x.rHtml = regelReden(x);
  });
  return {cats, list:scored};
}

/* De reden per fles zegt wat déze fles onderscheidt (druif, herkomst, kleur); de regel zelf
   ("zilte schaaldieren vragen om bubbels of strak wit") staat één keer boven de lijst, niet
   vijf keer hetzelfde onder elke kaart. */
function regelReden(x){
  const w = x.w, c = x.cat, pt = pairType(w);
  if(!c) return 'Veelzijdige keuze uit je kelder.';
  const label = c.label.toLowerCase();
  const druif = (w.grapes||[]).slice(0, 2).join(' en ');
  const herkomst = w.region || w.country || '';
  const typeL = (TYPES[pt] ? TYPES[pt].l : pt).toLowerCase();
  const kop = (druif || (TYPES[pt] ? TYPES[pt].l : 'Deze fles')) + (herkomst ? ' uit ' + herkomst : '');
  if(x.grapeHit) return `${kop}: een klassieke druif bij ${label}.`;
  if(x.catW >= 3) return druif ? `${kop}: ${typeL}, het register van ${label}.` : `${kop}, het register van ${label}.`;
  return `${kop}: ${typeL} kan hier ook, al is het niet de eerste keuze bij ${label}.`;
}

function dishesForWine(w){
  const pt = pairType(w);
  const ranked = FOODS.map(c => {
    let sc = foodW(c, pt);
    if(sc > 0 && (w.grapes||[]).some(g => c.g.some(cg => norm(g).includes(cg)))) sc += 2;
    return {c, sc};
  }).filter(x => x.sc >= 3).sort((a,b) => b.sc - a.sc).slice(0,5);
  const out = [];
  for(const {c} of ranked){
    out.push({dish:c.dishes[0], reason:c.rW.charAt(0).toUpperCase()+c.rW.slice(1)+'.'});
    if(c.dishes[1] && out.length < 6 && ranked.length < 4) out.push({dish:c.dishes[1], reason:'Zelfde register: '+c.rW+'.'});
  }
  return out.slice(0,6);
}

/* Een eigen Anthropic-sleutel is geen productfunctie meer: hij bestaat alleen nog

   stand wordt een opgeslagen sleutel genegeerd en loopt alles via de CellarMentor-server,
   waar het tegoed geldt. Volledig dichttimmeren kan niet: dit is een app die in de
   browser draait, dus wie zelf code aanpast kan altijd zijn eigen sleutel gebruiken.
   Wat dit wél doet: het uit het product halen, zodat niemand het tegenkomt. */

/* Antwoordstijl (instelbaar in Instellingen): bepaalt de toon van alle AI-teksten */

const STIJLREGELS = ' Schrijf in gewone zinnen met komma\'s en punten. Gebruik geen gedachtestreepjes (\u2014) en vermijd de constructie "niet X, maar Y".';

/* Engelse stand: alles wat de gebruiker leest in het Engels, ook waar de prompt om Nederlands vraagt; JSON-sleutels en vaste waarden blijven zoals opgegeven. */
const taalNote = () => taal() === 'en' ? ' Write every text meant for the user in English, even where these instructions ask for Dutch ("Nederlands"); keep JSON keys and fixed enum values exactly as specified.' : '';

/* Wat een AI-actie kost aan tegoed. Moet gelijk blijven aan creditsFor() in
   supabase/functions/ai/index.ts: foto's bepalen de kosten, en een kaartpagina (1568 px)
   is ongeveer twee keer zo duur als een etiket (1100 px). */
function creditCost(kind, images){
  images = images || 0;
  if(kind === 'wijnkaart') return Math.max(2, images * 2);
  if(kind === 'prijs') return 1;      /* zoeklaag: één Brave-zoekopdracht plus Haiku, rond een cent */
  if(kind === 'prijsdiep') return 5;  /* de zoekagent met webtool: gemeten ± $0,06 per fles */
  return Math.max(1, images);
}

/* Routering: eigen sleutel gaat vóór (rechtstreeks naar Anthropic, onbeperkt);
   anders via de CellarMentor-serverfunctie met het account-tegoed.
   onText (optioneel) maakt er een stroom van: die wordt bij elk stukje antwoord
   aangeroepen met alles wat er tot dan toe staat, zodat het scherm meeleest. */
async function callClaude(content, maxTokens, kind, onText, opts){
  if(ownKey()) return callAnthropicDirect(content, maxTokens, onText, opts);
  if(typeof sbAI === 'function' && typeof loggedIn === 'function' && loggedIn()) return sbAI(content, maxTokens, kind, onText, opts);
  throw new Error('Log in (Meer → Account) of vul een API-sleutel in');
}
/* Kan deze browser een antwoord stuk voor stuk lezen? Zo niet, dan wachten we
   gewoon op het hele antwoord zoals vroeger; alles blijft werken. */
const CAN_STREAM = typeof ReadableStream !== 'undefined' && typeof TextDecoder !== 'undefined'
  && typeof Response !== 'undefined' && 'body' in Response.prototype;

/* Anthropic stuurt server-sent events: regels 'data: {…}'. We plukken de tekst
   eruit en geven na elk stukje door wat er nu staat. */
async function readSSE(res, onText){
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', out = '';
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i+1);
      if(!line.startsWith('data:')) continue;
      const raw = line.slice(5).trim();
      if(!raw || raw === '[DONE]') continue;
      let ev; try{ ev = JSON.parse(raw); }catch(e){ continue; }
      if(ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'Fout tijdens het lezen');
      if(ev.type === 'content_block_delta' && ev.delta && typeof ev.delta.text === 'string'){
        out += ev.delta.text;
        if(onText) try{ onText(out); }catch(e){}
      }
    }
  }
  return out;
}
async function callAnthropicDirect(content, maxTokens, onText, opts){
  const model = (S.settings.model||'claude-sonnet-5').trim();
  const body = { model, max_tokens:maxTokens||2000, messages:[{role:'user', content}] };
  /* zoekagent: de server-side webzoekfunctie van de API, alleen voor prijzen */
  if(opts && opts.web) body.tools = [{type:'web_search_20260209', name:'web_search', max_uses:4}];
  /* Sonnet 5 / Opus 5 denken standaard mee in het antwoordbudget, en voor JSON-extractie
     zetten we dat uit (sneller, goedkoper, geen afgekapte JSON). Fable/Mythos en Haiku
     accepteren dit veld niet op dezelfde manier: daar weglaten. */
  if(/sonnet-[45]|opus-[45]/.test(model)) body.thinking = {type:'disabled'};
  const stream = !!onText && CAN_STREAM;
  if(stream) body.stream = true;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', signal: tijdslimiet(120000),
    headers:{ 'content-type':'application/json', 'x-api-key':ownKey(),
      'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('API '+res.status+': '+t.slice(0,200)); }
  if(stream && res.body) return readSSE(res, onText);
  const d = await res.json();
  return (d.content||[]).filter(b => b.type==='text').map(b => b.text).join('');
}
function parseJsonLoose(s){
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b <= a) throw new Error('Geen JSON in antwoord');
  return JSON.parse(s.slice(a, b+1));
}

/* Wat er al leesbaar in het halve antwoord staat. Een sleutel-waardepaar telt pas
   mee als het afsluitende aanhalingsteken binnen is, dus je ziet nooit een halve
   naam staan. Puur om mee te kijken; het echte invullen gebeurt aan het eind. */
/* Alles wat er nu al compleet in het halve antwoord staat. Een waarde telt pas
   mee als hij is afgesloten, dus je ziet nooit een halve naam of een half lijstje. */
function scanPartial(txt){
  const uit = {};
  const tekst = k => {
    const m = txt.match(new RegExp('"' + k + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
    if(!m) return undefined;
    try{ return JSON.parse('"' + m[1] + '"'); }catch(e){ return undefined; }
  };
  const jaar = k => { const m = txt.match(new RegExp('"' + k + '"\\s*:\\s*(\\d{4})')); return m ? +m[1] : undefined; };
  for(const k of ['name','producer','type','country','region','appellation','score_seen']){
    const v = tekst(k); if(v !== undefined) uit[k] = v;
  }
  for(const k of ['vintage','drink_from','drink_to']){
    const v = jaar(k); if(v !== undefined) uit[k] = v;
  }
  const g = txt.match(/"grapes"\s*:\s*\[([^\]]*)\]/);
  if(g){ try{ uit.grapes = JSON.parse('[' + g[1] + ']'); }catch(e){} }
  return uit;
}
/* Zet binnengekomen velden in het formulier, behalve waar de gebruiker al typte. */
/* Alleen het scanformulier in #view: elk formulier gebruikt dezelfde veld-ids (f_name …), en een
   bewerkvenster dat intussen open ging zou anders het etiket van de scan over een andere fles krijgen. */
const scanRoot = () => (UI.tab === 'scan' && scan.stage === 'confirm' && !sheets.length) ? document.getElementById('view') : null;
function vulFormLive(d){
  const root = scanRoot(); if(!root) return;
  const zet = (id, v) => {
    if(v === undefined || v === null || v === '') return;
    if(scanTouched.has(id)) return;
    const el = root.querySelector('#' + id);
    if(el && el.value !== String(v)) el.value = v;
  };
  zet('f_name', d.name); zet('f_producer', d.producer); zet('f_vintage', d.vintage);
  zet('f_country', d.country); zet('f_region', d.region); zet('f_app', d.appellation);
  zet('f_from', d.drink_from); zet('f_to', d.drink_to); zet('f_score', d.score_seen);
  if(d.grapes && d.grapes.length) zet('f_grapes', d.grapes.join(', '));
  if(d.type && eigenSleutel(TYPES, d.type) && !scanTouched.has('f_type')){
    const seg = root.querySelector('#f_type');
    if(seg) seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === d.type));
  }
}
/* Heeft de gebruiker tijdens het lezen zelf iets ingevuld, dan wint dat van het
   antwoord. Zonder dit haalt de laatste render zijn correctie er weer af. */
function behoudEigenInvoer(d){
  if(!scanTouched.size) return;
  const root = scanRoot(); if(!root) return;
  const f = readForm(root);
  const paar = [['f_name','name','name'], ['f_producer','producer','producer'],
    ['f_vintage','vintage','vintage'], ['f_grapes','grapes','grapes'],
    ['f_country','country','country'], ['f_region','region','region'],
    ['f_app','appellation','appellation'], ['f_from','drink_from','drinkFrom'],
    ['f_to','drink_to','drinkTo'], ['f_score','score_seen','score']];
  for(const [id, inAntwoord, inFormulier] of paar) if(scanTouched.has(id)) d[inAntwoord] = f[inFormulier];
  if(scanTouched.has('f_type')) d.type = f.type;
}
function scanPeek(txt){
  const tekst = k => {
    const m = txt.match(new RegExp('"' + k + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
    if(!m) return '';
    try{ return JSON.parse('"' + m[1] + '"'); }catch(e){ return ''; }
  };
  const jaar = () => { const m = txt.match(/"vintage"\s*:\s*(\d{4})/); return m ? m[1] : ''; };
  const naam = tekst('name'), prod = tekst('producer');
  /* bij een château is de naam vaak ook de producent, die niet twee keer tonen */
  return [naam, prod === naam ? '' : prod, jaar(), tekst('appellation') || tekst('region') || tekst('country')]
    .filter(Boolean).join(' · ');

const CELLAR_ALL = 100;  /* tot zoveel flessen gaat de hele kelder mee in de pairing-prompt (± 35 tokens per fles) */
let cellarIdx = [];   /* volgnummer → wijn, voor de pairing-prompt (UUID's zijn een derde van de tokens) */
const wineLine = (w, n) => `${n} | ${w.name} | ${w.producer||'?'} | ${w.vintage||'NV'} | ${TYPES[w.type]?TYPES[w.type].l:w.type}${pairType(w) !== w.type ? ' (zoete appellation, dessertwijn)' : ''} | ${(w.grapes||[]).join('/')||'?'} | ${[w.region,w.country].filter(Boolean).join(', ')||'?'} | ${windowStatus(w).label}`;
const URGENTIE = {nu:0, rijp:1, over:2, op:3};   /* wat op moet eerst, dan de rest */
const urgentieVolgorde = (a, b) => (URGENTIE[windowStatus(a).k] ?? 3) - (URGENTIE[windowStatus(b).k] ?? 3);

/* Tot CELLAR_ALL flessen gaat de hele kelder mee: de sommelier kiest dan echt uit alles, en dat kost
   op honderd flessen nog geen cent. Daarboven maken de kelderregels een ruime voorselectie, met per
   kleur altijd de beste paar erbij, zodat één verkeerd gelezen gerecht nooit een hele kleur buiten
   beeld zet, en wat op moet nooit uit beeld valt. */
function cellarLines(dish){
  const inStock = S.wines.filter(w => w.qty > 0);
  let list = inStock;
  if(inStock.length > CELLAR_ALL){
    const pick = new Map();
    const {cats, scored} = dish ? scoreWines(dish) : {cats:[], scored:[]};
    if(cats.length) scored.slice(0, CELLAR_ALL - 30).forEach(x => pick.set(x.w.id, x.w));
    for(const t of Object.keys(TYPES)){
      inStock.filter(w => w.type === t && !pick.has(w.id)).sort(urgentieVolgorde).slice(0, 4).forEach(w => pick.set(w.id, w));
    }
    inStock.filter(w => ['nu','rijp','over'].includes(windowStatus(w).k) && !pick.has(w.id)).slice(0, 8).forEach(w => pick.set(w.id, w));
    if(pick.size < CELLAR_ALL) inStock.filter(w => !pick.has(w.id)).slice(0, CELLAR_ALL - pick.size).forEach(w => pick.set(w.id, w));
    list = [...pick.values()];
  }
  cellarIdx = list.slice(0, 120);
  return cellarIdx.map((w, i) => wineLine(w, i + 1)).join('\n');
}

/* smaakprofiel: waar de gebruiker eerder hoge cijfers aan gaf; helpt bij een vreemde kaart */
function tasteLines(){
  const seen = new Set(), out = [];
  for(const h of (S.history||[])){
    if((h.rating||0) < 4 || !h.name) continue;
    const k = norm(h.name); if(seen.has(k)) continue; seen.add(k);
    out.push(`${h.name}${h.vintage?' '+h.vintage:''} (${TYPES[h.type]?TYPES[h.type].l:h.type})${h.rating>=4.5?', top':''}`);
    if(out.length >= 8) break;
  }
  return out.join('; ');
}

/* foto verkleinen */
/* Een etiket bij kaarslicht komt er donker en vlak uit, en dan valt er voor de
   sommelier weinig te lezen. Is de foto donker, dan leggen we zwart- en witpunt op
   de werkelijke uitersten (op 1% aan elke kant na) en trekken we de donkere delen
   met een lichte gamma omhoog. Bij een normaal belichte foto gebeurt er niets. */
function liftDark(ctx, w, h){
  let im; try{ im = ctx.getImageData(0, 0, w, h); }catch(e){ return false; }
  const d = im.data, n = d.length / 4, hist = new Uint32Array(256);
  let sum = 0;
  for(let i = 0; i < d.length; i += 4){
    const y = (d[i]*299 + d[i+1]*587 + d[i+2]*114) / 1000 | 0;
    hist[y]++; sum += y;
  }
  if(sum / n > 105) return false;                  /* helder genoeg */
  const cut = Math.max(1, Math.round(n * 0.01));
  let lo = 0, hi = 255, acc = 0;
  for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= cut){ lo = v; break; } }
  acc = 0;
  for(let v = 255; v >= 0; v--){ acc += hist[v]; if(acc >= cut){ hi = v; break; } }
  if(hi - lo < 24) return false;                   /* vlak beeld: uitrekken vergroot alleen de ruis */
  const scale = 255 / (hi - lo), lut = new Uint8Array(256);
  for(let v = 0; v < 256; v++){
    const x = Math.min(1, Math.max(0, (v - lo) * scale / 255));
    lut[v] = Math.round(Math.pow(x, 0.85) * 255);
  }
  for(let i = 0; i < d.length; i += 4){ d[i] = lut[d[i]]; d[i+1] = lut[d[i+1]]; d[i+2] = lut[d[i+2]]; }
  ctx.putImageData(im, 0, 0);
  return true;
}
function resizeImg(file, maxW, q, opts){
  opts = opts || {};
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, maxW / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*sc));
      c.height = Math.max(1, Math.round(img.height*sc));
      const ctx = c.getContext('2d', {willReadFrequently: !!opts.lift});
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const lifted = opts.lift ? liftDark(ctx, c.width, c.height) : false;
      URL.revokeObjectURL(url);
      /* Al klein genoeg én niets bijgetrokken? Dan houden we de originele bytes.
         Een tweede JPEG-ronde kost juist het fijne detail dat bij weinig licht
         het verschil maakt tussen lezen en gokken. Alleen voor echte JPEG's:
         de rest moet hoe dan ook omgezet, want we sturen hem als image/jpeg. */
      if(opts.keep && sc >= 1 && !lifted && file.type === 'image/jpeg'){
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = () => res(c.toDataURL('image/jpeg', q));
        fr.readAsDataURL(file);
        return;
      }
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Foto kon niet worden gelezen')); };
    img.src = url;
  });
}

function filteredWines(){
  let a = S.wines.slice();
  let gerechtVolgorde = null;   /* een gerecht in de zoekbalk: sorteren op wat erbij past */
  UI.qGerecht = null;
  if(UI.q){ const q = norm(UI.q);
    const tekst = w => norm([w.name,w.producer,w.region,w.country,w.appellation,(w.grapes||[]).join(' '),w.location,w.note,w.vintage].join(' ')).includes(q);
    const opTekst = a.filter(tekst);
    /* Alleen als geen enkele fles op de tekst past én de tekst een gerecht bevat (foodCats kijkt per heel
       woord: "lam" of "lamsbout met", niet "Lamothe"). Zo wint een fles altijd van een gerecht. */
    const {cats, scored} = (!opTekst.length && q.length >= 3) ? scoreWines(UI.q) : {cats:[], scored:[]};
    if(cats.length){
      UI.qGerecht = cats;
      gerechtVolgorde = new Map(scored.map((x, i) => [x.w.id, i]));
      a = a.filter(w => gerechtVolgorde.has(w.id));
    } else a = opTekst; }
  if(UI.ftype) a = a.filter(w => w.type === UI.ftype);
  if(UI.fstatus) a = a.filter(w => ['op','nu','rijp'].includes(windowStatus(w).k));
  if(UI.fovertijd) a = a.filter(w => windowStatus(w).k === 'over');
  if(UI.floc) a = a.filter(w => UI.floc === '::none' ? !w.location : (w.location||'') === UI.floc);
  if(UI.fland) a = a.filter(w => (w.country||'Onbekend') === UI.fland);
  if(UI.fjaar) a = a.filter(w => String(w.vintage||'NV') === UI.fjaar);
  const by = {
    recent: (x,y) => (y.addedAt||0) - (x.addedAt||0),
    naam:   (x,y) => (x.name||'').localeCompare(y.name||'', 'nl'),
    jaar:   (x,y) => (x.vintage||9999) - (y.vintage||9999),
    venster:(x,y) => (URG[windowStatus(x).k] - URG[windowStatus(y).k]) || ((x.drinkTo||9999) - (y.drinkTo||9999)),
    waarde: (x,y) => ((Number(y.value ?? y.price)||0) - (Number(x.value ?? x.price)||0)),
    score:  (x,y) => (scoreNum(y) - scoreNum(x)) || (x.name||'').localeCompare(y.name||'', 'nl')
  };
  if(gerechtVolgorde) a.sort((x, y) => gerechtVolgorde.get(x.id) - gerechtVolgorde.get(y.id));
  else a.sort(by[UI.sort] || by.recent);
  return a;
}

/* Twee lagen: wat je zelf aangeeft (druiven, streken, vijf schuifjes, kleur) en
   wat de sterren in je historie laten zien. Gaat als één regel mee in de
   AI-prompts en telt mee in de kelderregels. Staat in S.settings en dus per apparaat: cloudDoc()
   neemt instellingen niet mee, het smaakprofiel synct niet. */
const SMAAK_DRUIVEN = ['Cabernet Sauvignon','Merlot','Pinot Noir','Syrah','Grenache','Tempranillo','Sangiovese','Nebbiolo','Malbec','Cabernet Franc','Gamay','Mourvèdre','Barbera','Primitivo','Zinfandel',
  'Chardonnay','Sauvignon Blanc','Riesling','Chenin Blanc','Pinot Grigio','Viognier','Grüner Veltliner','Albariño','Verdejo','Gewürztraminer'];
const SMAAK_REGIOS = ['Bordeaux','Bourgogne','Rhône','Loire','Champagne','Languedoc','Provence','Elzas','Piemonte','Toscane','Veneto','Sicilië','Rioja','Ribera del Duero','Priorat','Douro','Mosel','Oostenrijk','Californië','Chili','Argentinië','Zuid-Afrika','Australië','Nieuw-Zeeland'];
const SMAAK_SCHUIF = [
  ['body',    'Licht',          'Vol'],
  ['tannine', 'Weinig tannine', 'Veel tannine'],
  ['zuur',    'Zacht en rond',  'Fris en strak'],
  ['zoet',    'Droog',          'Zoet'],
  ['hout',    'Geen hout',      'Veel hout'],
];
function smaak(){
  if(!S.settings.smaak) S.settings.smaak = {druiven:[], regios:[], schuif:{}, kleur:''};
  const p = S.settings.smaak;
  p.druiven = p.druiven || []; p.regios = p.regios || []; p.schuif = p.schuif || []; p.notities = p.notities || {tekst:'', bijN:0};
  return p;
}
/* Wat de sterren in je historie laten zien: per druif, streek en type het
   gemiddelde, en alleen als er genoeg is om iets van te vinden. */
function smaakGeleerd(){
  const per = {druif:{}, regio:{}, type:{}};
  const tel = (kant, k, r) => { if(!k) return; const key = norm(k); const e = per[kant][key] || (per[kant][key] = {n:0, som:0, naam:k}); e.n++; e.som += r; };
  let n = 0;
  const perId = new Map(S.wines.map(w => [w.id, w]));
  for(const h of (S.history||[])){
    const r = Number(h.rating); if(!(r > 0)) continue;
    n++;
    const w = h.wineId ? perId.get(h.wineId) : null;
    (h.grapes || (w && w.grapes) || []).forEach(g => tel('druif', g, r));
    tel('regio', h.region || (w && w.region), r);
    tel('type', TYPES[h.type] ? TYPES[h.type].l : '', r);
  }
  const pluk = (kant, test, min) => Object.values(per[kant]).filter(e => e.n >= (min || 2) && test(e.som / e.n)).sort((a,b) => b.som/b.n - a.som/a.n).map(e => e.naam);
  return { n, genoeg: n >= 5,
    hoog: {druif: pluk('druif', a => a >= 4), regio: pluk('regio', a => a >= 4), type: pluk('type', a => a >= 4)},
    /* een hele streek afschrijven vraagt meer bewijs dan één druif */
    laag: {druif: pluk('druif', a => a <= 2.5), regio: pluk('regio', a => a <= 2.5, 3), type: pluk('type', a => a <= 2.5, 3)} };
}
let _smaakSets = null;   /* memo: leegt in save() */
function smaakSets(){
  if(_smaakSets) return _smaakSets;
  const p = smaak(), L = smaakGeleerd();
  const fav = new Set([...p.druiven, ...(L.genoeg ? L.hoog.druif : [])].map(norm));
  const favR = new Set([...p.regios, ...(L.genoeg ? L.hoog.regio : [])].map(norm));
  const nee = new Set((L.genoeg ? L.laag.druif : []).map(norm));
  const neeR = new Set((L.genoeg ? L.laag.regio : []).map(norm));
  return (_smaakSets = {fav, favR, nee, neeR});
}
/* +1 past bij je smaak, -1 juist niet, 0 niets over te zeggen */
function smaakMatch(w){
  const s = smaakSets();
  const gs = (w.grapes || []).map(norm), r = norm([w.region, w.appellation, w.country].filter(Boolean).join(' '));
  const raak = set => gs.some(g => [...set].some(f => g.includes(f) || f.includes(g)));
  const raakR = set => [...set].some(f => f && r.includes(f));
  if(raak(s.fav) || raakR(s.favR)) return 1;
  if(raak(s.nee) || raakR(s.neeR)) return -1;
  return 0;
}
const smaakHit = w => smaakMatch(w) > 0;

function smaakNote(){

  if(p.regios.length) delen.push('drinkt graag wijn uit ' + p.regios.join(', '));
  const s = p.schuif || {};

    body:    ['heel lichte wijnen', 'lichte wijnen', '', 'volle wijnen', 'heel volle wijnen'],
    tannine: ['nauwelijks tannine', 'weinig tannine', '', 'stevige tannine', 'veel tannine'],
    zuur:    ['zacht en rond', 'eerder rond dan fris', '', 'fris', 'strak en fris'],
    zoet:    ['', '', 'een vleugje zoet mag', 'graag wat zoet', 'zoete wijnen'],
    hout:    ['geen hout', 'weinig hout', '', 'graag wat hout', 'veel hout'],
  };
  const stijl = Object.keys(woord).map(k => s[k] != null && woord[k][s[k]] ? woord[k][s[k]] : '').filter(Boolean);
  if(stijl.length) delen.push('voorkeur voor ' + stijl.join(', '));

/* Relatief aan de eigen kelder, nooit absolute prijsklassen, en alleen naar

const vandaag = () => new Date().toISOString().slice(0,10);

const datumOf = t => /^\d{4}-\d{2}-\d{2}/.test(String(t || '')) ? String(t).slice(0, 10) : vandaag();

function prijsAlsBron(w){

  const geschat = w.value == null || w.valueSrc === 'ai' || !w.valueSrc;
  if(!geschat || (w.value != null && w.value >= p * 0.8)) return false;
  w.value = Math.round(p); w.valueSrc = 'eigen'; w.valueVia = 'aankoop'; w.valueAt = vandaag();
  w.valueBron = null; w.valueLow = null; w.valueHigh = null;

const KLASSEN = [
  [/brunello/i, 'Brunello'], [/\bbarolo\b/i, 'Barolo'], [/barbaresco/i, 'Barbaresco'], [/amarone/i, 'Amarone'],
  [/premier grand cru class/i, 'Premier Grand Cru Classé'], [/grand cru class/i, 'Grand Cru Classé'],
  [/\bcru bourgeois\b/i, 'Cru Bourgeois'], [/\bcru class/i, 'Cru Classé'],
  [/\bgrand cru\b/i, 'Grand Cru'], [/premier cru|1er cru/i, 'Premier Cru'],
  [/gran reserva/i, 'Gran Reserva'], [/\briserva\b/i, 'Riserva'], [/\breserva\b/i, 'Reserva'],
  [/vintage port/i, 'Vintage Port'], [/late bottled vintage|\bLBV\b/, 'LBV'],

  [/\bdocg\b/i, 'DOCG'],

function klasse(w){

}

/* Alleen een prijs met bron telt als waarde: opgezocht ('zoek'), zelf ingevuld of aankoopprijs
