/* ---- rek met vakjes: een locatie kan rijen × kolommen hebben, elk vak houdt hoogstens één fles.
   Het rek bezit de kaart (rek.vakken = {"B3": wineId}); de wijn zelf weet er niets van. ---- */
const VAK_KLEUR = {rood:'--t-rood', wit:'--t-wit', rose:'--t-rose', mousserend:'--t-mous', zoet:'--t-zoet', versterkt:'--t-vers'};
function rekVan(name){ const e = name ? locEntry(name) : null; return (e && e.rek && e.rek.rijen > 0 && e.rek.kolommen > 0) ? e.rek : null; }
const vakNaam = (r, c) => String.fromCharCode(65 + r) + (c + 1);
const vakSort = (a, b) => a[0] === b[0] ? parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10) : (a < b ? -1 : 1);
function rekVakken(name, wineId){ const rek = rekVan(name); if(!rek || !rek.vakken) return []; return Object.keys(rek.vakken).filter(k => rek.vakken[k] === wineId).sort(vakSort); }
/* alle vakken van een wijn, in welk rek ook (na een verhuizing kan er iets achterblijven) */
function vakkenVan(wineId){
  const uit = [];
  (S.locations||[]).forEach(e => { const rek = rekVan(e.name); if(rek && rek.vakken) Object.keys(rek.vakken).forEach(k => { if(rek.vakken[k] === wineId) uit.push({loc:e.name, key:k}); }); });
  return uit;
}
function rekVoegToe(name, wineId, keys){ const rek = rekVan(name); if(!rek) return; rek.vakken = rek.vakken || {}; keys.forEach(k => { if(vakGeldig(rek, k) && !rek.vakken[k]) rek.vakken[k] = wineId; }); }
/* vervangt de vakken van deze wijn in dit rek */
function rekZet(name, wineId, keys){ const rek = rekVan(name); if(!rek) return; rek.vakken = rek.vakken || {}; Object.keys(rek.vakken).forEach(k => { if(rek.vakken[k] === wineId) delete rek.vakken[k]; }); rekVoegToe(name, wineId, keys); }
/* haalt n vakken van een wijn weg (de laatste eerst); geeft terug wat er vrijkwam, voor "ongedaan" */
function rekVrij(wineId, n){
  const alle = vakkenVan(wineId).sort((a, b) => a.loc === b.loc ? vakSort(a.key, b.key) : a.loc.localeCompare(b.loc, 'nl'));
  const weg = alle.slice(Math.max(0, alle.length - n));
  weg.forEach(v => { const rek = rekVan(v.loc); if(rek && rek.vakken) delete rek.vakken[v.key]; });
  return weg;
}
function rekHerstel(weg, wineId){ weg.forEach(v => rekVoegToe(v.loc, wineId, [v.key])); }
/* meer vakken dan flessen (na afboeken) → de overtollige vrijgeven */
function rekBijQty(w){ const teveel = vakkenVan(w.id).length - (w.qty||0); return teveel > 0 ? rekVrij(w.id, teveel) : []; }
function rekVrijeVakken(name, behalve){
  const rek = rekVan(name); if(!rek) return [];
  const uit = [];
  for(let r = 0; r < rek.rijen; r++) for(let c = 0; c < rek.kolommen; c++){ const k = vakNaam(r, c); const id = (rek.vakken||{})[k]; if((!id || !findWine(id)) && !(behalve && behalve.has(k))) uit.push(k); }
  return uit;
}
const vakKort = (keys, max=4) => keys.length <= max ? keys.join(', ') : keys.slice(0, max).join(', ') + ` +${keys.length - max}`;

/* het raster; mode 'kies' (in een formulier) of 'bekijk' (het rekvenster, tik op een fles opent het detail) */
function rekGridHtml(name, mode, wineId, gekozen){
  const rek = rekVan(name); if(!rek) return '';
  const vakken = rek.vakken || {};
  let h = `<div class="rekwrap"><div class="rek ${mode}" style="grid-template-columns:26px repeat(${rek.kolommen}, minmax(22px, 30px))" role="grid" aria-label="Rek ${esc(name)}"><span class="rl"></span>`;
  for(let c = 0; c < rek.kolommen; c++) h += `<span class="rl">${c + 1}</span>`;
  for(let r = 0; r < rek.rijen; r++){
    h += `<span class="rl">${String.fromCharCode(65 + r)}</span>`;
    for(let c = 0; c < rek.kolommen; c++){
      const k = vakNaam(r, c), id = vakken[k], w = id ? findWine(id) : null;
      const ander = w && id !== wineId;
      const mijn = mode === 'kies' ? !!(gekozen && gekozen.has(k)) : !!(w && wineId && id === wineId);
      const vol = mode === 'kies' ? (mijn || ander) : !!w;
      const kleur = !vol ? '' : (mode === 'kies' && mijn) ? 'background:var(--acc)' : `background:var(${VAK_KLEUR[w.type] || '--t-rood'})`;
      const lbl = w ? `${w.name} ${w.vintage||''}`.trim() + ` in ${k}` : `vak ${k}`;
      const cls = `vak${vol?' vol':''}${mijn?' mijn':''}`;
      h += mode === 'kies'
        ? `<button type="button" class="${cls}" data-act="vakTik" data-k="${k}" ${ander ? 'disabled' : ''} style="${kleur}" title="${esc(lbl)}" aria-label="${esc(lbl)}${mijn?', gekozen':''}" aria-pressed="${mijn}"></button>`
        : `<button type="button" class="${cls}" ${w ? `data-act="detail" data-id="${w.id}"` : 'disabled'} style="${kleur}" title="${esc(lbl)}" aria-label="${esc(lbl)}"></button>`;
    }
  }
  return h + `</div></div>`;
}

/* keuze in het formulier: formVakken zijn de gekozen vakken, formVakLoc het rek waar ze bij horen,
   formVakWine de wijn die bewerkt wordt (null bij nieuw of scan) */
let formVakken = new Set(), formVakLoc = '', formVakWine = null;
function formVakReset(w){ formVakWine = w || null; formVakLoc = ''; formVakken = new Set(); }
const rekQtyNu = () => formVakWine ? (formVakWine.qty||0) : formQty;
function rekKiesHtml(name){
  name = (name||'').trim();
  if(!rekVan(name)) return '';
  if(formVakLoc !== name){ formVakLoc = name; formVakken = new Set(formVakWine ? rekVakken(name, formVakWine.id) : []); }
  const n = formVakken.size, qty = rekQtyNu(), vrij = rekVrijeVakken(name, formVakken).length;
  return `<div class="field" style="margin-top:-4px"><label>Vak in ${esc(name)}</label>

}

/* ---- "Op tafel": fles gekozen om vanavond te drinken, nog niet afgestreept ---- */
/* Schenkadvies uit vaste sommelierregels: temperatuur, glas en karafferen.
   Kost geen tegoed en werkt offline; de AI is er voor de rest ("Vraag"). */
function serveAdvice(w){
  const g = (w.grapes||[]).map(norm).join(' ') + ' ' + norm(w.name) + ' ' + norm(w.appellation||'') + ' ' + norm(w.region||'');
  const has = list => list.some(x => g.includes(x));
  const age = w.vintage ? YR() - w.vintage : null;
  const st = windowStatus(w);
  let temp = '14–16 °C', glass = 'een tulpvormig wijnglas', tips = [];

  if(w.type === 'mousserend'){
    temp = (age !== null && age > 8) ? '8–10 °C' : '6–8 °C';
    glass = 'een fluit, of liever een smal tulpglas, want daar komt meer geur uit';
    tips.push(age !== null && age > 8
      ? 'Een gerijpte bubbel wil niet ijskoud; te koud smoort de complexiteit.'
      : 'Drie uur in de koelkast koelt beter en rustiger dan een kwartier in de vriezer.');
  } else if(w.type === 'wit'){
    const rijk = has(['chardonnay','semillon','viognier','marsanne','roussanne','gruner']) || (age !== null && age > 5);
    temp = rijk ? '10–12 °C' : '8–10 °C';
    glass = rijk ? 'een ruimer wijnglas' : 'een tulpvormig wijnglas';
    tips.push('Recht uit de koelkast is meestal te koud. Zet hem twintig minuten van tevoren op tafel.');
  } else if(w.type === 'oranje'){
    temp = '12–14 °C'; glass = 'een ruimer wijnglas';
    tips.push('Oranje wijn heeft tannine als een lichte rode: niet ijskoud, en hij houdt van lucht. Een karaf doet hem goed.');
  } else if(w.type === 'rose'){
    temp = '8–10 °C';
  } else if(w.type === 'zoet'){
    temp = '6–8 °C'; glass = 'een klein glas';
    tips.push('Schenk kleine glazen: koel en zoet werkt het best in kleine hoeveelheden.');
  } else if(w.type === 'versterkt'){
    if(has(['fino','manzanilla','sherry'])){ temp = '7–9 °C'; tips.push('Fino en manzanilla drink je koud en jong. Een geopende fles blijft maar een paar dagen goed.'); }
    else { temp = '16–18 °C'; tips.push('Een geopende fles port of oloroso houdt zich weken; koel bewaren na openen.'); }
  } else { /* rood */
    const licht = has(G_LIGHT_RED), groot = has(G_BIG_RED);
    temp = licht ? '12–14 °C' : groot ? '16–18 °C' : '14–16 °C';
    glass = has(['pinot','nebbiolo']) ? 'een bourgogneglas (bolle kelk)' : groot ? 'een ruim bordeauxglas' : 'een tulpvormig wijnglas';
    if(licht) tips.push('Kelderkoud is beter dan kamertemperatuur. Een half uur in de koelkast doet wonderen.');
    if(groot || licht === false){
      if(age !== null && age >= 15) tips.push('Decanteren: voorzichtig overschenken zodat het bezinksel in de fles blijft, en pas kort van tevoren, want oude wijn kan snel omvallen.');
      else if(age !== null && age <= 7) tips.push('Geef hem wat lucht in een karaf, een uur of twee. Jong en stevig, hij heeft het nodig.');
      else if(age !== null) tips.push('Een half uur in een karaf is genoeg.');
    }
  }
  if(st.k === 'jong') tips.push('Nog aan de jonge kant. Wat extra tijd in de karaf helpt.');
  if(st.k === 'over') tips.push('Over zijn venster: open hem voorzichtig en drink hem dezelfde avond op.');
  return { temp, glass, tips: tips.slice(0,2) };
}
function serveHtml(w){
  const a = serveAdvice(w);
  return `<div class="serve">
    <div class="srow"><span class="k">Schenken op</span><span class="v">${a.temp}</span></div>
    <div class="srow"><span class="k">Glas</span><span class="v">${esc(a.glass)}</span></div>

/* Herbereken drinkvenster + pairing op basis van wat er nu in het formulier staat
   (bv. na het zelf invullen van jaargang of druiven). AI indien beschikbaar, anders kelderregels. */
/* Is de waarde in het veld nog de schatting van de AI (of leeg)? Dan mag een herberekening hem
   overschrijven. Een zelf getypte of opgezochte waarde blijft altijd staan. */
function waardeIsSchatting(v){
  if(v == null) return true;
  if(scan.stage === 'confirm' && scan.data && scan.data.value_eur != null && v === Math.round(scan.data.value_eur)) return true;
  if(recalcValueRange && v === recalcValueRange.value) return true;
  if(formVakWine && formVakWine.valueSrc === 'ai' && v === formVakWine.value) return true;
  return false;
}
async function doRecalc(el, silent, opts){
  opts = opts || {};
  const d = readForm();
  /* automatisch na een jaargangwijziging: het venster alleen bijrekenen zolang het een schatting is */
  const venster = !opts.auto || vensterAuto;
  if(!d.name && !(d.grapes||[]).length && !d.region && !d.appellation){
    if(!silent) toast('Vul eerst minstens een naam, druif of regio in');
    return;
  }
  const orig = el ? el.innerHTML : '';
  if(el){ el.innerHTML = 'Herberekenen…'; el.style.pointerEvents = 'none'; }
  const setVal = (id, v) => { const x = document.getElementById(id); if(x && v != null && v !== '') x.value = v; };
  let src = 'Kelderregels', done = false;
  /* de stille route (jaargang aangepast) rekent met de kelderregels: gratis en meteen; de AI alleen op de knop */
  if(!silent && aiReady()){
    try{
      const r = await aiRecalc(d);
      if(venster && r.drink_from) setVal('f_from', r.drink_from);
      if(venster && r.drink_to) setVal('f_to', r.drink_to);
      if(!(d.grapes||[]).length && Array.isArray(r.grapes) && r.grapes.length) setVal('f_grapes', r.grapes.join(', '));
      if(!d.note && r.note) setVal('f_note', r.note);
      if(Array.isArray(r.pairing) && r.pairing.length){
        recalcPairing = r.pairing;
        if(scan.stage === 'confirm' && scan.data) scan.data.pairing = r.pairing;
      }
      /* de waarde hoort bij een jaargang: een schatting wordt overschreven, eigen of opgezochte cijfers niet */
      if(waardeIsSchatting(d.value)){
        const fv = document.getElementById('f_value');
        if(r.value_eur != null && r.value_confidence !== 'laag'){
          if(fv){ fv.value = ''; fv.placeholder = 'indicatie ' + Math.round(r.value_eur); }
          recalcValueRange = {low:(r.value_low!=null?Math.round(r.value_low):null), high:(r.value_high!=null?Math.round(r.value_high):null), value:Math.round(r.value_eur)};
          if(scan.stage === 'confirm' && scan.data) scan.data.prijs_onzeker = false;
        } else if(r.value_confidence === 'laag'){
          if(fv){ fv.value = ''; fv.placeholder = '= prijs'; } recalcValueRange = null;
          if(scan.stage === 'confirm' && scan.data) scan.data.prijs_onzeker = true;
        }
      }
      src = 'Sommelier-AI'; done = true;
    }catch(e){ /* val terug op regels */ }
  }
  if(!done && venster){
    const est = estimateWindow(d);
    setVal('f_from', est.from); setVal('f_to', est.to);
  }
  if(el){ el.innerHTML = orig; el.style.pointerEvents = ''; }
  if(opts.auto && done) toast(`Waarde${venster ? ' en venster' : ''} bijgerekend voor ${d.vintage || 'NV'}${ownKey() ? '' : ' · 1 credit'}`);
  else if(!opts.auto || venster) toast(`Drinkvenster bijgewerkt (${src})`);
}
ACT.recalc = el => doRecalc(el, false);

/* Welke velden heeft de gebruiker zelf aangeraakt? Die laat het live invullen
   met rust, en ze winnen ook als het antwoord binnen is. Anders typ je een naam
   over terwijl de sommelier nog aan het lezen is, en verdwijnt hij weer. */
let scanTouched = new Set();
/* venster met de hand aangepast → niet meer automatisch overschrijven */
document.addEventListener('input', e => {
  const t = e.target;
  if(t && t.id && t.id.startsWith('f_')) scanTouched.add(t.id);
  if(t && (t.id === 'f_from' || t.id === 'f_to')) vensterAuto = false;
});
/* jaargang ingevuld of gewijzigd → venster automatisch bijrekenen zolang het een schatting is */
document.addEventListener('change', e => {
  if(!e.target || e.target.id !== 'f_vintage') return;
  if(scan.stage === 'confirm' && scan.busy) return;   /* de scan loopt nog; scanLezen rekent straks zelf bij */
  const d = readForm(), btn = document.getElementById('recalcBtn');
  /* De waarde hoort bij een jaargang. Was hij door de AI geschat (of leeg), dan rekent de AI
     opnieuw mét de nieuwe jaargang (1 credit). Opgezocht of zelf ingevuld blijft staan. */
  if(aiReady() && d.name && waardeIsSchatting(d.value)){ doRecalc(btn, false, {auto:true}); return; }
  const b = formVakWine && formVakWine.valueSrc === 'zoek' ? formVakWine.valueBron : null;
  if(b && b.vintage && d.vintage && b.vintage !== d.vintage) toast(`De opgezochte prijs gold voor jaargang ${b.vintage}. Zoek in het detail opnieuw op`, null, null, 6000);
  if(vensterAuto) doRecalc(btn, true);
});
function openWineForm(w){
  formQty = 1; recalcPairing = null; recalcValueRange = null; proefRating = null; vensterAuto = !w || (!w.drinkFrom && !w.drinkTo);
  formVakReset(w);
  const isNew = !w;
  openSheet(`${sheetHead(isNew ? 'Fles toevoegen' : 'Bewerken')}
    ${formFields(w || {location:(S.settings.lastLocation||'')}, {rek:true})}
    ${isNew ? `${proefHtml()}<div class="field"><label>Aantal flessen</label>
      <div class="stepper"><button class="stepbtn" data-act="fq" data-d="-1">−</button><span class="stepval tnum" id="fQty">1</span><button class="stepbtn" data-act="fq" data-d="1">+</button></div>
      <div class="qquick"><button data-act="fqset" data-n="6">doos van 6</button><button data-act="fqset" data-n="12">doos van 12</button></div></div>` : ''}
    <div class="btnrow mt8"><button class="btn plain" data-act="closeSheet">Annuleer</button>
    <button class="btn" data-act="wineSave" data-id="${w?w.id:''}">Bewaren</button></div>
    <div class="small center mt8">Laat het drinkvenster leeg om het automatisch te laten schatten.</div>`, {onClose: () => formVakReset(null)});

function syncQty(){ const q = document.getElementById('fQty'); if(q) q.textContent = formQty;
  const m = document.getElementById('mq'); if(m) m.textContent = formQty; }
ACT.fq = el => { formQty = Math.max(1, formQty + Number(el.dataset.d)); syncQty(); rekRefresh(); };
ACT.fqset = el => { formQty = Number(el.dataset.n); syncQty(); rekRefresh(); };
ACT.wineSave = el => {
  const d = readForm();
  const pr = proefLees();
  if(!d.name){ toast('Geef de wijn een naam'); return; }
  if(!d.type) d.type = 'rood';
  if(d.location) S.settings.lastLocation = d.location;
  if(!d.drinkFrom && !d.drinkTo){ const est = estimateWindow(d); d.drinkFrom = est.from; d.drinkTo = est.to; }
  const id = el.dataset.id;
  if(id){ const w = findWine(id); if(!w) return; const vOud = w.value, pOud = w.price, locOud = w.location;
    if(d.value == null && w.valueSrc === 'ai' && w.value != null && !recalcValueRange) d.value = w.value;   /* indicatie stond niet in het veld, blijft bewaard */
    Object.assign(w, d); rekNaBewaren(w, locOud);
    if(recalcPairing) w.pairing = recalcPairing;
    if(recalcValueRange){ if(w.value == null) w.value = recalcValueRange.value; w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; w.valueSrc = 'ai'; w.valueAt = vandaag(); w.valueBron = null; }
    if(d.value != null && d.value !== vOud && !(recalcValueRange && d.value === recalcValueRange.value)){ w.valueSrc = 'eigen'; w.valueVia = null; w.valueAt = vandaag(); w.valueBron = null; }
    prijsAlsBron(w); if(d.price != null && d.price !== pOud) deelBetaald(w);
    save(); closeSheet(true); render(); toast('Bijgewerkt'); }
  else {
    const w = { id:uid(), ...d, qty:formQty, pairing:recalcPairing||[], photo:false, addedAt:Date.now() };
    if(recalcValueRange){ if(w.value == null) w.value = recalcValueRange.value; w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; w.valueSrc = 'ai'; w.valueAt = vandaag(); }
    if(d.value != null && !(recalcValueRange && d.value === recalcValueRange.value)){ w.valueSrc = 'eigen'; w.valueAt = vandaag(); }
    prijsAlsBron(w); deelBetaald(w);
    const geproefd = proefSchrijf(w, pr);
    rekNaBewaren(w, null);
    S.wines.unshift(w); save(); closeSheet(true); UI.tab = 'kelder'; render();
    const gelegd = `${formQty} ${plur(formQty,'fles','flessen')} toegevoegd${geproefd ? ', proefnotitie bewaard' : ''}`;
    if(!w.location) toast(gelegd + ', nog zonder plek', 'Plek geven', () => openPlekGeven(w.id), 5500);
    else toast(gelegd);
  }
};

/* Gerechten bij een wijn (detail & pairing), met richting-voorkeur en cache */
ACT.wineDishes = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  openSheet(`${sheetHead('Lekker bij ' + esc(w.name))}
    <div class="field"><label>Richting (optioneel)</label>
      <div style="display:flex;gap:8px">
        <input class="inp" id="pd_dir" placeholder="bv. Aziatisch, vegetarisch, licht &amp; zomers" style="flex:1">
        <button class="btn sm soft" data-act="dishGo" data-id="${w.id}" style="flex:none">Toon</button>
      </div></div>
    <div id="dishOut"></div>`);
  runWineDishes(w, '', false);
};
ACT.dishGo = el => { const w = findWine(el.dataset.id); runWineDishes(w, ((document.getElementById('pd_dir')||{}).value||'').trim(), false); };
ACT.dishFresh = el => { const w = findWine(el.dataset.id); runWineDishes(w, el.dataset.dir||'', true); };

async function runWineDishes(w, richting, force){
  const out = document.getElementById('dishOut'); if(!out || !w) return;
  const key = norm(richting||'') || '_';
  const cached = !force && w.dishCache && w.dishCache[key];
  if(cached && cached.list && cached.list.length){
    const dt = new Date(cached.at).toLocaleDateString(LOCALE(), {day:'numeric', month:'short'});
    renderDishes(out, w, richting, cached.list, `Opgeslagen · ${dt}`, true);
    return;
  }
  let dishes = null, src = 'Kelderregels', aiFout = aiRedenUit();
  if(aiReady()){
    out.innerHTML = `<div class="banner">${pourSvg}<span class="pulse">De sommelier denkt na…</span></div>`;
    try{
      const r = await aiWine(w, richting);
      dishes = (r.dishes||[]).map(d => ({dish:d.dish, reason:d.reason})).filter(d => d.dish);
      if(dishes.length){ src = 'Sommelier-AI'; w.dishCache = w.dishCache || {}; w.dishCache[key] = {at:Date.now(), list:dishes};
        /* hoogstens drie richtingen per wijn bewaren, anders groeit het document en de sync zonder grens */
        const ks = Object.keys(w.dishCache); if(ks.length > 3) delete w.dishCache[ks.sort((a, b) => (w.dishCache[a].at||0) - (w.dishCache[b].at||0))[0]];
        save(); }
    }catch(e){ dishes = null; aiFout = leesFout(e); }
    if(!aiFout) aiFout = 'de sommelier vond niets';
  }
  if(!dishes || !dishes.length){ dishes = dishesForWine(w); src = 'Kelderregels'; }
  if(!dishes.length){ out.innerHTML = '<p class="small">Geen suggesties gevonden. Vul type of druiven aan.</p>'; return; }
  renderDishes(out, w, richting, dishes, src, false, aiFout);
}
function renderDishes(out, w, richting, list, srcLabel, cached, aiFout){
  out.innerHTML = (srcLabel === 'Kelderregels' ? zonderAiHtml(aiFout) : '') + `<div class="mb8" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="srcchip">${esc(bronLabel(srcLabel))}</span>${richting?`<span class="small">richting: ${esc(richting)}</span>`:''}${cached?`<button class="linkbtn" style="font-size:12.5px" data-act="dishFresh" data-id="${w.id}" data-dir="${esc(richting||'')}">↻ vernieuw</button>`:''}</div>` +
    list.map(d => `<div class="dishcard"><div class="d">${esc(d.dish)}</div><div class="r">${esc(d.reason||'')}</div><div class="mt8"><button class="linkbtn" style="font-size:13px" data-act="recipeAsk" data-dish="${esc(d.dish)}" data-wid="${w.id}">${ik('boek')} Recept tonen</button></div></div>`).join('');
}

/* ---- recepten (met personen-keuze en cache) ---- */
ACT.recipeAsk = el => {
  if(!aiReady() && !(S.recipeCache||[]).some(r => r.dish === el.dataset.dish)){
    toast(hoofd(aiRedenUit())); return;
  }
  const dish = el.dataset.dish, wid = el.dataset.wid || '';
  openSheet(`${sheetHead('Recept: ' + esc(dish))}
    <p class="small mb8">Voor hoeveel personen?</p>
    <div class="btnrow">${[2,4,6,8].map(n => `<button class="btn soft" data-act="recipeGo" data-dish="${esc(dish)}" data-wid="${wid}" data-p="${n}">${n}</button>`).join('')}</div>`);
};
ACT.recipeGo = async el => {
  const dish = el.dataset.dish, p = Number(el.dataset.p) || 4, wid = el.dataset.wid || null;
  const key = norm(dish) + '|' + p;
  closeSheet();
  const hit = (S.recipeCache||[]).find(r => r.key === key);
  if(hit){ showRecipe({...hit, cached:true}); return; }
  if(!aiReady()){ toast(hoofd(aiRedenUit())); return; }
  const sh = openSheet(`${sheetHead('Recept: ' + esc(dish))}<div class="banner">${pourSvg}<span class="pulse">Recept schrijven…</span></div>`);
  try{
    const r = await aiRecipe(dish, p);
    const wijn = wid ? findWine(wid) : null;
    const entry = {key, dish, persons:p, at:Date.now(), wineId:wid, wineName:wijn?`${wijn.name}${wijn.vintage?' '+wijn.vintage:''}`:null, recipe:r};
    S.recipeCache = (S.recipeCache||[]).filter(x => x.key !== key);
    S.recipeCache.unshift(entry);
    S.recipeCache = S.recipeCache.slice(0, 50);
    save();
    closeSheet(); showRecipe({...entry, cached:false});
  }catch(e){
    const inner = sh.querySelector('.sheet-in');
    if(inner) inner.innerHTML = `${sheetHead('Recept')}<div class="banner"><span>${ik('waarschuwing')}</span><span>Recept ophalen lukte niet (${esc(String(e.message||e).slice(0,90))}). Probeer het zo nog eens.</span></div>`;
  }
};
function showRecipe(e){
  const r = e.recipe || {};
  const wijn = e.wineId ? findWine(e.wineId) : null;
  const wijnRow = wijn
    ? `<button class="linkbtn" style="font-size:13px" data-act="detail" data-id="${wijn.id}">${ik('glas')} ${esc(e.wineName||wijn.name)} →</button>`
    : (e.wineName ? `<span class="small">${ik('glas')} ${esc(e.wineName)} (niet meer in je kelder)</span>` : '');
  openSheet(`${sheetHead(esc(r.title || e.dish))}
    <div class="small mb8" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${Number(e.persons)||0} personen${r.time ? ` · ${esc(r.time)}` : ''} · <span class="srcchip">${e.cached ? 'Opgeslagen' : 'Sommelier-AI'}</span>${wijnRow}</div>
    <div class="eyebrow mb8">Ingrediënten</div>
    <div class="panel" style="margin-bottom:14px">${lijstOk(r.ingredients, 40, 200).map(i => `<div class="rowline" style="padding:6px 0"><span class="a" style="font-size:14px">${esc(i)}</span></div>`).join('')}</div>
    <div class="eyebrow mb8">Bereiding</div>
    ${lijstOk(r.steps, 30, 600).map((s,i) => `<div style="display:flex;gap:10px;margin-bottom:10px"><span style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center">${i+1}</span><span style="font-size:14px;flex:1">${esc(s)}</span></div>`).join('')}`);
}
ACT.recipeOpen = el => {
  const r = (S.recipeCache||[]).find(x => x.key === el.dataset.k);
  if(r) showRecipe({...r, cached:true});
};

/* ---- vraag de sommelier (vrije vraag over wijn/pairing) ---- */
ACT.askSomm = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  if(!aiReady()){ toast(hoofd(aiRedenUit())); return; }
  const dish = el.dataset.dish || '';
  openSheet(`${sheetHead('Vraag de sommelier')}
    <div class="small mb8">${esc(w.name)} ${w.vintage||''}${dish?` · bij "${esc(dish)}"`:''}</div>
    <div id="askOut"></div>
    <div class="field"><div style="display:flex;gap:8px">
      <input class="inp" id="askQ" placeholder="bv. past dit bij paddenstoelen?" style="flex:1;min-width:0">
      <button class="btn sm" data-act="askGo" data-id="${w.id}" data-dish="${esc(dish)}" style="flex:none">Vraag</button></div></div>
    <div class="chiprow">${['Moet deze gekoeld?','Decanteren?','Hoe lang van tevoren open?'].map(q=>`<button class="chip" data-act="askQuick" data-q="${esc(q)}">${q}</button>`).join('')}</div>`);
};
ACT.askQuick = el => {
  const i = document.getElementById('askQ'); if(i) i.value = el.dataset.q;
  const b = document.querySelector('[data-act="askGo"]'); if(b) ACT.askGo(b);
};
ACT.askGo = async el => {
  const w = findWine(el.dataset.id); if(!w) return;
  const inp = document.getElementById('askQ');
  const q = ((inp||{}).value||'').trim();
  if(!q){ toast('Typ eerst je vraag'); return; }
  const out = document.getElementById('askOut'); if(!out) return;
  const aid = 'ans' + Date.now();
  out.insertAdjacentHTML('beforeend', `<div class="dishcard"><div class="d">${esc(q)}</div><div class="r" id="${aid}">${pourSvg}</div></div>`);
  if(inp) inp.value = '';
  try{
    const ans = await aiAsk(w, el.dataset.dish||'', q);
    const t = document.getElementById(aid); if(t) t.textContent = String(ans||'').trim();
  }catch(e){
    const t = document.getElementById(aid); if(t) t.textContent = 'Lukte niet: ' + String(e.message||e).slice(0,80);
  }
};
</script>
<script>
'use strict';
/* ================= SCAN ================= */
let scan = { stage:'idle', photo:null, thumb:null, data:null, match:null, err:null, busy:false };
function scanReset(){ scan = { stage:'idle', photo:null, thumb:null, data:null, match:null, err:null, busy:false }; recalcPairing = null; recalcValueRange = null; proefRating = null; formVakReset(null); }

function aiBanner(){

  if(!aiReady()) return `<div class="banner"><span>${ik('info')}</span><span><b>Log in en de sommelier leest je etiketten</b>: naam, druiven, drinkvenster en pairing in één foto. Je krijgt ${FREE_CREDITS} gratis credits per maand: <button class="linkbtn" data-act="goAccount">account aanmaken</button>. Zonder inloggen werkt alles behalve het automatisch lezen.</span></div>`;

}
function viewScan(){
  if(scan.stage === 'idle'){
    return `${brandRow('')}
      <div class="scanhero">
        <div class="eyebrow">Etiket scannen</div>
        <h2 class="h2">Richt je camera op de fles</h2>

          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1l1.4-2h6.2L16.5 6h1A2.5 2.5 0 0 1 20 8.5v7A2.5 2.5 0 0 1 17.5 18h-11A2.5 2.5 0 0 1 4 15.5v-7Z"/><circle cx="12" cy="12" r="3.4"/></svg>
          <span>Scan etiket</span></button>
        <p class="small" style="max-width:300px;margin:0 auto">Herkennen, toevoegen, info bekijken of afboeken: de foto is genoeg.</p>
        <div class="btnrow mt14" style="max-width:340px;margin-left:auto;margin-right:auto">
          <button class="btn plain" data-act="scanLib">Kies een foto</button>
          <button class="btn plain" data-act="wineNew">Handmatig</button>
        </div>
        <button class="linkbtn mt14" data-act="goMenu">${ik('kaart')} Uit eten? Scan de wijnkaart →</button>
      </div>${aiBanner()}`;
  }
  /* confirm-stadium */
  const d = scan.data || {};
  const pre = {
    name:d.name||'', producer:d.producer||'', vintage:d.vintage||null,
    type:d.type?mapType(d.type):(d.type_onzeker?'':'rood'), grapes:d.grapes||[], country:d.country||'', region:d.region||'',
    appellation:d.appellation||'', drinkFrom:d.drink_from||null, drinkTo:d.drink_to||null,
    price:null, value:(d.value_eur!=null?Math.round(d.value_eur):null), valueSrc:(d.value_eur!=null?'ai':null), location:(S.settings.lastLocation||''), note:d.note||'', score:d.score_seen||''
  };
  return `${brandRow('')}
    <div class="btnrow" style="margin-bottom:10px">
      <button class="btn sm plain" data-act="scanAgain">‹ Annuleer</button>
      <button class="btn sm plain" data-act="scanNewPhoto">${ik('camera')} Nieuwe foto</button>
    </div>
    <div class="scanprev">${bottleSvg}<img id="scanImg" alt="Gescand etiket"></div>
    ${scan.busy ? `<div class="banner">${pourSvg}<span class="pulse" id="scanLive">De sommelier leest het etiket…</span></div>` : ''}
    ${scan.err ? `<div class="banner"><span>${ik('waarschuwing')}</span><span><b>Automatisch lezen lukte niet</b> (${esc(scan.err)}). Probeer het nog eens, of vul de velden (deels) zelf in en tik op "Herbereken". De foto blijft bewaard.<br><button class="btn sm ghost mt8" data-act="scanRetry">↻ Probeer opnieuw te lezen</button></span></div>` : ''}
    ${(!scan.busy && scan.data) ? `<div class="banner"><span>${ik('glas')}</span><span><span class="srcchip">Sommelier-AI</span>${d.note?` ${esc(d.note)}`:''}${(d.pairing&&d.pairing.length)?`<br><b>Lekker bij:</b> ${esc(d.pairing.slice(0,4).join(' · '))}`:''}</span></div>` : ''}
    ${(!scan.busy && scan.data && smaakHit(pre)) ? `<div class="banner"><span>${ik('hart')}</span><span>Een druif of streek waar je van houdt.</span></div>` : ''}
    ${(!scan.busy && scan.data && d.value_eur!=null && verdict({...pre, valueSrc:'ai', qty:formQty})) ? `<div class="banner"><span style="color:var(--gold-ink);font-size:13px">◆</span><span>${esc(verdict({...pre, valueSrc:'ai', qty:formQty}))}</span></div>` : ''}
    ${(!scan.busy && scan.data && !d.vintage) ? `<div class="banner"><span>${ik('kalender')}</span><span><b>Jaargang niet op het etiket gevonden</b>. Het venster hieronder is een grove schatting. Vul de jaargang in bij "Jaargang"; het drinkvenster rekent dan vanzelf bij. Geen jaargang (NV)? Laat het veld leeg.</span></div>` : ''}
    ${(!scan.busy && scan.data && scan.data.type_onzeker) ? `<div class="banner"><span>${ik('waarschuwing')}</span><span><b>Kleur niet van het etiket af te leiden.</b> Kies hieronder het type; venster en pairing rekenen dan mee.</span></div>` : ''}
    ${(!scan.busy && scan.data && scan.data.prijs_onzeker) ? `<div class="banner"><span style="color:var(--gold-ink);font-size:13px">◇</span><span><b>Waarde onzeker.</b> De sommelier kent deze wijn niet goed genoeg voor een schatting. Vul de aankoopprijs in als je die weet, of zoek hem na het wegleggen precies op.</span></div>` : ''}
    ${scan.match ? `<div class="matchbanner"><b>${esc(scan.match.name)} ${scan.match.vintage||''}</b> staat al in je kelder (×${scan.match.qty}). Flessen bijboeken, of juist één afboeken?</div>` : ''}
    ${scan.busy ? '' : `<div class="panel" style="padding:11px 13px;margin-bottom:12px"><div class="eyebrow mb8">Snel wegleggen</div>
      <div style="display:flex;gap:8px"><select class="inp" id="quickLoc" data-in="quickLoc" style="flex:1;min-width:0" aria-label="Locatie">${locSelectOptions(pre.location)}</select>
      <button class="btn sm" data-act="${scan.match?'scanMerge':'scanAdd'}" style="flex:none">+ Kelder in</button></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:10px"><input type="checkbox" id="scanTonight" style="width:18px;height:18px;accent-color:var(--acc)"> ${ik('glas')} Vanavond drinken, herinner me om af te strepen</label></div>`}
    ${formFields(pre, {rek:true})}
    ${proefHtml()}
    <div class="field"><label>Aantal flessen</label>
      <div class="stepper"><button class="stepbtn" data-act="fq" data-d="-1">−</button><span class="stepval tnum" id="fQty">${formQty}</span><button class="stepbtn" data-act="fq" data-d="1">+</button></div>
      <div class="qquick"><button data-act="fqset" data-n="6">doos van 6</button><button data-act="fqset" data-n="12">doos van 12</button></div></div>
    ${scan.match ? `<button class="btn" data-act="scanMerge" style="margin-bottom:9px">+<span id="mq">${formQty}</span> bijboeken bij bestaande</button>
      <button class="btn ghost" data-act="scanRemove" style="margin-bottom:9px">Drink / haal er één uit de kelder</button>` :
      `<button class="btn" data-act="scanAdd" style="margin-bottom:9px" ${scan.busy?'disabled':''}>In de kelder leggen</button>`}
    <button class="btn ghost" data-act="scanDrinkNow" style="margin-bottom:9px" ${scan.busy?'disabled':''}>${ik('flute')} Drink nu, buiten de kelder om</button>
    <div class="btnrow">
      ${scan.match?`<button class="btn soft" data-act="scanAdd">Als nieuwe bewaren</button>`:`<button class="btn soft" data-act="scanWish" ${scan.busy?'disabled':''}>Op verlanglijst</button>`}
      <button class="btn plain" data-act="scanAgain">Opnieuw</button>
    </div>`;
}
ACT.goImport = () => { UI.tab='meer'; UI.meerPage='import'; render(); };
ACT.scanCam = () => openLiveScan();
ACT.scanLib = () => { photoTarget = 'etiket'; document.getElementById('fLib').click(); };
ACT.scanAgain = () => { scanReset(); render(); };
ACT.scanNewPhoto = () => openLiveScan();

/* ================= live-scanner: QR-gevoel met auto-vangst ================= */
let liveStream = null, liveTimer = null, livePrev = null, liveStable = 0, liveEl = null, liveStartAt = 0;
/* zaklamp: alleen Android/Chrome kan dit via getUserMedia; iOS Safari niet.
   De knop verschijnt daarom pas als de camera zelf zegt dat hij het kan. */
let liveTorch = false;
async function liveTorchInit(){
  liveTorch = false;
  try{
    const t = liveStream && liveStream.getVideoTracks()[0];
    const caps = t && t.getCapabilities ? t.getCapabilities() : null;
    if(caps && caps.torch){
      const b = document.getElementById('liveTorchBtn');
      if(b) b.style.display = 'block';
    }
  }catch(e){}
}
ACT.liveTorch = async el => {
  const t = liveStream && liveStream.getVideoTracks()[0];
  if(!t) return;
  try{
    liveTorch = !liveTorch;
    await t.applyConstraints({ advanced:[{ torch: liveTorch }] });
    el.textContent = liveTorch ? '🔦 aan' : 'zaklamp';
    el.style.opacity = liveTorch ? '1' : '.75';
  }catch(e){ liveTorch = false; toast('De zaklamp lukt niet op dit toestel'); }
};
/* 'etiket' = automatisch vangen bij stil+scherp beeld; 'kaart' = wijnkaart, zelf afdrukken */
let liveMode = 'etiket';
/* waar een gekozen/gemaakte foto heen gaat: 'etiket' (fles) of 'kaart' (wijnkaart) */
let photoTarget = 'etiket';
/* iOS vraagt elke keer om de camera, tenzij de gebruiker dat in Safari vastzet. Of het venster
   verscheen kunnen we niet zien; wel hoe vaak de camera openging op dít apparaat. Bij de 3e, 4e,
   8e, 10e en 15e keer één wenk met de instelling, daarna nooit meer. */
const CAM_WENK_BIJ = [3, 4, 8, 10, 15];
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let camWenk = false;
function camGeteld(){
  if(!isIOS()) return;
  let n = 0; try{ n = (parseInt(localStorage.getItem('caveau_cam'), 10) || 0) + 1; localStorage.setItem('caveau_cam', String(n)); }catch(e){ return; }
  camWenk = CAM_WENK_BIJ.includes(n);
}
function camWenkToon(){
  if(!camWenk) return; camWenk = false;
  toast('Telkens toestemming voor de camera? Zet hem vast: Instellingen → Safari → Camera → Toestaan', null, null, 9000);
}
async function openLiveScan(mode){
  liveMode = mode || 'etiket'; photoTarget = liveMode;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ document.getElementById('fCam').click(); return; }
  try{
    liveStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}, audio:false });
  }catch(e){ document.getElementById('fCam').click(); return; } /* geweigerd of geen camera → systeemcamera */
  camGeteld();
  const kaart = liveMode === 'kaart' || liveMode === 'menu';
  const div = document.createElement('div'); div.className = 'livewrap'; div.id = 'liveScan';
  div.innerHTML = `<video autoplay playsinline muted></video>
    <div class="liveframe${kaart?' page':''}">${kaart?'':'<div class="livescanline"></div>'}</div>
    <div class="livehint" id="liveHint">${kaart?'Hele pagina in beeld, tik op de knop':'Houd het etiket in het kader, hij vangt vanzelf'}</div>
    <div class="liveflash" id="liveFlash"></div>
    <div class="livebar">
      <button class="livex" data-act="liveClose" aria-label="Sluiten">✕</button>
      <button class="liveshut" data-act="liveSnap" aria-label="Maak foto"></button>
      <button class="livelib" data-act="liveLib">galerij</button>
      <button class="livelib" id="liveTorchBtn" data-act="liveTorch" style="display:none;opacity:.75">zaklamp</button>
    </div>`;
  document.body.appendChild(div); liveEl = div;
  const v = div.querySelector('video'); v.srcObject = liveStream;
  liveStartAt = Date.now(); livePrev = null; liveStable = 0;
  liveTorchInit();
  liveTimer = setInterval(() => liveCheck(v), 260);
}
function closeLiveScan(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
  if(liveStream){ try{ liveStream.getTracks().forEach(t => t.stop()); }catch(e){} liveStream = null; }
  if(liveEl){ liveEl.remove(); liveEl = null; }
}
ACT.liveClose = () => { const k = liveMode !== 'etiket'; closeLiveScan(); if(k) render(); };
ACT.liveLib = () => { closeLiveScan(); document.getElementById('fLib').click(); };
ACT.liveSnap = () => liveCapture();
function liveCheck(v){
  if(!v || !v.videoWidth) return;
  if(liveMode !== 'etiket'){ /* kaart of menu: geen auto-vangst, de gast kadreert zelf */
    const h = document.getElementById('liveHint');
    if(h) h.textContent = 'Hele pagina in beeld, tik op de knop';
    return;
  }
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  try{ ctx.drawImage(v, 0, 0, 64, 64); }catch(e){ return; }
  const d = ctx.getImageData(0, 0, 64, 64).data;
  const g = new Float32Array(4096);
  let sum = 0;
  for(let i = 0; i < 4096; i++){ const y = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3; g[i] = y; sum += y; }
  const mean = sum / 4096;
  let edge = 0;
  for(let y = 0; y < 64; y++) for(let x = 0; x < 63; x++) edge += Math.abs(g[y*64+x] - g[y*64+x+1]);
  edge /= 4032;
  let diff = 999;
  if(livePrev){ diff = 0; for(let i = 0; i < 4096; i += 4) diff += Math.abs(g[i] - livePrev[i]); diff /= 1024; }
  livePrev = g;
  /* Scherpte en beweging worden afgezet tegen de helderheid van het beeld zelf.
     In een donker restaurant zakt het contrast van álles evenredig mee: met een
     vaste drempel haalt een perfect scherp etiket het nooit en klikt de sluiter
     dus nooit. Relatief gemeten gedraagt hij zich bij kaarslicht als bij daglicht. */
  const ref = Math.max(mean, 26);
  const edgeRel = edge / ref * 100, diffRel = diff / ref * 100;
  const donker = mean < 26, weinigLicht = mean < 70;   /* wel bruikbaar, maar de camera heeft er moeite mee */
  const stil = diffRel < 4.5, scherp = edgeRel > 5 && edge > 2;
  liveStable = (stil && scherp && !donker) ? liveStable + 1 : 0;
  const hint = document.getElementById('liveHint');
  if(hint) hint.textContent = donker ? (liveTorch ? 'Nog te donker, houd hem dichterbij' : 'Te donker, zet de zaklamp aan of zoek licht')
    : !scherp ? (weinigLicht ? 'Weinig licht, dit duurt soms even. Of tik op de knop' : 'Iets dichterbij, of even scherpstellen…')
    : !stil ? (weinigLicht ? 'Houd stil, bij weinig licht duurt het iets langer…' : 'Houd stil…') : 'Vasthouden…';
  if(liveStable >= 3 && Date.now() - liveStartAt > 1200) liveCapture();
}
function liveCapture(){
  const v = liveEl && liveEl.querySelector('video');
  if(!v || !v.videoWidth) return;
  const kaart = liveMode === 'kaart' || liveMode === 'menu';
  if(liveTimer && !kaart){ clearInterval(liveTimer); liveTimer = null; }
  const fl = document.getElementById('liveFlash');
  if(fl){ fl.style.opacity = '0.75'; setTimeout(() => { if(fl) fl.style.opacity = '0'; }, 180); }
  /* een wijnkaart heeft meer resolutie nodig dan een etiket: kleine letters, veel regels */
  const sc = Math.min(1, (kaart ? 1568 : 1400) / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  if(kaart){
    /* camera blijft open: meerdere pagina's achter elkaar fotograferen */
    addMenuShot(c.toDataURL('image/jpeg', 0.82), liveMode);
    const n = shotList(liveMode).length;
    const h = document.getElementById('liveHint');
    if(n >= shotMax(liveMode)){ closeLiveScan(); render(); return; }
    if(h) h.textContent = `Pagina ${n} vastgelegd. Nog een pagina? Anders op ✕`;
    return;
  }
  c.toBlob(b => { closeLiveScan(); if(b) handlePhoto(b); }, 'image/jpeg', 0.88);
}

function ensureWindow(d){

  const est = estimateWindow({ type: mapType(d.type||'rood'), grapes: d.grapes||[], region: d.region,

/* Eén leesbeurt met herkansing. Breekt de stroom halverwege af (mobiel netwerk, even geen bereik),
   dan is het halve antwoord geen JSON en zou de gebruiker een credit kwijt zijn zonder resultaat.
   Dan meteen nog één keer, zonder streamen: die weg is minder kwetsbaar. */
const parseFout = e => /JSON|Expected|Unexpected|token|EOF/i.test(String((e && e.message) || e));
const leesFout = e => parseFout(e) ? 'het antwoord kwam twee keer onvolledig aan' : String((e && e.message) || e).slice(0, 120);
async function scanLezen(){
  const live = txt => {
    const el = document.getElementById('scanLive');
    if(el){ const p = scanPeek(txt); if(p){ el.textContent = p; el.classList.remove('pulse'); } }
    vulFormLive(scanPartial(txt));
  };
  let d;
  try{ d = await aiScan(scan.photo, live); }
  catch(e){
    if(!parseFout(e)) throw e;
    const el = document.getElementById('scanLive');
    if(el){ el.textContent = 'Het antwoord kwam gehavend aan, ik lees het nog een keer…'; el.classList.add('pulse'); }
    d = await aiScan(scan.photo, null);
  }
  typeControle(d); waardeControle(d);
  ensureWindow(d);
  behoudEigenInvoer(d);
  scan.data = d;
  scan.match = matchWine({name:d.name, producer:d.producer, vintage:d.vintage});
  /* typte de gebruiker intussen een andere jaargang dan de AI las, dan hoort de waarde daarbij */
  const root = scanRoot(), f = root ? readForm(root) : {};
  if(root && scanTouched.has('f_vintage') && f.vintage && f.vintage !== d.vintage && aiReady() && d.name)
    setTimeout(() => { if(scan.stage === 'confirm' && !scan.busy) doRecalc(document.getElementById('recalcBtn'), false, {auto:true}); }, 400);
}

  scan.err = null; scan.busy = true; vensterAuto = true; scanTouched = new Set(); render(); showScanImg();
  try{ await scanLezen(); }catch(e){ scan.err = leesFout(e); }

    }).join('');

    /* na het advies: bijsturen, alleen als de AI het kan opvolgen (de kelderregels kennen geen "liever wit") */
    if(aiReady()) html += `<div class="panel" style="padding:11px 13px;margin-top:12px"><div class="eyebrow mb8">Stuur het advies bij</div>
      <div style="display:flex;gap:8px"><input class="inp" id="pairStuur" placeholder="bv. liever wit, iets lichter, niet de Barolo" value="${esc(stuur||'')}" style="flex:1;min-width:0" aria-label="Bijsturing"><button class="btn sm" data-act="pairStuur" data-d="${esc(dish)}" style="flex:none">Opnieuw</button></div>
      <div class="chiprow" style="padding-top:8px">${['Liever wit','Liever rood','Iets lichter','Iets specialer','Een eenvoudigere fles','Niet de eerste'].map(q => `<button class="chip" data-act="pairStuurQuick" data-d="${esc(dish)}" data-s="${esc(q)}">${q}</button>`).join('')}</div></div>`;

}

const shotList = t => t === 'menu' ? menu.food : menu.shots;

async function handleMenuFile(file, target){
  if(!file) return;
  if(shotList(target).length >= shotMax(target)){ toast(`Maximaal ${shotMax(target)} pagina's`); return; }
  try{ addMenuShot(await resizeImg(file, 1568, 0.82), target); }
  catch(e){ toast('Foto kon niet worden gelezen'); return; }

  menu.shots.forEach((s,i) => { const im = document.getElementById('ms'+i); if(im) im.src = s; });

/* strip met paginaminiaturen; prefix ms = wijnkaart, mf = menukaart */
function shotStrip(list, prefix, delAct, addAct, max, label){
  const tiles = list.map((s,i) => `<div class="mshot"><img id="${prefix}${i}" alt="${label} pagina ${i+1}">
    <button class="del" data-act="${delAct}" data-i="${i}" aria-label="Pagina ${i+1} weghalen">✕</button></div>`).join('');
  const add = list.length < max
    ? `<button class="mshotadd" data-act="${addAct}" aria-label="${label} fotograferen"><span style="font-size:20px">＋</span><span>${list.length?'pagina':label}</span></button>` : '';
  return `<div class="mshots">${tiles}${add}</div>`;
}

async function runMenu(){
  const out = document.getElementById('menuOut'); if(!out) return;
  const dish = (menu.dish||'').trim();
  if(!dish && !menu.food.length){ toast('Vertel wat je gaat eten, of fotografeer het menu'); return; }
  if(!aiReady()){ menuOut = zonderAiHtml(aiRedenUit()) + menuGuideHtml(dish, true); out.innerHTML = menuOut; return; }
  if(!menu.shots.length){ toast('Maak eerst een foto van de wijnkaart'); return; }
  menu.busy = true; menu.err = null;
  menuOut = `<div class="banner">${pourSvg}<span class="pulse">De sommelier leest de kaart…</span></div>`;
  out.innerHTML = menuOut;
  try{
    const d = await aiMenu(menu.shots, menu.food, dish, menu.budget||null, menu.glass);
    const picks = (d.picks||[]).filter(p => p && p.name).slice(0, 4).map(p => ({
      name:String(p.name), producer:p.producer||'', vintage:(p.vintage>=1900&&p.vintage<=2100)?p.vintage:null,
      type:mapType(p.type||'rood'), region:p.region||'',
      price:(p.price!=null && !isNaN(p.price)) ? Math.round(Number(p.price)) : null,
      unit:(norm(p.unit)==='glas')?'glas':'fles', flag:p.flag||'', course:p.course||'',
      score:Math.max(1, Math.min(10, Math.round(Number(p.score)||7))),
      reason:p.reason||'', value:p.value||''
    }));
    if(d.readable === false || !picks.length) throw new Error('geen wijnen op de foto herkend');
    S.menuLast = { at:Date.now(), dish, budget:menu.budget||null, glass:!!menu.glass, restaurant:d.restaurant||null,
      courses:(Array.isArray(d.courses)?d.courses:[]).filter(c => typeof c === 'string' && c.trim()).slice(0,12),
      picks, glassAdvice:d.glass_advice||null, skip:d.skip||null, note:d.note||null };
    save();
    menuOut = menuResultHtml(S.menuLast);
  }catch(e){
    menu.err = String(e.message||e).slice(0,140);
    menuOut = `<div class="banner"><span>${ik('waarschuwing')}</span><span><b>De kaart lezen lukte niet</b> (${esc(menu.err)}). Ga wat dichterbij, zorg voor licht, of fotografeer één pagina tegelijk.<br><button class="btn sm ghost mt8" data-act="menuGo">↻ Probeer opnieuw</button></span></div>` + menuGuideHtml(dish, false);
  }
  menu.busy = false;
  const o = document.getElementById('menuOut'); if(o) o.innerHTML = menuOut;
}

/* zonder AI (of als vangnet): waar je bij dit gerecht op de kaart naar zoekt: de kelderregels omgedraaid */
function menuGuideHtml(dish, primary){
  const cats = foodCats(dish);
  if(!cats.length){
    return primary ? `<div class="banner"><span>🤔</span><span>Dit gerecht kan ik zonder AI niet plaatsen. Omschrijf het wat gewoner ("iets met kip", "witte vis"), of log in, dan leest de sommelier de kaart écht.</span></div>` : '';
  }
  const wsum = {};
  cats.forEach(c => Object.keys(c.w).forEach(k => { wsum[k] = (wsum[k]||0) + c.w[k]; }));
  const styles = Object.keys(wsum).sort((a,b) => wsum[b]-wsum[a]).filter(k => wsum[k] >= 2).slice(0,3)
    .map(k => TYPES[k] ? TYPES[k].l.toLowerCase() : k);
  const grapes = [...new Set(cats.flatMap(c => c.g))].slice(0,6);
  return `<div class="panel"><div class="eyebrow mb8">Kaartgids · kelderregels</div>
    <p style="font-size:14px;margin-bottom:8px">Bij <b>${esc(dish)}</b> zoek je op de kaart naar <b>${esc(styles.join(' of ') || 'rood')}</b>.</p>
    ${grapes.length?`<p style="font-size:14px;margin-bottom:8px">Druiven die hier bijna altijd werken: <b>${esc(grapes.join(' · '))}</b>.</p>`:''}
    <p style="font-size:14px;margin-bottom:8px">Geen idee wat te kiezen? Vraag om ${esc(cats[0].buy)}.</p>
    <p class="small">${esc(cats[0].rW.charAt(0).toUpperCase()+cats[0].rW.slice(1))}.</p></div>`;
}

/* ================= OVERZICHT ================= */
/* Met `act` wordt elke rij een knop die de kelderlijst op die waarde filtert, net als bij de locaties. */
function barRows(pairs, dot, act){
  const mx = Math.max(1, ...pairs.map(p => p[1]));
  return pairs.map(p => {
    /* bij een typeverdeling krijgt de staaf de kleur van het type, net als het bolletje */
    const cls = (dot && TYPES[p[2]]) ? ' ' + TYPES[p[2]].c : '';
    const open = act ? `<button class="brow" style="width:100%" data-act="${act}" data-v="${esc(dot ? p[2] : p[0])}">` : '<div class="brow">';
    return `${open}<span class="l">${dot?dotHtml(p[2]):''}${esc(p[0])}</span>
    <span class="track"><span class="fill${cls}" style="width:${Math.max(4, p[1]/mx*100)}%"></span></span>
    <span class="v tnum">${p[1]}</span>${act ? '</button>' : '</div>'}`;
  }).join('');
}
function viewOverzicht(){
  const bc = bottleCount(), val = cellarValue();
  let totLow = 0, totHigh = 0;
  S.wines.forEach(w => { const q = w.qty||0, b = bronWaarde(w); if(!q || !b) return;
    totLow += q * (Number(w.valueLow) || b*0.8); totHigh += q * (Number(w.valueHigh) || b*1.2); });
  totLow = Math.round(totLow); totHigh = Math.round(totHigh);
  const ready = S.wines.filter(w => w.qty>0 && ['op','nu'].includes(windowStatus(w).k));
  const readyN = ready.reduce((n,w)=>n+w.qty,0);
  const thisYear = S.history.filter(h => !h.weg && (h.date||'').slice(0,4) == YR()).length;
  const soonAlle = S.wines.filter(w => w.qty>0 && ['nu','over'].includes(windowStatus(w).k))
    .sort((a,b)=>URG[windowStatus(a).k]-URG[windowStatus(b).k] || (a.drinkTo||9999)-(b.drinkTo||9999));
  const soon = soonAlle.slice(0,5);
  const byType = Object.keys(TYPES).map(t => [TYPES[t].l, S.wines.filter(w=>w.type===t).reduce((n,w)=>n+(w.qty||0),0), t]).filter(p=>p[1]>0);
  const landC = {};
  S.wines.forEach(w => { const c=(w.country||'Onbekend'); landC[c]=(landC[c]||0)+(w.qty||0); });
  const byLand = Object.entries(landC).filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]);
  const jaarC = {};
  S.wines.forEach(w => { const j=w.vintage||'NV'; jaarC[j]=(jaarC[j]||0)+(w.qty||0); });
  const byJaar = Object.entries(jaarC).filter(p=>p[1]>0).sort((a,b)=> (b[0]==='NV')?-1:(a[0]==='NV')?1:b[0]-a[0]);
  const locC = {};
  S.wines.forEach(w => { const l = w.location||'Zonder locatie'; locC[l]=(locC[l]||0)+(w.qty||0); });
  const byLoc = Object.entries(locC).filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]);
  const locMax = Math.max(1, ...byLoc.map(p=>p[1]));
  const recent = S.history.filter(h => !h.weg).slice(0,4);
  if(!S.wines.length && !S.history.length)
    return `${brandRow('')}<div class="eyebrow">Overzicht</div><h2 class="h2">Nog niets te zien</h2>
      <div class="empty"><p>Zodra er flessen in je kelder liggen zie je hier voorraad, waarde, drinkvensters en je historie.</p>
      <button class="btn" data-act="tab" data-tab="scan" style="max-width:240px">Scan je eerste fles</button></div>`;
  return `${brandRow('')}<div class="eyebrow">Overzicht</div><h2 class="h2">${esc(S.settings.cellarName)}</h2>
    ${tonightBanner()}
    <div class="tiles">
      <button class="tile" data-act="tileAll"><div class="k">Flessen</div><div class="n">${bc}</div><div class="s">tik voor de lijst</div></button>
      <div class="tile"><div class="k">Kelderwaarde</div><div class="n">${val?money(val):'—'}</div>${val?`<div class="s tnum">${money(totLow)} – ${money(totHigh)}</div>`:''}${zonderPrijs()?`<div class="s">${zonderPrijs()} ${plur(zonderPrijs(),'fles','flessen')} zonder prijs</div>`:''}</div>
      <button class="tile" data-act="tileDronk"><div class="k">Nu op dronk</div><div class="n" style="color:var(--ok)">${readyN}</div><div class="s">tik voor de lijst</div></button>
      ${thisYear ? `<button class="tile" data-act="tileGedronken"><div class="k">Gedronken in ${YR()}</div><div class="n">${thisYear}</div><div class="s">tik voor de lijst</div></button>` : `<div class="tile"><div class="k">Gedronken in ${YR()}</div><div class="n">0</div></div>`}
    </div>
    ${soon.length?`<div class="sect"><div class="eyebrow mb8">Drink binnenkort</div><div class="panel">${soon.map(w=>{const st=windowStatus(w);
      return `<button class="rowline" style="width:100%;text-align:left" data-act="detail" data-id="${w.id}"><span class="a"><div class="t">${esc(w.name)} ${w.vintage||''}</div><div class="u">×${w.qty}${w.location?' · '+esc(w.location):''}</div></span><span class="z"><span class="badge ${st.cls}">${st.sub||st.label}</span></span></button>`;}).join('')}</div>${soonAlle.length > soon.length ? `<div class="center mt8"><button class="linkbtn" data-act="soonAlle">Alle ${soonAlle.length} in de lijst →</button></div>` : ''}</div>`:''}
    ${byType.length?`<div class="sect"><div class="eyebrow mb8">Per type <span class="small" style="text-transform:none;letter-spacing:0">· tik voor de lijst</span></div><div class="panel">${barRows(byType,true,'filterType')}</div></div>`:''}
    ${byLand.length?`<div class="sect"><div class="eyebrow mb8">Per land</div><div class="panel">${ovStaven('land', byLand, false, 'filterLand')}</div></div>`:''}
    ${byJaar.length?`<div class="sect"><div class="eyebrow mb8">Per jaargang</div><div class="panel">${ovStaven('jaar', byJaar, false, 'filterJaar')}</div></div>`:''}

  const d = { name:it.name, producer:it.producer||'', vintage:it.vintage||null, type:it.type||'rood',

ACT.estValues = async el => {
  if(!aiReady()){ toast(hoofd(aiRedenUit())); return; }
  const targets = S.wines.filter(w => w.value == null);
  if(!targets.length){ toast('Alle flessen hebben al een waarde'); return; }
  const orig = el.textContent; el.textContent = 'Inschatten…'; el.style.pointerEvents = 'none';
  try{
    /* in blokken van 40: meer wijnen per antwoord loopt tegen het uitvoerplafond aan (afgekapte JSON) */
    let n = 0; const alle = [];
    for(let i = 0; i < Math.min(targets.length, 120); i += 40){ const r = await aiValues(targets.slice(i, i + 40)); alle.push(...(r.values||[])); }
    for(const v of alle){
      const w = findWine(v.id);
      if(w && v.value != null){
        w.value = Math.round(v.value); w.valueSrc = 'ai'; w.valueAt = vandaag(); w.valueBron = null;
        if(v.low != null) w.valueLow = Math.round(v.low);
        if(v.high != null) w.valueHigh = Math.round(v.high);
        n++;
      }
    }
    save(); render();
    toast(n ? `${n} ${plur(n,'waarde','waardes')} ingeschat${targets.length>120?' (eerste 120)':''}` : 'Geen waardes kunnen inschatten');
  }catch(e){
    toast('Inschatten mislukte: ' + String(e.message||e).slice(0,90), null, null, 6000);
    el.textContent = orig; el.style.pointerEvents = '';
  }
};

function isStandalone(){
  return (matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
function isApple(){
  const ua = navigator.userAgent || '';
  return /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && (navigator.maxTouchPoints||0) > 1);
}
/* Welke browser op de iPhone. Sinds iOS 16.4 kunnen ook Chrome, Firefox en Edge een app op het
   beginscherm zetten (de knop zit alleen ergens anders dan in Safari); het venster van een andere
   app (WhatsApp, Instagram, Facebook) kan het nooit. Chrome is CriOS, Firefox FxiOS, Edge EdgiOS;
   een venster in een andere app mist het woord Safari. Brave en DuckDuckGo zien eruit als Safari
   en hebben de knop op dezelfde plek. */
function iosBrowser(){
  const ua = navigator.userAgent || '';
  if(/CriOS/.test(ua)) return 'chrome';
  if(/FxiOS/.test(ua)) return 'firefox';
  if(/EdgiOS/.test(ua)) return 'edge';
  if(!/Safari\//.test(ua)) return 'app';
  return 'safari';
}

/* De stappen per browser. De tekst noemt de plek van de deelknop, want daar liep het op vast:
   in Chrome zit hij rechts in de adresbalk, in Safari onderin. "Zet op beginscherm" staat in het

function installUitlegIos(){
  const br = iosBrowser();
  const adres = esc((location.host + location.pathname).replace(/\/(index\.html)?$/, ''));
  if(br === 'app') return `<p class="small">Je zit in het venster van een andere app, en daar kan dit niet. Open <b>${adres}</b> in Safari of Chrome zelf en probeer het daar.</p>`;

    : br === 'firefox' ? `Tik in Firefox onderin op het menu (de drie streepjes) en kies <b>Delen</b>.`
    : br === 'edge' ? `Tik in Edge onderin op het menu (de drie puntjes) en kies <b>Delen</b>.`
    : `Tik onderin Safari op het <b>deel-icoon</b>, het vierkantje met het pijltje omhoog.`;
  const wenk = br === 'safari'
    ? `Staat "Zet op beginscherm" er ook na Toon meer niet bij? Dan zit je waarschijnlijk in het venster van een andere app. Open <b>${adres}</b> in Safari zelf en probeer het daar.`
    : `Staat "Zet op beginscherm" er ook na Toon meer niet bij? Dan draait je iPhone een iOS-versie van vóór 16.4, en kan alleen Safari dit. Kopieer het adres <b>${adres}</b>, open Safari, plak het daar en probeer het opnieuw.`;
  return `<ol style="font-size:14px;color:var(--ink2);line-height:1.7;margin-left:18px">
      <li>${stap1}</li>
      <li>Scroll in dat menu omlaag naar <b>"Zet op beginscherm"</b>. Zie je hem niet, tik dan op <b>Toon meer</b>.</li>
      <li>Tik rechtsboven op <b>Voeg toe</b>.</li>

}

   kelders wél in zitten: een lijst in een spreadsheet of notitie, een papieren
   lijstje naast het rek, of een doos met flessen die rechtop staan. Liggende
   flessen in een rek laten alleen de bodem zien, dus die vragen we niet. */
const IMP_MAX = 4;

async function aiImport(){
  const prompt = `Je helpt iemand zijn bestaande wijnkelder overnemen in een app. Haal uit de foto's en/of de tekst hieronder alle flessen die je kunt herkennen.
Antwoord UITSLUITEND met geldig JSON, zonder andere tekst:
{"wines":[{"name":"naam van de wijn","producer":"producent of null","vintage":2019 of null,"type":"rood|wit|oranje|rose|mousserend|zoet|versterkt","grapes":["druif",...],"country":"land of null","region":"regio of null","appellation":"appellation of null","qty":1}]}
qty is het aantal flessen als dat uit de lijst of de foto blijkt, anders 1. Staat dezelfde wijn meerdere keren, voeg hem dan samen en tel qty op.
Neem alleen flessen op die je echt leest of ziet. Verzin niets: een veld dat je niet kunt lezen wordt null. Zie je geen enkele fles, antwoord dan met {"wines":[]}.`;
  const content = [];
  for(const sh of imp.shots) content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data: sh.split(',')[1]}});
  const t = (imp.text||'').trim();
  content.push({type:'text', text: prompt + (t ? `\n\nDe tekst:\n${t.slice(0, 6000)}` : '')});
  const out = await callClaude(content, 4000, 'import');
  const d = parseJsonLoose(out);
  return Array.isArray(d.wines) ? d.wines.slice(0, 60).map(schoonAI) : [];
}

/* ---- CSV: CellarTracker, Vivino of een eigen spreadsheet, zonder AI ----
   Scheidingsteken wordt geraden uit de kopregel; aanhalingstekens volgens de gewone
   CSV-regels. De kolommen worden herkend aan hun naam en zijn daarna nog te wisselen. */
ACT.impCsv = () => document.getElementById('fCsv').click();
function csvParse(text){
  text = String(text||'').replace(/^﻿/, '');
  const eerste = text.split(/\r?\n/, 1)[0] || '';
  const tel = ch => (eerste.split(ch).length - 1);
  const sep = [['\t', tel('\t')], [';', tel(';')], [',', tel(',')]].sort((a,b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cel = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cel += '"'; i++; } else q = false; } else cel += ch; }
    else if(ch === '"') q = true;
    else if(ch === sep){ row.push(cel); cel = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(cel); rows.push(row); row = []; cel = ''; }
    else cel += ch;
  }
  if(cel !== '' || row.length){ row.push(cel); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
/* veld, label in het koppelscherm, kolomnamen waar we hem aan herkennen (CellarTracker, Vivino, Nederlands) */
const CSV_VELDEN = [
  ['name', 'Naam van de wijn', ['wine','wine name','name','naam','wijn','cuvee','cuvée','label','wijnnaam']],
  ['producer', 'Producent', ['producer','winery','producent','domaine','chateau','château','estate','maker','huis']],
  ['vintage', 'Jaargang', ['vintage','jaargang','year','jaar','millesime','millésime']],
  ['type', 'Type of kleur', ['type','wine type','color','colour','kleur','category','style','soort']],
  ['grapes', 'Druiven', ['varietal','master varietal','grapes','grape','druif','druiven','cepage','cépage','variety']],
  ['country', 'Land', ['country','land','pays']],
  ['region', 'Regio', ['region','regio','streek','sub region','subregion']],
  ['appellation', 'Appellation', ['appellation','aoc','doc','denominazione']],
  ['qty', 'Aantal', ['quantity','qty','aantal','bottles','count','flessen','stock','inventory','number of bottles']],
  ['location', 'Locatie', ['location','locatie','plek','cellar','rek','bin','storage','kast']],
  ['price', 'Aankoopprijs', ['price','prijs','purchase price','cost','paid','aankoopprijs','betaald']],
  ['value', 'Waarde', ['valuation','value','waarde','market value','estimated value','ct valuation','marktwaarde']],
  ['drink_from', 'Op dronk van', ['begin consume','beginconsume','drink from','drinkfrom','from','vanaf','van','drink_from']],
  ['drink_to', 'Op dronk tot', ['end consume','endconsume','drink to','drinkto','to','tot','drink by','drink_to']],
  ['note', 'Notitie', ['note','notes','notitie','personal note','comment','comments','remarks','opmerking','tasting note']]
];
let csvData = null;
function csvKoppel(text){
  const rows = csvParse(text);
  if(rows.length < 2){ toast('Geen tabel gevonden in dit bestand'); return; }
  const kop = rows[0].map(h => String(h).trim());
  const key = x => norm(x).replace(/[^a-z0-9]/g, '');
  const kk = kop.map(key);
  const gekozen = {}, bezet = new Set();
  for(const [veld, , namen] of CSV_VELDEN){
    for(const a of namen){ const i = kk.indexOf(key(a)); if(i >= 0 && !bezet.has(i)){ gekozen[veld] = i; bezet.add(i); break; } }
  }
  csvData = { kop, rows: rows.slice(1) };
  const opties = i => `<option value="">—</option>` + kop.map((h, j) => `<option value="${j}" ${i === j ? 'selected' : ''}>${esc(h || 'kolom ' + (j+1))}</option>`).join('');
  openSheet(`${sheetHead('Kolommen koppelen')}
    <p class="small mb8">${csvData.rows.length} ${plur(csvData.rows.length,'regel','regels')} gevonden. Per veld staat de kolom die er het meest op lijkt; pas aan waar nodig. Alleen de naam is verplicht.</p>
    ${CSV_VELDEN.map(([veld, label]) => `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><label class="small" style="flex:none;width:112px">${label}</label><select class="inp" data-csv="${veld}" style="flex:1;min-width:0">${opties(gekozen[veld])}</select></div>`).join('')}
    <button class="btn mt14" data-act="csvLees">Inlezen</button>`);
}
const CSV_WIT = ['chardonnay','sauvignon','riesling','chenin','pinot gris','pinot grigio','gruner','grüner','viognier','albari','verdejo','semillon','sémillon','gewurz','muscat','moscato','vermentino','grillo','fiano','garganega','trebbiano','muscadet','melon','silvaner','aligot','picpoul','assyrtiko','torront','pinot blanc','pinot bianco','furmint','marsanne','roussanne','godello','verdicchio','cortese','arneis','pecorino','greco'];
ACT.csvLees = el => {
  if(!csvData) return;
  const R = el.closest('.sheet') || document;
  const m = {}; R.querySelectorAll('select[data-csv]').forEach(x => { if(x.value !== '') m[x.dataset.csv] = +x.value; });
  if(m.name == null){ toast('Kies de kolom met de naam van de wijn'); return; }
  const g = (r, v) => m[v] == null ? '' : String(r[m[v]] ?? '').trim();
  const getal = x => { const n = parseFloat(String(x).replace(/[^\d,.-]/g, '').replace(',', '.')); return Number.isFinite(n) ? n : null; };
  const jaar = x => { const n = parseInt(String(x).replace(/\D/g, '').slice(0, 4), 10); return (n >= 1900 && n <= 2100) ? n : null; };
  const samen = new Map();
  for(const r of csvData.rows){
    const name = g(r, 'name').slice(0, 200); if(!name) continue;
    const producer = g(r, 'producer').slice(0, 200), vintage = jaar(g(r, 'vintage'));
    const k = norm(name) + '|' + norm(producer) + '|' + (vintage || 'nv');
    const qty = Math.max(1, Math.min(99, Math.round(getal(g(r, 'qty')) || 1)));
    if(samen.has(k)){ samen.get(k).qty = Math.min(99, samen.get(k).qty + qty); continue; }
    const typeTxt = g(r, 'type'), grapesTxt = g(r, 'grapes');
    const grapes = grapesTxt.split(/[,;\/|]/).map(x => x.trim()).filter(Boolean).slice(0, 8);
    let type = typeTxt ? mapType(typeTxt) : 'rood';
    if(!typeTxt && grapes.length && grapes.every(x => CSV_WIT.some(c => norm(x).includes(c)))) type = 'wit';
    const w = { name, producer, vintage, type, grapes, qty,
      country: g(r, 'country').slice(0, 100), region: g(r, 'region').slice(0, 120), appellation: g(r, 'appellation').slice(0, 160),
      location: g(r, 'location').slice(0, 120), note: g(r, 'note').slice(0, 2000),
      price: getal(g(r, 'price')), value: getal(g(r, 'value')),
      drink_from: jaar(g(r, 'drink_from')), drink_to: jaar(g(r, 'drink_to')) };
    if(w.value != null) w.valueSrc = 'eigen';
    if(w.drink_from && w.drink_to && w.drink_to < w.drink_from){ w.drink_from = null; w.drink_to = null; }
    samen.set(k, w);
    if(samen.size >= 400) break;
  }
  const lijst = [...samen.values()];
  if(!lijst.length){ toast('Geen wijnen gevonden in deze kolommen'); return; }
  const afgekapt = csvData.rows.length > 400 && lijst.length >= 400;
  csvData = null;
  imp.found = lijst.map(w => { const dubbel = matchWine({name:w.name, producer:w.producer, vintage:w.vintage}); return {...w, dubbel: !!dubbel, pick: !dubbel}; });
  closeSheet(true); UI.tab = 'meer'; UI.meerPage = 'import'; render();
  toast(`${lijst.length} ${plur(lijst.length,'wijn','wijnen')} gelezen${afgekapt ? ' (de eerste 400)' : ''}`);
};

ACT.impRun = async () => {

    imp.found = lijst.map(w => {
      const dubbel = matchWine({name:w.name, producer:w.producer, vintage:w.vintage});
      return { ...w, qty: Math.max(1, Math.min(99, parseInt(w.qty,10) || 1)),

ACT.impAdd = async () => {
  const kies = imp.found.filter(f => f.pick);
  if(!kies.length) return;
  let n = 0;
  for(const f of kies){
    const w = { id:uid(), name:(f.name||'').trim(), producer:(f.producer||'').trim(),
      vintage: (f.vintage && f.vintage >= 1900 && f.vintage <= 2100) ? f.vintage : null,
      type: TYPES[f.type] ? f.type : 'rood',
      grapes: Array.isArray(f.grapes) ? f.grapes.filter(Boolean) : [],
      country:(f.country||'').trim(), region:(f.region||'').trim(), appellation:(f.appellation||'').trim(),
      location:(f.location||'').trim(), note:(f.note||'').trim(),
      price: f.price ?? null, value: f.value ?? null,
      drink_from: f.drink_from || null, drink_to: f.drink_to || null,   /* uit een CSV; anders schat ensureWindow */
      qty: f.qty, pairing:[], photo:false, addedAt:Date.now() };
    if(w.value != null && f.valueSrc === 'eigen'){ w.valueSrc = 'eigen'; w.valueAt = vandaag(); }
    if(w.location) S.settings.lastLocation = w.location;
    ensureWindow(w);
    /* estimateWindow rekent in drinkFrom/drinkTo, ensureWindow in drink_from/to */
    if(w.drink_from != null){ w.drinkFrom = w.drink_from; delete w.drink_from; }
    if(w.drink_to != null){ w.drinkTo = w.drink_to; delete w.drink_to; }
    S.wines.unshift(w); n += 1;
  }
  save();
  const flessen = kies.reduce((a,f) => a + f.qty, 0);
  impReset(); UI.tab = 'kelder'; UI.meerPage = 'menu'; render();
  toast(`${n} ${plur(n,'wijn','wijnen')} toegevoegd, samen ${flessen} ${plur(flessen,'fles','flessen')}`);
};

async function buildExport(withPhotos){
  const data = { app:'cellarmentor', v:1, exportedAt:new Date().toISOString(), cellarName:S.settings.cellarName,
    wines:S.wines, history:S.history, wishlist:S.wishlist, locations:S.locations||[] };
  if(withPhotos){
    const photos = {};
    for(const w of [...S.wines, ...S.wishlist, ...(S.locations||[])]) if(w.photo){ const p = await pGet(w.id); if(p) photos[w.id] = p; }
    data.photos = photos;
  }
  return JSON.stringify(data);
}
async function saveFile(name, text){
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename:name, data:text}); toast('Back-up opgeslagen'); }
    catch(e){
      if(e && e.code === 'declined') return;
      if(e && e.code === 'rate_limited'){ toast('Er staat nog een download open. Probeer het zo weer'); return; }
      try{ await navigator.clipboard.writeText(text); toast('Downloaden lukte niet. De back-up staat op je klembord'); }
      catch(e2){ toast('Back-up maken lukte niet'); }
    }
    return;
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('Back-up gedownload');
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('Back-up staat op je klembord'); }catch(e2){ toast('Back-up maken lukte niet'); }
  }
}

async function doImport(text){
  let d; try{ d = JSON.parse(text); }catch(e){ toast('Geen geldig back-upbestand'); return; }
  if(!d || (d.app !== 'cellarmentor' && d.app !== 'caveau') || !Array.isArray(d.wines)){ toast('Dit is geen CellarMentor-back-up'); return; }
  openSheet(`${sheetHead('Back-up inlezen')}
    <p style="font-size:14px;color:var(--ink2)">Gevonden: <b>${d.wines.length}</b> wijnen, ${(d.history||[]).length} historie-regels, ${(d.wishlist||[]).length} wensen${d.photos?`, ${Object.keys(d.photos).length} foto's`:''}.</p>
    <div class="btnrow mt14"><button class="btn ghost" id="impMerge">Samenvoegen</button><button class="btn" id="impReplace">Vervangen</button></div>
    <p class="small center mt8">Samenvoegen slaat flessen over die er al staan.</p>`);
  const apply = async (replace) => {
    /* een back-up is een bestand van buiten: eerst normaliseren, dan pas in de kelder */
    const wijnen = schoonLijst(d.wines, schoonWijn), hist = schoonLijst(d.history, schoonHist), wensen = schoonLijst(d.wishlist, schoonWens), locs = schoonLijst(d.locations, schoonLoc);
    if(replace){ S.wines = wijnen; S.history = hist; S.wishlist = wensen; S.locations = locs; if(d.cellarName) S.settings.cellarName = tekstOk(d.cellarName, 60); }
    else {
      const ln = new Set((S.locations||[]).map(l => l.name));
      locs.forEach(l => { if(!ln.has(l.name)) S.locations.push(l); });
      const have = new Set(S.wines.map(w => w.id));
      wijnen.forEach(w => { if(!have.has(w.id)) S.wines.push(w); });
      const hh = new Set(S.history.map(h => h.id));
      hist.forEach(h => { if(!hh.has(h.id)) S.history.push(h); });
      const ww = new Set(S.wishlist.map(x => x.id));
      wensen.forEach(x => { if(!ww.has(x.id)) S.wishlist.push(x); });
    }
    if(d.photos && typeof d.photos === 'object') for(const [id, p] of Object.entries(d.photos)) if(ID_OK.test(id) && typeof p === 'string' && p.startsWith('data:image/')) await pSet(id, p);
    save(); closeSheet(true); render(); toast('Back-up ingelezen');
  };
  document.getElementById('impReplace').onclick = () => apply(true);
  document.getElementById('impMerge').onclick = () => apply(false);
}
/* Wissen doet wat de privacyverklaring belooft: met sync aan gaat eerst de cloud leeg
   (leeg document met hogere rev, foto's weg), pas daarna dit apparaat. Lukt de cloud
   niet, dan wordt er niets gewist. De sessie, taal en weergave blijven staan: het
   account is niet weg, alleen de kelder. */
ACT.wipe = () => confirmSheet('Alles wissen?', 'Je hele kelder, historie, verlanglijst en foto\'s worden gewist, en als cloud-sync aanstaat ook in de cloud. <b>Dit kan niet ongedaan worden.</b> Maak eerst een back-up.', 'Wis alles', async () => {
  const cloudAan = typeof loggedIn === 'function' && loggedIn();
  let rev = 0;
  if(cloudAan){
    toast('Cloud wissen…', null, null, 20000);
    try{ rev = await cloudWis(); }
    catch(e){ toast('Wissen in de cloud lukte niet: ' + String(e.message||e).slice(0, 80) + '. Er is niets gewist', null, null, 8000); return; }
  }
  const ids = await pKeys(); for(const id of ids) await pDel(id);
  photoCache.clear();
  const bewaar = {cloud: S.settings.cloud, taal: S.settings.taal, theme: S.settings.theme, installWeg: S.settings.installWeg};
  S = DEFAULTS(); Object.assign(S.settings, bewaar);
  if(cloudAan){ S.rev = rev; S.syncedRev = rev; S.syncedTel = [0, 0, 0]; }
  save(true); scanReset(); render(); toast(cloudAan ? 'Alles gewist, ook in de cloud' : 'Alles gewist');
}, true);

/* ================= CLOUD-SYNC (Supabase) =================

   versie opgehaald (last-write-wins op documentniveau, foto's incrementeel).
   API-sleutel (AI) en sessietokens verlaten het apparaat nooit. */
const SB_URL = 'https://dbzgrkipcoebglacsqwe.supabase.co';
const SB_KEY = 'sb_publishable_Qvrq6CS6M-CPY5nwQ6suAw_lkpwYrYR';
const CLOUD_OK = !IN_SANDBOX;

let sbAccess = null;
let syncTimer = null, syncBusy = false, syncAgain = false, lastSyncNote = '';

function cloud(){ if(!S.settings.cloud) S.settings.cloud = {refresh:null, email:null, uid:null, lastSync:null}; return S.settings.cloud; }

/* Geen enkele fetch mag eeuwig hangen: op slechte wifi bleef de app anders 'bezig'. */
const tijdslimiet = ms => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(ms) : undefined;
/* Het toegangstoken leeft een uur. Wie de app langer open had kreeg daarna "Serverfout 401":
   het token werd pas vernieuwd als het leeg was, nooit als het verlopen was. Nu kijken we
   naar de vervaltijd in het token zelf en vernieuwen we een minuut van tevoren; komt er
   toch een 401, dan één keer vernieuwen en opnieuw proberen. */
function tokenVerlopen(t){
  if(!t) return true;
  try{ const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return !p.exp || p.exp * 1000 < Date.now() + 60000; }catch(e){ return false; }
}
async function sbToken(){
  if(!sbAccess || tokenVerlopen(sbAccess)){ const ok = await sbRefresh(); if(!ok) return null; }
  return sbAccess;
}
/* Aanroep van een Edge Function met vers token en één herkansing bij 401. Netwerkfouten gooien. */
async function fnFetch(name, init){
  let token = await sbToken();
  if(!token){ const e = new Error('Sessie verlopen. Log opnieuw in bij Meer → Account'); e.status = 401; e.sessie = true; throw e; }
  const doe = () => fetch(SB_URL + '/functions/v1/' + name, {...init, headers:{...(init.headers||{}), 'authorization':'Bearer ' + token, 'apikey':SB_KEY}});
  let res = await doe();
  if(res.status === 401 && await sbRefresh()){ token = sbAccess; res = await doe(); }
  return res;
}
async function sbFetch(path, opts, noAuth){
  opts = opts || {};
  const h = { 'apikey': SB_KEY, 'content-type': 'application/json', ...(opts.headers||{}) };
  if(!noAuth && sbAccess && tokenVerlopen(sbAccess) && !/refresh_token/.test(path)) await sbRefresh();
  if(!noAuth && sbAccess) h['authorization'] = 'Bearer ' + sbAccess;
  let res = await fetch(SB_URL + path, {signal: tijdslimiet(30000), ...opts, headers: h});
  if(res.status === 401 && !noAuth && !/refresh_token/.test(path) && await sbRefresh()){
    h['authorization'] = 'Bearer ' + sbAccess;
    res = await fetch(SB_URL + path, {signal: tijdslimiet(30000), ...opts, headers: h});
  }
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    const e = new Error('HTTP ' + res.status + ' ' + t.slice(0,160)); e.status = res.status; throw e;
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

function applySession(s){
  sbAccess = s.access_token || sbAccess;
  const c = cloud();
  if(s.refresh_token) c.refresh = s.refresh_token;
  if(s.user){
    /* Logt er een ánder account in op dit apparaat, dan is de kelder die hier staat

    if(c.uid && s.user.id !== c.uid){

      if(ietsHier) snapshotLocal('caveau_backup_prev', {vanEmail: c.email || ''});

      S.rev = 0; S.syncedRev = 0; delete S.syncedTel;

  }

}

async function sbSignup(email, pass){

async function sbRefresh(){

/* ---- document-sync (last-write-wins op S.rev) ---- */
function cloudDoc(){ return { rev: S.rev||0, wines: S.wines, history: S.history, wishlist: S.wishlist,
  locations: S.locations||[], pairCache: S.pairCache||[], recipeCache: S.recipeCache||[], tonight: S.tonight||[], cellarName: S.settings.cellarName }; }
function adoptDoc(d){

}
async function pushDoc(){
  await sbFetch('/rest/v1/cellars?on_conflict=user_id', {method:'POST',
    headers:{'prefer':'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify([{user_id: cloud().uid, data: cloudDoc(), updated_at: new Date().toISOString()}])});

async function pullRev(){
  const rows = await sbFetch('/rest/v1/cellars?select=data->rev&user_id=eq.' + cloud().uid, {method:'GET'});

const DOC_MAX = 4000000; /* tekens JSON; localStorage houdt rond 5 MB en er moeten vier kopieën in */

/* ---- vangnet: lokale reservekopieën + rem op verdachte krimp ---- */
function snapshotLocal(key, extra){
  try{
    if(!(S.wines.length || S.history.length)) return;
    /* De vorige reservekopie een plek opschuiven. Twee ongelukken achter elkaar
       overschreven anders precies de kopie die je nodig had. */
    if(key === 'caveau_backup_prev'){
      const oud = localStorage.getItem(key);
      if(oud) localStorage.setItem('caveau_backup_prev2', oud);

      data:{wines:S.wines, history:S.history, wishlist:S.wishlist, locations:S.locations||[], cellarName:S.settings.cellarName}}));   /* caches zijn regenereerbaar en horen niet in een reservekopie */
  }catch(e){}
}
async function applyRemote(remote){

/* een sync of prijsronde op de achtergrond mag een formulier in bewerking niet wissen */
function renderTenzijFormulier(){ if(UI.tab === 'scan' && scan.stage === 'confirm') return; if(sheets.length) return; render(); }
const shrinks = (van, naar) => van >= 5 && naar < Math.max(1, Math.ceil(van * 0.2)); /* >80% zou verdwijnen */
/* Ook een historie of verlanglijst kan in één klap verdwijnen, en die zijn net zo
   min terug te halen als de flessen zelf. Alle drie apart wegen. */
function krimpErgens(hier, daar){
  const tel = d => [ (d.wines||[]).length, (d.history||[]).length, (d.wishlist||[]).length ];
  const a = tel(hier), b = tel(daar);
  return a.some((n, i) => shrinks(n, b[i]));
}

function askShrink(mode, remote, lc, rc){
