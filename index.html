/* Het venster uit de scan tegen de kelderregels leggen.
   Ontbreekt het, dan vullen de regels het in. Staat het er wel, dan blijft het staan, op één
   geval na: een taalmodel is stelselmatig voorzichtig met bewaaradvies en geeft een vintage
   champagne of een Barolo uit een groot jaar er graag tien jaar te weinig. Scheelt het vijf jaar
   of meer aan de achterkant, dan winnen de regels, want die kennen de jaargang in die streek en
   het model raadt hem. Aan de voorkant blijft het model staan: vroeger open mag altijd. */
const VERZOEN_JAAR = 5;
function ensureWindow(d){
  const est = estimateWindow({ type: mapType(d.type||'rood'), grapes: d.grapes||[], region: d.region,
    appellation: d.appellation, country: d.country, name: d.name, producer: d.producer, vintage: d.vintage||null });
  const had = !!(d.drink_from && d.drink_to);
  d.drink_from = d.drink_from || est.from;
  d.drink_to = d.drink_to || est.to;
  if(had && est.to - d.drink_to >= VERZOEN_JAAR){ d.drink_to = est.to; d.drink_src = 'regels'; }
  else d.drink_src = had ? 'ai' : 'regels';
  if(d.drink_from > d.drink_to) d.drink_from = est.from;
}
/* Eén leesbeurt met herkansing. Breekt de stroom halverwege af (mobiel netwerk, even geen bereik),
   dan is het halve antwoord geen JSON en zou de gebruiker een credit kwijt zijn zonder resultaat.
   Dan meteen nog één keer, zonder streamen: die weg is minder kwetsbaar. */
const parseFout = e => /JSON|Expected|Unexpected|token|EOF/i.test(String((e && e.message) || e));
const leesFout = e => parseFout(e) ? 'het antwoord kwam twee keer onvolledig aan' : String((e && e.message) || e).slice(0, 120);
async function scanLezen(){
  const live = txt => {
    const el = document.getElementById('scanLive');
    if(el){ const p = scanPeek(txt); if(p){ el.textContent = p; el.classList.remove('pulse'); } }
    vulFormLive(scanPartial(txt));
  };
  let d;
  try{ d = await aiScan(scan.photo, live); }
  catch(e){
    if(!parseFout(e)) throw e;
    const el = document.getElementById('scanLive');
    if(el){ el.textContent = 'Het antwoord kwam gehavend aan, ik lees het nog een keer…'; el.classList.add('pulse'); }
    d = await aiScan(scan.photo, null);
  }
  typeControle(d); waardeControle(d);
  ensureWindow(d);
  behoudEigenInvoer(d);
  scan.data = d;
  scan.match = matchWine({name:d.name, producer:d.producer, vintage:d.vintage});
  /* typte de gebruiker intussen een andere jaargang dan de AI las, dan hoort de waarde daarbij */
  const root = scanRoot(), f = root ? readForm(root) : {};
  if(root && scanTouched.has('f_vintage') && f.vintage && f.vintage !== d.vintage && aiReady() && d.name)
    setTimeout(() => { if(scan.stage === 'confirm' && !scan.busy) doRecalc(document.getElementById('recalcBtn'), false, {auto:true}); }, 400);
}

};

ACT.scanAdd = async () => {

  /* de zoekidentiteit van de scanner (v82): de vorm waaronder een winkel de fles verkoopt, voor de prijstabel en de zoeklaag */
  if(scan.data){ const zp = tekstOk(scan.data.zoek_producent, 200), zn = tekstOk(scan.data.zoek_naam, 200); if(zp) w.zoekProducer = zp; if(zn) w.zoekNaam = zn; if(eanSchoon(scan.data.ean)) w.ean = eanSchoon(scan.data.ean); }

  if(w.value != null){
    const vanAI = (scan.data && scan.data.value_eur != null && w.value === Math.round(scan.data.value_eur)) || (recalcValueRange && w.value === recalcValueRange.value);
    w.valueSrc = vanAI ? 'ai' : 'eigen'; w.valueAt = vandaag();
  }
  if(scan.data && scan.data.prijs_onzeker && w.value == null) w.prijsOnzeker = true;
  prijsAlsBron(w); deelBetaald(w);
  if((document.getElementById('scanTonight')||{}).checked){ if(!S.tonight) S.tonight = []; S.tonight.push({wineId:w.id, at:Date.now()}); }
  const geproefd = proefSchrijf(w, pr);
  rekNaBewaren(w, null);
  S.wines.unshift(w); save();
  if(scan.thumb) await pSet(w.id, scan.thumb);
  const n = formQty; scanReset(); UI.tab = 'kelder'; render();
  const gelegd = `${n} ${plur(n,'fles','flessen')} in de kelder gelegd${geproefd ? ', proefnotitie bewaard' : ''}`;
  /* zonder plek: één tik om er alsnog een te geven, geen extra stap voor wie dat niet wil */
  if(!w.location) toast(gelegd + ', nog zonder plek', 'Plek geven', () => openPlekGeven(w.id), 5500);
  else toast(gelegd);
  /* eerst gratis de prijstabel; daarna pas zoeken, als het tegoed dat toelaat en de fles het waard is */
  if(w.valueSrc !== 'zoek') setTimeout(() => prijsNaScan(w), w.location ? 0 : 5600);
};

async function runPair(dish, force, stuur){
  if(!dish){ toast('Vertel eerst wat je gaat eten'); return; }
  const out = document.getElementById('pairOut'); if(!out) return;
  stuur = (stuur || '').trim().slice(0, 120);
  UI.pairDish = dish; pairWisToon();
  const key = norm(dish) + (stuur ? ' | ' + norm(stuur) : '');
  let html = '', src = 'Kelderregels', matches = null, buyTip = null, cachedAt = null;
  let aiFout = '', regels = [];   /* waarom de sommelier niet meedeed, en welke regel er dan gold; staat boven de kelderregels */
  /* eerder opgeslagen resultaat? (alleen wijnen die nog op voorraad zijn) */
  if(!force){
    const hit = (S.pairCache||[]).find(c => c.key === key);
    if(hit){
      const ms = (hit.matches||[]).map(m => ({w:findWine(m.id), score:m.score, reason:m.reason})).filter(m => m.w && m.w.qty > 0);
      if(ms.length){ matches = ms; buyTip = hit.buyTip||null; src = 'Opgeslagen'; cachedAt = hit.at; }
    }
  }
  if(!matches){
    out.innerHTML = `<div class="banner">${pourSvg}<span class="pulse">De sommelier proeft in gedachten…</span></div>`;
    if(aiReady()){
      try{
        const r = await aiDish(dish, stuur);
        matches = (r.matches||[]).map(m => ({w:findWine(m.id), score:Math.round(m.score), reason:m.reason})).filter(m => m.w);
        buyTip = r.buy_tip || null; src = 'Sommelier-AI';
        if(matches.length){
          S.pairCache = (S.pairCache||[]).filter(c => c.key !== key);
          S.pairCache.unshift({key, dish, stuur: stuur || undefined, at:Date.now(), matches:matches.map(m => ({id:m.w.id, score:m.score, reason:m.reason})), buyTip});
          S.pairCache = S.pairCache.slice(0, 30);
          save();
        }
      }catch(e){ matches = null; aiFout = leesFout(e); }
    } else aiFout = aiRedenUit();
    if(!matches || !matches.length){
      const r = winesForDish(dish); src = 'Kelderregels';
      regels = r.cats.map(c => c.rW.charAt(0).toUpperCase() + c.rW.slice(1));
      matches = r.list.map(x => ({w:x.w, score:x.score, reason:x.rHtml}));
      if(!matches.length && r.cats.length) buyTip = 'Niets ideaals op voorraad. Kooptip: ' + r.cats[0].buy + '.';
    }
  }
  if(matches.length){
    const meta = (src === 'Opgeslagen' ? `Opgeslagen · ${new Date(cachedAt).toLocaleDateString(LOCALE(),{day:'numeric',month:'short'})}` : bronLabel(src)) + (stuur ? ` · ${stuur}` : '');
    if(src === 'Kelderregels') html += zonderAiHtml(aiFout || 'de sommelier vond niets') + regels.map(r => `<p class="small mb8">${esc('Kelderregel: ' + r + '.')}</p>`).join('');
    html += `<div class="mb8" style="display:flex;gap:10px;align-items:center"><span class="srcchip">${esc(meta)}</span>${src==='Opgeslagen'?`<button class="linkbtn" style="font-size:12.5px" data-act="pairFresh" data-d="${esc(dish)}">↻ vernieuw</button>`:''}</div>` + matches.map(m => {
      const st = windowStatus(m.w);
      const urg = st.k === 'nu' ? 'Moet toch binnenkort op, vanavond is een mooi excuus.'
                : st.k === 'over' ? 'Over z\'n venster heen. Juist nú opdrinken, niet langer bewaren.' : '';
      return `<div class="match"><div class="match-top"><div style="min-width:0">
        <div class="wname" style="font-size:16px">${esc(m.w.name)}</div>
        <div class="wsub">${esc([m.w.producer, m.w.vintage||'NV'].filter(Boolean).join(' · '))} · ×${m.w.qty}</div>
        <div class="wmeta mt8">${dotHtml(m.w.type)}<span class="badge ${st.cls}">${st.label}${st.sub?' · '+st.sub:''}</span>${topBadge(m.w)}</div></div>
        <div class="mscore">${Number(m.score)||0}<small>/10</small></div></div>
        ${smaakHit(m.w)?'<div class="mreason" style="color:var(--acc-ink)">'+ik('hart')+' Past bij je smaak</div>':''}
        <div class="mreason">${esc(m.reason||'')}</div>
        ${urg?`<div class="mreason" style="color:var(--warn);font-weight:600">${ik('zandloper')} ${urg}</div>`:''}
        <div class="mt8" style="display:flex;gap:16px;flex-wrap:wrap"><button class="linkbtn" data-act="${onTable(m.w.id)?'tafelAf':'tafelOp'}" data-id="${m.w.id}">${onTable(m.w.id)?'✓ Op tafel':'✓ Deze kies ik'}</button><button class="linkbtn" data-act="detail" data-id="${m.w.id}">Bekijk fles →</button><button class="linkbtn" data-act="askSomm" data-id="${m.w.id}" data-dish="${esc(dish)}">${ik('chat')} Vraag</button></div></div>`;
    }).join('');
    if(buyTip) html += `<div class="banner"><span>${ik('winkel')}</span><span>${esc(buyTip)}</span></div>`;
    /* na het advies: bijsturen, alleen als de AI het kan opvolgen (de kelderregels kennen geen "liever wit") */
    if(aiReady()) html += `<div class="panel" style="padding:11px 13px;margin-top:12px"><div class="eyebrow mb8">Stuur het advies bij</div>
      <div style="display:flex;gap:8px"><input class="inp" id="pairStuur" placeholder="bv. liever wit, iets lichter, niet de Barolo" value="${esc(stuur||'')}" style="flex:1;min-width:0" aria-label="Bijsturing"><button class="btn sm" data-act="pairStuur" data-d="${esc(dish)}" style="flex:none">Opnieuw</button></div>
      <div class="chiprow" style="padding-top:8px">${['Liever wit','Liever rood','Iets lichter','Iets specialer','Een eenvoudigere fles','Niet de eerste'].map(q => `<button class="chip" data-act="pairStuurQuick" data-d="${esc(dish)}" data-s="${esc(q)}">${q}</button>`).join('')}</div></div>`;
  } else {
    html = `<div class="empty"><div class="big">Geen goede match</div><p>${buyTip?esc(buyTip):'Probeer het gerecht anders te omschrijven.'}</p></div>`;
  }
  pairOut = html; out.innerHTML = html;
}

      unit:(norm(p.unit)==='glas')?'glas':'fles', flag:p.flag||'', course:p.course||'',
      score:Math.max(1, Math.min(10, Math.round(Number(p.score)||7))),
      reason:p.reason||'', value:p.value||''
    }));
    if(d.readable === false || !picks.length) throw new Error('geen wijnen op de foto herkend');
    S.menuLast = { at:Date.now(), dish, budget:menu.budget||null, glass:!!menu.glass, restaurant:d.restaurant||null,
      courses:(Array.isArray(d.courses)?d.courses:[]).filter(c => typeof c === 'string' && c.trim()).slice(0,12),
      picks, glassAdvice:d.glass_advice||null, skip:d.skip||null, note:d.note||null };
    save();
    menuOut = menuResultHtml(S.menuLast);
  }catch(e){
    menu.err = String(e.message||e).slice(0,140);
    menuOut = `<div class="banner"><span>${ik('waarschuwing')}</span><span><b>De kaart lezen lukte niet</b> (${esc(menu.err)}). Ga wat dichterbij, zorg voor licht, of fotografeer één pagina tegelijk.<br><button class="btn sm ghost mt8" data-act="menuGo">↻ Probeer opnieuw</button></span></div>` + menuGuideHtml(dish, false);
  }
  menu.busy = false;
  const o = document.getElementById('menuOut'); if(o) o.innerHTML = menuOut;
}

      <div class="wname" style="font-size:16px">${esc(p.name)}</div>

      <div class="mprice">${p.price!=null?money(p.price):'—'}<small>per ${esc(p.unit)}</small>
        <span class="mscore" style="font-size:16px">${p.score}<small>/10</small></span></div></div>
    ${smaakHit({grapes:p.grapes||[], region:p.region, type:p.type})?'<div class="mreason" style="color:var(--acc-ink)">'+ik('hart')+' Past bij je smaak</div>':''}
    <div class="mreason">${esc(p.reason)}</div>

      <button class="linkbtn" data-act="menuWish" data-i="${i}">☆ Verlanglijst</button></div></div>`).join('');

ACT.menuPick = el => {

/* zonder AI (of als vangnet): waar je bij dit gerecht op de kaart naar zoekt: de kelderregels omgedraaid */
function menuGuideHtml(dish, primary){
  const cats = foodCats(dish);
  if(!cats.length){
    return primary ? `<div class="banner"><span>🤔</span><span>Dit gerecht kan ik zonder AI niet plaatsen. Omschrijf het wat gewoner ("iets met kip", "witte vis"), of log in, dan leest de sommelier de kaart écht.</span></div>` : '';
  }
  const wsum = {};
  cats.forEach(c => Object.keys(c.w).forEach(k => { wsum[k] = (wsum[k]||0) + c.w[k]; }));
  const styles = Object.keys(wsum).sort((a,b) => wsum[b]-wsum[a]).filter(k => wsum[k] >= 2).slice(0,3)
    .map(k => TYPES[k] ? TYPES[k].l.toLowerCase() : k);
  const grapes = [...new Set(cats.flatMap(c => c.g))].slice(0,6);
  return `<div class="panel"><div class="eyebrow mb8">Kaartgids · kelderregels</div>
    <p style="font-size:14px;margin-bottom:8px">Bij <b>${esc(dish)}</b> zoek je op de kaart naar <b>${esc(styles.join(' of ') || 'rood')}</b>.</p>
    ${grapes.length?`<p style="font-size:14px;margin-bottom:8px">Druiven die hier bijna altijd werken: <b>${esc(grapes.join(' · '))}</b>.</p>`:''}
    <p style="font-size:14px;margin-bottom:8px">Geen idee wat te kiezen? Vraag om ${esc(cats[0].buy)}.</p>
    <p class="small">${esc(cats[0].rW.charAt(0).toUpperCase()+cats[0].rW.slice(1))}.</p></div>`;
}

/* ================= OVERZICHT ================= */
/* Met `act` wordt elke rij een knop die de kelderlijst op die waarde filtert, net als bij de locaties. */
function barRows(pairs, dot, act){
  const mx = Math.max(1, ...pairs.map(p => p[1]));
  return pairs.map(p => {
    /* bij een typeverdeling krijgt de staaf de kleur van het type, net als het bolletje */
    const cls = (dot && TYPES[p[2]]) ? ' ' + TYPES[p[2]].c : '';
    const open = act ? `<button class="brow" style="width:100%" data-act="${act}" data-v="${esc(dot ? p[2] : p[0])}">` : '<div class="brow">';
    return `${open}<span class="l">${dot?dotHtml(p[2]):''}${esc(p[0])}</span>
    <span class="track"><span class="fill${cls}" style="width:${Math.max(4, p[1]/mx*100)}%"></span></span>
    <span class="v tnum">${p[1]}</span>${act ? '</button>' : '</div>'}`;
  }).join('');
}
function viewOverzicht(){
  const bc = bottleCount(), val = cellarValue();
  let totLow = 0, totHigh = 0;
  S.wines.forEach(w => { const q = w.qty||0, b = bronWaarde(w); if(!q || !b) return;
    totLow += q * (Number(w.valueLow) || b*0.8); totHigh += q * (Number(w.valueHigh) || b*1.2); });
  totLow = Math.round(totLow); totHigh = Math.round(totHigh);
  const ready = S.wines.filter(w => w.qty>0 && ['op','nu','rijp'].includes(windowStatus(w).k));
  const readyN = ready.reduce((n,w)=>n+w.qty,0);
  const thisYear = S.history.filter(h => !h.weg && (h.date||'').slice(0,4) == YR()).length;
  const soonAlle = S.wines.filter(w => w.qty>0 && ['nu','rijp','over'].includes(windowStatus(w).k))
    .sort((a,b)=>URG[windowStatus(a).k]-URG[windowStatus(b).k] || (a.drinkTo||9999)-(b.drinkTo||9999));
  const soon = soonAlle.slice(0,5);
  const byType = Object.keys(TYPES).map(t => [TYPES[t].l, S.wines.filter(w=>w.type===t).reduce((n,w)=>n+(w.qty||0),0), t]).filter(p=>p[1]>0);
  const landC = {};
  S.wines.forEach(w => { const c=(w.country||'Onbekend'); landC[c]=(landC[c]||0)+(w.qty||0); });
  const byLand = Object.entries(landC).filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]);
  const jaarC = {};
  S.wines.forEach(w => { const j=w.vintage||'NV'; jaarC[j]=(jaarC[j]||0)+(w.qty||0); });
  const byJaar = Object.entries(jaarC).filter(p=>p[1]>0).sort((a,b)=> (b[0]==='NV')?-1:(a[0]==='NV')?1:b[0]-a[0]);
  const locC = {};
  S.wines.forEach(w => { const l = w.location||'Zonder locatie'; locC[l]=(locC[l]||0)+(w.qty||0); });
  const byLoc = Object.entries(locC).filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]);
  const locMax = Math.max(1, ...byLoc.map(p=>p[1]));
  const recent = S.history.filter(h => !h.weg).slice(0,4);
  if(!S.wines.length && !S.history.length)
    return `${brandRow('')}<div class="eyebrow">Overzicht</div><h2 class="h2">Nog niets te zien</h2>
      <div class="empty"><p>Zodra er flessen in je kelder liggen zie je hier voorraad, waarde, drinkvensters en je historie.</p>
      <button class="btn" data-act="tab" data-tab="scan" style="max-width:240px">Scan je eerste fles</button></div>`;
  return `${brandRow('')}<div class="eyebrow">Overzicht</div><h2 class="h2">${esc(S.settings.cellarName)}</h2>
    ${tonightBanner()}
    <div class="tiles">
      <button class="tile" data-act="tileAll"><div class="k">Flessen</div><div class="n">${bc}</div><div class="s">tik voor de lijst</div></button>
      <div class="tile"><div class="k">Kelderwaarde</div><div class="n">${val?money(val):'—'}</div>${val?`<div class="s tnum">${money(totLow)} – ${money(totHigh)}</div>`:''}${zonderPrijs()?`<div class="s">${zonderPrijs()} ${plur(zonderPrijs(),'fles','flessen')} zonder prijs</div>`:''}</div>
      <button class="tile" data-act="tileDronk"><div class="k">Nu op dronk</div><div class="n" style="color:var(--ok)">${readyN}</div><div class="s">tik voor de lijst</div></button>
      ${thisYear ? `<button class="tile" data-act="tileGedronken"><div class="k">Gedronken in ${YR()}</div><div class="n">${thisYear}</div><div class="s">tik voor de lijst</div></button>` : `<div class="tile"><div class="k">Gedronken in ${YR()}</div><div class="n">0</div></div>`}
    </div>
    ${soon.length?`<div class="sect"><div class="eyebrow mb8">Drink binnenkort</div><div class="panel">${soon.map(w=>{const st=windowStatus(w);
      return `<button class="rowline" style="width:100%;text-align:left" data-act="detail" data-id="${w.id}"><span class="a"><div class="t">${esc(w.name)} ${w.vintage||''}</div><div class="u">×${w.qty}${w.location?' · '+esc(w.location):''}</div></span><span class="z"><span class="badge ${st.cls}">${st.sub||st.label}</span></span></button>`;}).join('')}</div>${soonAlle.length > soon.length ? `<div class="center mt8"><button class="linkbtn" data-act="soonAlle">Alle ${soonAlle.length} in de lijst →</button></div>` : ''}</div>`:''}
    ${byType.length?`<div class="sect"><div class="eyebrow mb8">Per type <span class="small" style="text-transform:none;letter-spacing:0">· tik voor de lijst</span></div><div class="panel">${barRows(byType,true,'filterType')}</div></div>`:''}
    ${byLand.length?`<div class="sect"><div class="eyebrow mb8">Per land</div><div class="panel">${ovStaven('land', byLand, false, 'filterLand')}</div></div>`:''}
    ${byJaar.length?`<div class="sect"><div class="eyebrow mb8">Per jaargang</div><div class="panel">${ovStaven('jaar', byJaar, false, 'filterJaar')}</div></div>`:''}
    ${byLoc.length?`<div class="sect"><div class="eyebrow mb8">Per locatie</div><div class="panel">${byLoc.map(p=>{
      const e = p[0]==='Zonder locatie' ? null : locEntry(p[0]);
      return `<button class="brow" style="width:100%" data-act="filterLoc" data-l="${p[0]==='Zonder locatie'?'::none':esc(p[0])}">
        <span class="l">${(e&&e.photo)?`<img data-photo="${e.id}" style="width:22px;height:22px;border-radius:6px;object-fit:cover;flex:none" alt="">`:''}${esc(p[0])}</span>
        <span class="track"><span class="fill" style="width:${Math.max(4, p[1]/locMax*100)}%"></span></span>
        <span class="v tnum">${p[1]}</span></button>`;
    }).join('')}</div></div>`:''}
    ${recent.length?`<div class="sect"><div class="eyebrow mb8">Onlangs gedronken</div><div class="panel">${recent.map(h=>
      `<div class="rowline"><span class="a"><div class="t">${esc(h.name)} ${h.vintage||''}</div><div class="u">${h.extern?ik('bord')+' ':''}${esc(h.date)}${h.note?' · '+esc(h.note.slice(0,42)):''}</div></span><span class="z starmini">${starsText(h.rating)}</span></div>`).join('')}
      <div class="center mt8"><button class="linkbtn" data-act="goHistory">Bekijk hele historie →</button></div></div></div>`:''}`;

  const flessen = S.wines.filter(w => w.location === name).reduce((n, w) => n + (w.qty||0), 0);
  const zonder = Math.max(0, flessen - bezet.length);
  const types = [...new Set(bezet.map(k => findWine(rek.vakken[k]).type))].filter(t => TYPES[t]);
  const toonSetup = setup || !rek;
  const sh = openSheet(`${sheetHead(esc(name))}
    ${(e && e.photo && rek) ? `<img data-photo="${e.id}" style="width:100%;max-height:140px;object-fit:cover;border-radius:10px;margin-bottom:10px" alt="Foto van ${esc(name)}">` : ''}

      <div class="btnrow">${rek ? `<button class="btn plain" data-act="rekWeg" data-n="${esc(name)}">Vakken weghalen</button>` : `<button class="btn plain" data-act="closeSheet">Annuleer</button>`}

/* ================= CellarMentor op je beginscherm ================= */
/* Chrome en Edge bieden zelf een installatieknop aan; die vangen we op zodat we
   hem op ons eigen moment kunnen tonen. Safari op de iPhone kent dat niet, dus daar
   kan het alleen met de hand, dus daar leggen we het uit in plaats van te knoppen. */
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
addEventListener('appinstalled', () => { installPrompt = null; S.settings.installWeg = true; save(true); render(); });

function isStandalone(){
  return (matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
function isApple(){
  const ua = navigator.userAgent || '';
  return /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && (navigator.maxTouchPoints||0) > 1);
}
/* Welke browser op de iPhone. Sinds iOS 16.4 kunnen ook Chrome, Firefox en Edge een app op het
   beginscherm zetten (de knop zit alleen ergens anders dan in Safari); het venster van een andere
   app (WhatsApp, Instagram, Facebook) kan het nooit. Chrome is CriOS, Firefox FxiOS, Edge EdgiOS;
   een venster in een andere app mist het woord Safari. Brave en DuckDuckGo zien eruit als Safari
   en hebben de knop op dezelfde plek. */
function iosBrowser(){
  const ua = navigator.userAgent || '';
  if(/CriOS/.test(ua)) return 'chrome';
  if(/FxiOS/.test(ua)) return 'firefox';
  if(/EdgiOS/.test(ua)) return 'edge';
  if(!/Safari\//.test(ua)) return 'app';
  return 'safari';
}
/* Meteen aanbieden, niet pas na de eerste fles. Wie hier binnenkomt heeft een link
   van iemand gekregen en hoeft niet overtuigd te worden; sluit hij het tabblad, dan
   is hij weg. En op de iPhone kan een app op het beginscherm een eigen opslag hebben:
   eerst in Safari flessen toevoegen en daarna installeren kan een lege kelder opleveren.

   kelder niet; de banner wijst de weg: inloggen (sync neemt alles mee) of een back-up bewaren. */

/* De stappen per browser. De tekst noemt de plek van de deelknop, want daar liep het op vast:

/* ================= meerdere flessen tegelijk ================= */
/* Wie al een kelder heeft gaat er geen tachtig etiketten voor scannen. Waar zulke
   kelders wél in zitten: een lijst in een spreadsheet of notitie, een papieren
   lijstje naast het rek, of een doos met flessen die rechtop staan. Liggende
   flessen in een rek laten alleen de bodem zien, dus die vragen we niet. */
const IMP_MAX = 4;
let imp = { text:'', shots:[], found:null, busy:false, err:null };
function impReset(){ imp = { text:'', shots:[], found:null, busy:false, err:null }; }

async function aiImport(){
  const prompt = `Je helpt iemand zijn bestaande wijnkelder overnemen in een app. Haal uit de foto's en/of de tekst hieronder alle flessen die je kunt herkennen.
Antwoord UITSLUITEND met geldig JSON, zonder andere tekst:
{"wines":[{"name":"naam van de wijn","producer":"producent of null","vintage":2019 of null,"type":"rood|wit|oranje|rose|mousserend|zoet|versterkt","grapes":["druif",...],"country":"land of null","region":"regio of null","appellation":"appellation of null","qty":1}]}
qty is het aantal flessen als dat uit de lijst of de foto blijkt, anders 1. Staat dezelfde wijn meerdere keren, voeg hem dan samen en tel qty op.
Neem alleen flessen op die je echt leest of ziet. Verzin niets: een veld dat je niet kunt lezen wordt null. Zie je geen enkele fles, antwoord dan met {"wines":[]}.`;
  const content = [];
  for(const sh of imp.shots) content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data: sh.split(',')[1]}});
  const t = (imp.text||'').trim();
  content.push({type:'text', text: prompt + (t ? `\n\nDe tekst:\n${t.slice(0, 6000)}` : '')});
  const out = await callClaude(content, 4000, 'import');
  const d = parseJsonLoose(out);
  return Array.isArray(d.wines) ? d.wines.slice(0, 60).map(schoonAI) : [];
}

function viewImport(){

ACT.impCsv = () => document.getElementById('fCsv').click();
function csvParse(text){
  text = String(text||'').replace(/^﻿/, '');
  const eerste = text.split(/\r?\n/, 1)[0] || '';
  const tel = ch => (eerste.split(ch).length - 1);
  const sep = [['\t', tel('\t')], [';', tel(';')], [',', tel(',')]].sort((a,b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cel = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cel += '"'; i++; } else q = false; } else cel += ch; }
    else if(ch === '"') q = true;
    else if(ch === sep){ row.push(cel); cel = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(cel); rows.push(row); row = []; cel = ''; }
    else cel += ch;
  }
  if(cel !== '' || row.length){ row.push(cel); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
/* veld, label in het koppelscherm, kolomnamen waar we hem aan herkennen (CellarTracker, Vivino, Nederlands) */
const CSV_VELDEN = [
  ['name', 'Naam van de wijn', ['wine','wine name','name','naam','wijn','cuvee','cuvée','label','wijnnaam']],
  ['producer', 'Producent', ['producer','winery','producent','domaine','chateau','château','estate','maker','huis']],

let csvData = null;
function csvKoppel(text){
  const rows = csvParse(text);
  if(rows.length < 2){ toast('Geen tabel gevonden in dit bestand'); return; }
  const kop = rows[0].map(h => String(h).trim());
  const key = x => norm(x).replace(/[^a-z0-9]/g, '');
  const kk = kop.map(key);
  const gekozen = {}, bezet = new Set();
  for(const [veld, , namen] of CSV_VELDEN){
    for(const a of namen){ const i = kk.indexOf(key(a)); if(i >= 0 && !bezet.has(i)){ gekozen[veld] = i; bezet.add(i); break; } }
  }
  csvData = { kop, rows: rows.slice(1) };
  const opties = i => `<option value="">—</option>` + kop.map((h, j) => `<option value="${j}" ${i === j ? 'selected' : ''}>${esc(h || 'kolom ' + (j+1))}</option>`).join('');
  openSheet(`${sheetHead('Kolommen koppelen')}
    <p class="small mb8">${csvData.rows.length} ${plur(csvData.rows.length,'regel','regels')} gevonden. Per veld staat de kolom die er het meest op lijkt; pas aan waar nodig. Alleen de naam is verplicht.</p>
    ${CSV_VELDEN.map(([veld, label]) => `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><label class="small" style="flex:none;width:112px">${label}</label><select class="inp" data-csv="${veld}" style="flex:1;min-width:0">${opties(gekozen[veld])}</select></div>`).join('')}
    <button class="btn mt14" data-act="csvLees">Inlezen</button>`);
}
const CSV_WIT = ['chardonnay','sauvignon','riesling','chenin','pinot gris','pinot grigio','gruner','grüner','viognier','albari','verdejo','semillon','sémillon','gewurz','muscat','moscato','vermentino','grillo','fiano','garganega','trebbiano','muscadet','melon','silvaner','aligot','picpoul','assyrtiko','torront','pinot blanc','pinot bianco','furmint','marsanne','roussanne','godello','verdicchio','cortese','arneis','pecorino','greco'];
ACT.csvLees = el => {
  if(!csvData) return;
  const R = el.closest('.sheet') || document;
  const m = {}; R.querySelectorAll('select[data-csv]').forEach(x => { if(x.value !== '') m[x.dataset.csv] = +x.value; });
  if(m.name == null){ toast('Kies de kolom met de naam van de wijn'); return; }
  const g = (r, v) => m[v] == null ? '' : String(r[m[v]] ?? '').trim();
  const getal = x => { const n = parseFloat(String(x).replace(/[^\d,.-]/g, '').replace(',', '.')); return Number.isFinite(n) ? n : null; };
  const jaar = x => { const n = parseInt(String(x).replace(/\D/g, '').slice(0, 4), 10); return (n >= 1900 && n <= 2100) ? n : null; };
  const samen = new Map();
  for(const r of csvData.rows){
    const name = g(r, 'name').slice(0, 200); if(!name) continue;
    const producer = g(r, 'producer').slice(0, 200), vintage = jaar(g(r, 'vintage'));
    const k = norm(name) + '|' + norm(producer) + '|' + (vintage || 'nv');
    const qty = Math.max(1, Math.min(99, Math.round(getal(g(r, 'qty')) || 1)));
    if(samen.has(k)){ samen.get(k).qty = Math.min(99, samen.get(k).qty + qty); continue; }
    const typeTxt = g(r, 'type'), grapesTxt = g(r, 'grapes');
    const grapes = grapesTxt.split(/[,;\/|]/).map(x => x.trim()).filter(Boolean).slice(0, 8);
    let type = typeTxt ? mapType(typeTxt) : 'rood';
    if(!typeTxt && grapes.length && grapes.every(x => CSV_WIT.some(c => norm(x).includes(c)))) type = 'wit';
    const w = { name, producer, vintage, type, grapes, qty,
      country: g(r, 'country').slice(0, 100), region: g(r, 'region').slice(0, 120), appellation: g(r, 'appellation').slice(0, 160),
      location: g(r, 'location').slice(0, 120), note: g(r, 'note').slice(0, 2000),
      price: getal(g(r, 'price')), value: getal(g(r, 'value')),
      drink_from: jaar(g(r, 'drink_from')), drink_to: jaar(g(r, 'drink_to')) };
    if(w.value != null) w.valueSrc = 'eigen';
    if(w.drink_from && w.drink_to && w.drink_to < w.drink_from){ w.drink_from = null; w.drink_to = null; }
    samen.set(k, w);
    if(samen.size >= 400) break;
  }
  const lijst = [...samen.values()];
  if(!lijst.length){ toast('Geen wijnen gevonden in deze kolommen'); return; }
  const afgekapt = csvData.rows.length > 400 && lijst.length >= 400;
  csvData = null;
  imp.found = lijst.map(w => { const dubbel = matchWine({name:w.name, producer:w.producer, vintage:w.vintage}); return {...w, dubbel: !!dubbel, pick: !dubbel}; });
  closeSheet(true); UI.tab = 'meer'; UI.meerPage = 'import'; render();
  toast(`${lijst.length} ${plur(lijst.length,'wijn','wijnen')} gelezen${afgekapt ? ' (de eerste 400)' : ''}`);
};

      location:(f.location||'').trim(), note:(f.note||'').trim(),
      price: f.price ?? null, value: f.value ?? null,
      drink_from: f.drink_from || null, drink_to: f.drink_to || null,   /* uit een CSV; anders schat ensureWindow */
      drinkSrc: (f.drink_from || f.drink_to) ? 'bestand' : undefined,
      qty: f.qty, pairing:[], photo:false, addedAt:Date.now() };
    if(w.value != null && f.valueSrc === 'eigen'){ w.valueSrc = 'eigen'; w.valueAt = vandaag(); }
    if(w.location) S.settings.lastLocation = w.location;
    ensureWindow(w);
    /* estimateWindow rekent in drinkFrom/drinkTo, ensureWindow in drink_from/to */

    if(w.drink_to != null){ w.drinkTo = w.drink_to; delete w.drink_to; }
    if(!w.drinkSrc && w.drink_src) w.drinkSrc = w.drink_src;
    delete w.drink_src;
    S.wines.unshift(w); n += 1;

  save();

function viewPrivacyNL(){
  return `${brandRow('')}${backRow}<div class="eyebrow">Privacy</div><h2 class="h2">Wat CellarMentor van je bewaart</h2>
  <div class="legal">
    <p>CellarMentor wordt aangeboden door ${aanbieder()}. Vragen of een verzoek over je gegevens? Mail <a href="mailto:${esc(CONTACT_MAIL)}" style="color:var(--acc-ink);font-weight:600">${esc(CONTACT_MAIL)}</a>.</p>

    <h3>Zonder account gaat er niets weg</h3>
    <p>Gebruik je CellarMentor zonder in te loggen, dan staat je hele kelder (flessen, notities, foto's) alleen op dit apparaat, in de opslag van je browser. Er gaat niets naar een server. Wis je de app-gegevens of je browser, dan is het weg; maak dus af en toe een back-up via Instellingen.</p>

    <h3>Met een account</h3>
    <p>Log je in, dan bewaren we bij onze hostingpartij <b>Supabase</b>, op servers in <b>Ierland</b>:</p>
    <ul>
      <li>je e-mailadres en een versleutelde versie van je wachtwoord;</li>
      <li>je kelder: flessen, voorraad, locaties, notities, verlanglijst en drinkhistorie;</li>
      <li>alleen als je dat zelf aanzet in Instellingen: een wekelijkse herinnering per mail over flessen die op dronk komen. Die mail gaat via de maildienst <b>Resend</b>; daarvoor krijgen zij je e-mailadres en van die flessen de naam, producent, jaargang, het aantal en de plek in je kelder, niets anders;</li>
      <li>de foto's die je bij flessen bewaart;</li>
      <li>hoeveel credits je per maand gebruikt. De inhoud van je vragen en antwoorden bewaren we daar niet bij.</li>
    </ul>
    <p>Alleen jij kunt bij je eigen kelder; dat is op databaseniveau afgedwongen.</p>

    <h3>Wat de sommelier te zien krijgt</h3>
    <p>Laat je een etiket of wijnkaart lezen, of vraag je om een pairing, dan gaat die foto of vraag naar <b>Anthropic</b> in de Verenigde Staten, die het antwoord maakt. Anthropic gebruikt wat er via deze weg binnenkomt niet om modellen mee te trainen. CellarMentor bewaart het antwoord in jouw kelder en verder alleen de telling van je verbruik.</p>
    <p>Foto's van een <b>wijnkaart in een restaurant</b> zijn een uitzondering: die blijven in het geheugen van je telefoon zolang je ernaar kijkt en worden nooit opgeslagen, op je apparaat niet en in de cloud niet.</p>

    <h3>Prijzen opzoeken</h3>
    <p>Vraag je om de prijs van een fles precies op te zoeken, dan zoekt de sommelier op internet bij wijnhandels en veilingsites. Daarvoor gaat alleen de naam, de producent en de jaargang van die fles naar Anthropic, dat de zoekopdracht uitvoert; niet wie het vraagt en niet wat er verder in je kelder ligt. Een gevonden prijs bewaren we in een gedeelde prijstabel (naam, jaargang, prijs, bron en datum), zodat de volgende die dezelfde fles scant hem gratis krijgt. De zoekopdracht zelf loopt via de zoekmachine van Brave (alleen naam, producent en jaargang, en de streepjescode als je die hebt gescand), de leesbeurt via Anthropic. Een streepjescode kan ook worden opgezocht bij Open Food Facts (een vrije productdatabase); daar gaat alleen het nummer heen. Zet je in Instellingen aan dat je deelt wat je betaalde, dan bewaren we je aankoopprijs bij naam en jaargang van de wijn, gekoppeld aan je account zodat je hem later kunt laten verwijderen; andere gebruikers zien alleen samengevoegde bedragen van minstens twee mensen, nooit wie wat betaalde. Uitzetten stopt het delen. Wie een prijs opzocht, staat er alleen bij als intern kenmerk, om misbruik te kunnen herleiden; het is voor niemand zichtbaar. Van elke zoekopdracht bewaren we dertig dagen het letterlijke antwoord van het model, zonder gebruikersgegevens, om fouten te kunnen opsporen.</p>

    <h3>Betalen</h3>
    <p>Betalingen lopen via <b>Stripe</b>. Je kaartgegevens gaan rechtstreeks naar Stripe; CellarMentor ziet ze niet en bewaart ze niet. Wat wij wél bewaren is een klantnummer van Stripe en de status van je abonnement, zodat we weten hoeveel tegoed je hebt.</p>

    <p>Je hebt het recht om je gegevens in te zien, te laten corrigeren, te laten verwijderen of mee te nemen. Voor het verwijderen van je hele account, inclusief je inloggegevens: mail me even, dan doe ik het. Ben je het ergens niet mee eens, dan kun je klagen bij de Autoriteit Persoonsgegevens.</p>

    <p class="upd">Laatst bijgewerkt op ${esc(LEGAL_DATUM)}.</p>
  </div>`;

async function saveFile(name, text){
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename:name, data:text}); toast('Back-up opgeslagen'); }
    catch(e){
      if(e && e.code === 'declined') return;
      if(e && e.code === 'rate_limited'){ toast('Er staat nog een download open. Probeer het zo weer'); return; }
      try{ await navigator.clipboard.writeText(text); toast('Downloaden lukte niet. De back-up staat op je klembord'); }
      catch(e2){ toast('Back-up maken lukte niet'); }
    }
    return;
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('Back-up gedownload');
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('Back-up staat op je klembord'); }catch(e2){ toast('Back-up maken lukte niet'); }
  }
}

async function doImport(text){
  let d; try{ d = JSON.parse(text); }catch(e){ toast('Geen geldig back-upbestand'); return; }

  openSheet(`${sheetHead('Back-up inlezen')}
    <p style="font-size:14px;color:var(--ink2)">Gevonden: <b>${d.wines.length}</b> wijnen, ${(d.history||[]).length} historie-regels, ${(d.wishlist||[]).length} wensen${d.photos?`, ${Object.keys(d.photos).length} foto's`:''}.</p>

    <p class="small center mt8">Samenvoegen slaat flessen over die er al staan.</p>`);
  const apply = async (replace) => {
    /* een back-up is een bestand van buiten: eerst normaliseren, dan pas in de kelder */
    const wijnen = schoonLijst(d.wines, schoonWijn), hist = schoonLijst(d.history, schoonHist), wensen = schoonLijst(d.wishlist, schoonWens), locs = schoonLijst(d.locations, schoonLoc);

    else {
      const ln = new Set((S.locations||[]).map(l => l.name));
      locs.forEach(l => { if(!ln.has(l.name)) S.locations.push(l); });
      const have = new Set(S.wines.map(w => w.id));
      wijnen.forEach(w => { if(!have.has(w.id)) S.wines.push(w); });
      const hh = new Set(S.history.map(h => h.id));
      hist.forEach(h => { if(!hh.has(h.id)) S.history.push(h); });
      const ww = new Set(S.wishlist.map(x => x.id));
      wensen.forEach(x => { if(!ww.has(x.id)) S.wishlist.push(x); });
    }

    save(); closeSheet(true); render(); toast('Back-up ingelezen');

}

const tijdslimiet = ms => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(ms) : undefined;

function tokenVerlopen(t){
  if(!t) return true;

  }
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    const e = new Error('HTTP ' + res.status + ' ' + t.slice(0,160)); e.status = res.status; throw e;
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

function applySession(s){
  sbAccess = s.access_token || sbAccess;
  const c = cloud();
  if(s.refresh_token) c.refresh = s.refresh_token;
  if(s.user){
    /* Logt er een ánder account in op dit apparaat, dan is de kelder die hier staat
       van de vorige gebruiker. Die mag niet mee de nieuwe cloud in: dat overschrijft
       de kelder van de nieuwe gebruiker en zet bovendien andermans wijnen in zijn
       account. We bewaren hem als reservekopie en beginnen leeg; de sync haalt
       daarna op wat van dít account is. */
    if(c.uid && s.user.id !== c.uid){
      const ietsHier = S.wines.length || S.history.length || S.wishlist.length || (S.locations||[]).length;
      if(ietsHier) snapshotLocal('caveau_backup_prev', {vanEmail: c.email || ''});
      S.wines = []; S.history = []; S.wishlist = []; S.locations = [];
      S.pairCache = []; S.recipeCache = []; S.tonight = [];
      /* ook de sync-tellers: anders erft het nieuwe account het ijkpunt van het vorige en kan een
         toevallig gelijk revisienummer de cloudkelder van de nieuwe gebruiker stil overschrijven */
      S.rev = 0; S.syncedRev = 0; delete S.syncedTel;
      if(ietsHier) toast('Andere gebruiker: de vorige kelder staat als reservekopie in Instellingen', null, null, 7000);
    }
    c.uid = s.user.id; c.email = s.user.email;
  }
  save(true);
}

/* ---- document-sync (last-write-wins op S.rev) ---- */
function cloudDoc(){ return { rev: S.rev||0, wines: S.wines, history: S.history, wishlist: S.wishlist,
  locations: S.locations||[], pairCache: S.pairCache||[], recipeCache: S.recipeCache||[], tonight: S.tonight||[], cellarName: S.settings.cellarName }; }
function adoptDoc(d){
  const n = schoonDoc(d);
  S.wines = n.wines; S.history = n.history; S.wishlist = n.wishlist; S.locations = n.locations;
  S.pairCache = n.pairCache; S.recipeCache = n.recipeCache; S.tonight = n.tonight;
  if(n.cellarName) S.settings.cellarName = n.cellarName;
  S.rev = n.rev;
  vensterMigratie(); tabelMigratie();
  save(true);
}
async function pushDoc(){
  await sbFetch('/rest/v1/cellars?on_conflict=user_id', {method:'POST',
    headers:{'prefer':'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify([{user_id: cloud().uid, data: cloudDoc(), updated_at: new Date().toISOString()}])});
}
async function pullRev(){
  const rows = await sbFetch('/rest/v1/cellars?select=data->rev&user_id=eq.' + cloud().uid, {method:'GET'});
  return (rows && rows[0]) ? {rev: Number(rows[0].rev)||0} : null;
}
const DOC_MAX = 4000000; /* tekens JSON; localStorage houdt rond 5 MB en er moeten vier kopieën in */
async function pullDoc(){
  const rows = await sbFetch('/rest/v1/cellars?select=data&user_id=eq.' + cloud().uid, {method:'GET'});
  const d = (rows && rows[0] && rows[0].data) || null;
  if(d && JSON.stringify(d).length > DOC_MAX) throw new Error('Het cloud-document is te groot voor dit apparaat');
  return d;
}

/* ---- vangnet: lokale reservekopieën + rem op verdachte krimp ---- */
function snapshotLocal(key, extra){
  try{
    if(!(S.wines.length || S.history.length)) return;
    /* De vorige reservekopie een plek opschuiven. Twee ongelukken achter elkaar
       overschreven anders precies de kopie die je nodig had. */
    if(key === 'caveau_backup_prev'){
      const oud = localStorage.getItem(key);
      if(oud) localStorage.setItem('caveau_backup_prev2', oud);
    }
    localStorage.setItem(key, JSON.stringify({...(extra||{}), at:Date.now(),
      data:{wines:S.wines, history:S.history, wishlist:S.wishlist, locations:S.locations||[], cellarName:S.settings.cellarName}}));   /* caches zijn regenereerbaar en horen niet in een reservekopie */
  }catch(e){}
}
async function applyRemote(remote){
  snapshotLocal('caveau_backup_prev');
  adoptDoc(remote); renderTenzijFormulier(); await pullPhotos();
}
/* een sync of prijsronde op de achtergrond mag een formulier in bewerking niet wissen */
function renderTenzijFormulier(){ if(UI.tab === 'scan' && scan.stage === 'confirm') return; if(sheets.length){ versPrijsvakken(); return; } render(); }
const shrinks = (van, naar) => van >= 5 && naar < Math.max(1, Math.ceil(van * 0.2)); /* >80% zou verdwijnen */
/* Ook een historie of verlanglijst kan in één klap verdwijnen, en die zijn net zo
   min terug te halen als de flessen zelf. Alle drie apart wegen. */
function krimpErgens(hier, daar){
  const tel = d => [ (d.wines||[]).length, (d.history||[]).length, (d.wishlist||[]).length ];
  const a = tel(hier), b = tel(daar);
  return a.some((n, i) => shrinks(n, b[i]));
}

function askShrink(mode, remote, lc, rc){
  lastSyncNote = 'Wacht op jouw keuze, groot verschil tussen versies';
  if(UI.tab === 'meer' && UI.meerPage === 'account') render();
  /* na een keuze: het ijkpunt is de stand die gepusht of overgenomen is, mét de tellingen voor de krimpbewaking */
  const done = async (ijk) => { const c = cloud(); c.lastSync = Date.now();
    S.syncedRev = ijk ? ijk.rev : (S.rev||0); S.syncedTel = ijk ? ijk.tel : [S.wines.length, S.history.length, S.wishlist.length];
    const nogEens = !!ijk && (S.rev||0) !== ijk.rev;
    save(true); lastSyncNote = '';
    toast('Gesynchroniseerd ✓'); if(UI.tab === 'meer' && UI.meerPage === 'account') render(); if(nogEens) syncNow(); };
  const ijkNu = () => ({rev: S.rev||0, tel: [S.wines.length, S.history.length, S.wishlist.length]});
  const tekst = mode === 'adopt'
    ? `De cloudversie bevat <b>${rc}</b> ${plur(rc,'wijn','wijnen')}, terwijl hier <b>${lc}</b> staan. Dat kan kloppen (bijvoorbeeld na "Alles wissen" op een ander apparaat), maar het kan ook een vergissing zijn. Daarom neem ik dit niet stilzwijgend over.`
    : mode === 'push'
    ? `Dit apparaat heeft <b>${lc}</b> ${plur(lc,'wijn','wijnen')}, de cloud <b>${rc}</b>. Doorzetten zou de cloudversie overschrijven.`
    : `Er is op twee plekken iets gewijzigd sinds de laatste keer dat dit apparaat synchroniseerde. Hier staan <b>${lc}</b> ${plur(lc,'wijn','wijnen')}, in de cloud <b>${rc}</b>. Ik kan er maar één bewaren, dus kies jij.`;
  const houd = mode === 'adopt' ? `Behoud mijn ${lc}` : mode === 'push' ? `Cloud (${rc}) overnemen` : `Deze telefoon (${lc}) bewaren`;
  const ga = mode === 'adopt' ? `Cloud (${rc}) overnemen` : mode === 'push' ? `Toch pushen (${lc})` : `Cloud (${rc}) overnemen`;
  openSheet(`${sheetHead('Even opletten')}
    <p style="font-size:14px;color:var(--ink2)">${tekst}</p>
    <div class="btnrow mt14">
      <button class="btn ghost" id="shrinkKeep">${houd}</button>
      <button class="btn danger" id="shrinkGo">${ga}</button>
    </div>
    <p class="small mt8">Wat je ook kiest: je huidige stand wordt eerst als lokale reservekopie bewaard (Instellingen → Reservekopieën).</p>`);
  document.getElementById('shrinkGo').onclick = async () => { closeSheet();
    try{
      let ijk = null;
      if(mode === 'adopt' || mode === 'botsing'){ await applyRemote(remote); }
      else { snapshotLocal('caveau_backup_prev'); ijk = ijkNu(); await pushDoc(); await pushPhotos(); }
      await done(ijk);
    }catch(e){ lastSyncNote = String(e.message||e).slice(0,110); toast('Sync mislukt: ' + lastSyncNote); }
  };
  document.getElementById('shrinkKeep').onclick = async () => { closeSheet();
    try{
      let ijk = null;
      if(mode === 'adopt' || mode === 'botsing'){ snapshotLocal('caveau_backup_prev');
        /* deze stand moet winnen van wat er in de cloud staat */
        S.rev = Math.max(S.rev||0, (remote && remote.rev)||0) + 1; save(true);
        ijk = ijkNu(); await pushDoc(); await pushPhotos(); }
      else {
        /* in de stand 'push' is remote een placeholder met alleen lengtes (_kop); wie dan toch
           de cloud kiest krijgt eerst het echte document, anders adopteert hij lege rijen */
        if(remote && remote._kop) remote = await pullDoc();
        if(!remote) throw new Error('Cloudversie niet gevonden');
        await applyRemote(remote); }
      await done(ijk);
    }catch(e){ lastSyncNote = String(e.message||e).slice(0,110); toast('Sync mislukt: ' + lastSyncNote); }
  };
}

/* De beslissing van de sync, zonder netwerk en zonder scherm, zodat hij te testen is (tests/tests.js).
   Niet kijken welk revisienummer het hoogst is, maar wie er iets veranderde sinds de laatste
   geslaagde sync (syncedRev). Een hoger nummer zegt niets over wie gelijk heeft: een apparaat
   dat niets nieuws heeft kan best het hoogste nummer dragen, en duwde dan zijn oude kopie over
   verse wijzigingen heen. Zonder ijkpunt (allereerste sync op dit apparaat) vergelijken we de
   nummers zoals vroeger. Geeft terug: 'eerste' (cloud leeg: alles omhoog), 'niets', 'push',
   'pull' of 'botsing' (beide kanten gewijzigd: de gebruiker kiest). */
function syncBesluit(localRev, remoteRev, syncedRev, kopBestaat){
  if(!kopBestaat) return 'eerste';
  const eersteKeer = syncedRev == null;
  const lokaal = eersteKeer ? (localRev > remoteRev) : (localRev !== syncedRev);
  const cloud = eersteKeer ? (remoteRev > localRev) : (remoteRev !== syncedRev);
  if(lokaal && cloud) return 'botsing';
  if(cloud) return 'pull';
  if(lokaal) return 'push';
  return 'niets';
}
async function syncNow(interactive){
  if(!loggedIn()) return;
  if(koppelSheetOpen) return;   /* eerst de vraag "kelder koppelen?" beantwoorden */
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true;
  try{
    if(!sbAccess || tokenVerlopen(sbAccess)){ const ok = await sbRefresh(); if(!ok) throw new Error('Sessie verlopen. Log opnieuw in'); }
    /* Eerst alleen het revisienummer (een paar bytes); het hele document (honderden KB)
       pas als er echt iets te vergelijken valt. */
    const kop = await pullRev();
    const localRev = S.rev||0, remoteRev = (kop && kop.rev)||0;
    let besluit = syncBesluit(localRev, remoteRev, S.syncedRev, !!kop);
    /* Het hele document (honderden KB) alleen als er echt iets te vergelijken valt. Bij alleen
       een lokale wijziging volstaat de telling van de vorige sync voor de krimpbewaking; dan
       staat er een placeholder met de juiste lengtes en _kop:true, nooit echte wijnen. */
    let remote = null;
    if(besluit === 'botsing' || besluit === 'pull' || (besluit === 'push' && !S.syncedTel)) remote = await pullDoc();
    else if(besluit === 'push') remote = {rev: remoteRev, wines: new Array(S.syncedTel[0]), history: new Array(S.syncedTel[1]), wishlist: new Array(S.syncedTel[2]), _kop: true};
    if(!remote && besluit !== 'niets') besluit = 'eerste';   /* rij zonder document: dan is dit apparaat de bron */
    /* Is er hier iets opgeslagen terwijl het document werd opgehaald, dan is "pull" niet meer
       veilig (adoptDoc zou die wijziging overschrijven): dan is het een botsing en kiest de gebruiker. */
    if((S.rev||0) !== localRev && (besluit === 'pull' || besluit === 'push')) besluit = 'botsing';
    const lc = S.wines.length, rc = remote ? (remote.wines||[]).length : 0;
    /* Het ijkpunt is de stand die de cloud in krijgt. Wordt er tijdens de upload (foto's kunnen
       seconden duren) nog iets opgeslagen, dan lag het ijkpunt anders vóór op de cloud en haalde de
       volgende sync het oude document terug over die wijziging heen. */
    let ijk = null;
    const pushNu = async () => { ijk = {rev: S.rev||0, tel: [S.wines.length, S.history.length, S.wishlist.length]}; await pushDoc(); await pushPhotos(); };
    if(besluit === 'eerste'){
      await pushNu();
    } else if(besluit === 'botsing'){
      syncBusy = false; askShrink('botsing', remote, lc, rc); return;
    } else if(besluit === 'pull'){
      if(krimpErgens(S, remote)){ syncBusy = false; askShrink('adopt', remote, lc, rc); return; }
      await applyRemote(remote);
    } else if(besluit === 'push'){
      if(krimpErgens(remote, S)){ syncBusy = false; askShrink('push', remote, lc, rc); return; }
      await pushNu();
    }
    const c = cloud(); c.lastSync = Date.now();
    if(ijk){ S.syncedRev = ijk.rev; S.syncedTel = ijk.tel; if((S.rev||0) !== ijk.rev) syncAgain = true; }
    else { S.syncedRev = S.rev||0; S.syncedTel = [S.wines.length, S.history.length, S.wishlist.length]; }
    save(true);
    lastSyncNote = '';
    if(interactive) toast('Gesynchroniseerd ✓');
  }catch(e){
    lastSyncNote = String(e.message||e).slice(0,110);
    if(interactive) toast('Sync mislukt: ' + lastSyncNote, null, null, 6000);
  }
  syncBusy = false;
  if(syncAgain){ syncAgain = false; syncNow(); }
  if(UI.tab === 'meer' && UI.meerPage === 'account') render();
}

/* foto's incrementeel */
/* Foto's die op dit apparaat opnieuw zijn gezet moeten ook opnieuw omhoog; de
   cloud kent ze al onder hetzelfde id en zou anders de oude blijven bewaren. */
let fotoOpnieuw = new Set();
async function pushPhotos(){
  let mislukt = 0;
  try{
    const rows = await sbFetch('/rest/v1/photos?select=id&limit=5000', {method:'GET'});
    const have = new Set((rows||[]).map(r => r.id));
    for(const w of [...S.wines, ...S.wishlist, ...(S.locations||[])]){
      if(!w.photo) continue;
      if(have.has(w.id) && !fotoOpnieuw.has(w.id)) continue;
      try{
        const p = await pGet(w.id);
        if(!p) continue;
        await sbFetch('/rest/v1/photos?on_conflict=user_id,id', {method:'POST',
          headers:{'prefer':'resolution=merge-duplicates,return=minimal'},
          body: JSON.stringify([{user_id: cloud().uid, id: w.id, data: p}])});
        fotoOpnieuw.delete(w.id);
      }catch(e){ mislukt++; }   /* volgende sync probeert het opnieuw */
    }
  }catch(e){ mislukt++; }
  /* Stil laten mislukken betekent dat iemand pas op een nieuw apparaat merkt dat
     zijn etiketten er niet zijn. Liever nu een regel in het accountscherm. */
  if(mislukt) lastSyncNote = mislukt + ' ' + plur(mislukt,'foto','foto\'s') + ' nog niet in de cloud';
  return mislukt;
}
async function pullPhotos(){
  try{
    for(const w of [...S.wines, ...S.wishlist, ...(S.locations||[])]){
      if(w.photo && !(await pGet(w.id))){
        const rows = await sbFetch('/rest/v1/photos?select=data&user_id=eq.' + encodeURIComponent(cloud().uid) + '&id=eq.' + encodeURIComponent(w.id), {method:'GET'});
        const foto = rows && rows[0] && rows[0].data;
        if(typeof foto === 'string' && foto.startsWith('data:image/') && foto.length < 6000000){ await pSet(w.id, foto); fotoOpnieuw.delete(w.id); }   /* net binnengehaald: niet meteen weer omhoog */
      }
    }
    fillPhotos();
  }catch(e){}
}
function cloudDeletePhoto(id){
  if(!loggedIn()) return;
  sbFetch('/rest/v1/photos?user_id=eq.' + encodeURIComponent(cloud().uid) + '&id=eq.' + encodeURIComponent(id), {method:'DELETE', headers:{'prefer':'return=minimal'}}).catch(()=>{});
}
/* "Alles wissen" met sync aan: alle foto's weg en een leeg document met een rev boven alles wat
   de cloud kent, via dezelfde upsert als de gewone sync. Geeft die rev terug, zodat het apparaat
   daarna gelijk loopt. Gooit bij elke fout, dan wist de aanroeper ook lokaal niets. */
async function cloudWis(){
  const uid = cloud().uid;
  if(!uid) throw new Error('geen account bekend');
  await sbFetch('/rest/v1/photos?user_id=eq.' + encodeURIComponent(uid), {method:'DELETE', headers:{'prefer':'return=minimal'}});
  const kop = await pullRev();
  const rev = Math.max(S.rev||0, (kop && kop.rev)||0) + 1;
  await sbFetch('/rest/v1/cellars?on_conflict=user_id', {method:'POST',
    headers:{'prefer':'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify([{user_id: uid, data: {rev, wines:[], history:[], wishlist:[], locations:[], pairCache:[], recipeCache:[], tonight:[], cellarName:'Mijn kelder'}, updated_at: new Date().toISOString()}])});
  fotoOpnieuw.clear();
  return rev;
}

/* ---- AI via de CellarMentor-serverfunctie (Fase 1) ---- */
async function sbAI(content, maxTokens, kind, onText, opts){
  const stream = !!onText && CAN_STREAM;
  let res;
  try{
    res = await fnFetch('ai', {
      method:'POST', signal: tijdslimiet(120000),
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ kind: kind||'ai', max_tokens: maxTokens||2000, stream, messages:[{role:'user', content}], ...(opts && opts.web ? {web:true, wine:opts.wine||null, refresh:!!opts.refresh} : {}) })
    });
  }catch(e){ if(e && e.sessie) throw e; throw new Error('Geen verbinding met de CellarMentor-server. Probeer het zo nog eens'); }
  if(res.ok && stream && res.body && (res.headers.get('content-type')||'').includes('event-stream'))
    return readSSE(res, onText);
  const d = await res.json().catch(() => ({}));
  if(!res.ok){
    const e = new Error(res.status === 402 ? 'Je AI-tegoed voor deze maand is op. Kijk bij Meer → Account'
      : res.status === 429 ? (d.error || 'Even rustig aan, daglimiet bereikt')
      : res.status === 404 ? 'De serverfunctie is nog niet geplaatst (zie instructies)'
      : (d.error || ('Serverfout ' + res.status)));
    e.status = res.status; throw e;
  }
  return (d.content||[]).filter(b => b.type === 'text').map(b => b.text).join('');
}

async function fetchQuota(){
  const el = document.getElementById('aiQuota');
  if(!el || !loggedIn()) return;
  try{
    if(!sbAccess || tokenVerlopen(sbAccess)){ const ok = await sbRefresh(); if(!ok){ el.textContent = 'AI-tegoed: log opnieuw in'; return; } }
    const ms = new Date(); ms.setUTCDate(1); ms.setUTCHours(0,0,0,0);
    /* De mailvoorkeur apart: die kolom bestaat pas na herinnering.sql, en zolang hij ontbreekt
       gaf de ene gecombineerde query 400 en zag niemand zijn tegoed ("nog niet beschikbaar"). */
    const [prof, used, mail] = await Promise.all([
      sbFetch('/rest/v1/profiles?select=plan,bonus_credits,plan_status,plan_renews_at', {method:'GET'}),
      sbFetch('/rest/v1/ai_usage?select=cost_units&created_at=gte.' + encodeURIComponent(ms.toISOString()), {method:'GET'}),
      sbFetch('/rest/v1/profiles?select=mail_herinnering', {method:'GET'}).catch(() => null)
    ]);
    const p = (prof && prof[0]) || {};
    const mh = (mail && mail[0]) ? mail[0].mail_herinnering : null;
    if(mh != null && !!S.settings.mailMij !== !!mh){ S.settings.mailMij = !!mh; save(true); }
    quota = { plan:p.plan || 'free', bonus:p.bonus_credits || 0, status:p.plan_status || null,
      renews:p.plan_renews_at || null,
      used:(used||[]).reduce((n,r) => n + (r.cost_units || 1), 0) };
    quota.limit = quota.plan === 'plus' ? PLUS_CREDITS : FREE_CREDITS + quota.bonus;
    let txt = quota.plan === 'unlimited' ? `AI: onbeperkt · ${quota.used} credits deze maand`
      : quota.plan === 'plus' ? `CellarMentor Plus · ${quota.used} van ${quota.limit} credits deze maand`
      : `Gratis tegoed: ${Math.max(0, quota.limit - quota.used)} van ${quota.limit} credits over deze maand`;
    if(ownKey()) txt += ' · eigen sleutel actief (telt niet mee)';
    el.textContent = txt;
    const box = document.getElementById('planBox');
    if(box) box.innerHTML = planBoxHtml();
  }catch(e){ el.textContent = 'AI-tegoed: nog niet beschikbaar'; }
}

/* ---- links uit de mail: bevestiging van een account en wachtwoordherstel ----
   Supabase stuurt de gebruiker terug naar de app met de sessie in het hash-deel
   (#access_token=…&type=signup|recovery). We halen die eruit, zetten de sessie en
   wissen het adres, zodat de tokens niet in de geschiedenis blijven staan. */
const appAdres = () => location.origin + location.pathname.replace(/index\.html$/, '');
(function(){
  const h = location.hash || '';
  if(!/access_token=|error=/.test(h)) return;
  const p = new URLSearchParams(h.replace(/^#/, ''));
  history.replaceState(null, '', location.pathname + location.search);
  if(p.get('error')){
    const why = (p.get('error_description') || '').replace(/\+/g, ' ');
    setTimeout(() => toast(/expired|invalid/i.test(why) ? 'Deze link is verlopen of al gebruikt. Vraag een nieuwe aan' : 'De link werkte niet: ' + why.slice(0, 80), null, null, 7000), 300);
    return;
  }
  const s = { access_token: p.get('access_token'), refresh_token: p.get('refresh_token') };
  const type = p.get('type') || '';
  if(!s.access_token) return;
  sbFetch('/auth/v1/user', {method:'GET', headers:{authorization:'Bearer ' + s.access_token}}, true).then(u => {
    /* Een geldig token bewijst alleen dat het een Supabase-sessie is, niet dat hij van deze gebruiker is:
       iemand kan zijn eigen tokens in een link zetten en die sturen. Wie hem opent zou dan stil in het
       account van de ander belanden en zijn kelder daarheen syncen. Daarom: een bevestigingslink
       geeft alleen een sessie op het apparaat dat de aanmelding startte (caveau_auth_pending); elders
       is de mail bevestigd en logt de gebruiker in met zijn wachtwoord. Een herstel-link heeft het
       token wél nodig (het wachtwoord is juist kwijt); daar vangt koppelOfSync het op. */
    let pending = ''; try{ pending = String(localStorage.getItem('caveau_auth_pending') || ''); }catch(_){}
    const mail = String((u && u.email) || '').toLowerCase();
    const hierGestart = !!pending && !!mail && pending.toLowerCase() === mail;
    if(type !== 'recovery' && !hierGestart){
      UI.tab = 'meer'; UI.meerPage = 'account'; render();
      setTimeout(() => { const e = document.getElementById('ac_email'); if(e && mail) e.value = mail; }, 0);
      toast(type === 'signup' ? 'Account bevestigd. Log hier in met je e-mailadres en wachtwoord' : 'Log in met je e-mailadres en wachtwoord', null, null, 9000);
      return;
    }
    try{ localStorage.removeItem('caveau_auth_pending'); }catch(_){}
    const hadUid = cloud().uid;
    applySession({...s, user: u});
    if(type === 'recovery'){ openNieuwWachtwoord(hadUid); return; }
    toast(type === 'signup' ? 'Account bevestigd. Welkom!' : 'Ingelogd', null, null, 5000);
    UI.tab = 'meer'; UI.meerPage = 'account'; render();
    koppelOfSync(hadUid);
  }).catch(() => toast('Deze link is verlopen of al gebruikt. Vraag een nieuwe aan', null, null, 7000));
})();

  if(taal() !== 'en' || !s) return s;

  if(!k || !/[A-Za-zÀ-ÿ]/.test(k)) return s;
  let uit = EN[k];
  if(uit == null){
    for(const [re, rep] of EN_RE){ if(re.test(k)){ uit = k.replace(re, rep); break; } }
  }
  if(uit == null || uit === k) return s;
  return s.replace(k, uit);
