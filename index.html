const metBron = w => w.value != null && w.valueSrc !== 'ai';
const bronWaarde = w => metBron(w) ? (Number(w.value) || 0) : (Number(w.price) || 0);
const indicatie = w => (w.valueSrc === 'ai' && w.value != null) ? {v: Number(w.value), low: Number(w.valueLow) || Math.round(Number(w.value) * 0.8), high: Number(w.valueHigh) || Math.round(Number(w.value) * 1.2)} : null;
let _kelderPrijzen = null;   /* memo: leegt in save() */
function kelderPrijzen(){
  return _kelderPrijzen || (_kelderPrijzen = S.wines.map(bronWaarde).filter(v => v > 0).sort((a,b) => a-b));
}
function plekInKelder(w){
  const v = bronWaarde(w); if(!v) return null;
  const ps = kelderPrijzen(); if(ps.length < 6) return null;
  const med = ps[Math.floor(ps.length/2)];
  const boven = ps.filter(p => p > v).length;
  const topN = Math.max(3, Math.ceil(ps.length * 0.1)), hoogN = Math.ceil(ps.length * 0.25);
  const zeker = !!w.valueSrc && w.valueSrc !== 'ai';
  if(boven < topN && v >= med * 1.5) return {k:'top', zeker, max: boven === 0};
  if(boven < hoogN && v >= med * 1.25) return {k:'hoog', zeker, max:false};

}
function plekLabel(p){
  if(p.k === 'top') return p.zeker ? (p.max ? 'Je topfles' : 'Een van je topflessen') : 'Waarschijnlijk een topfles';
  return p.zeker ? 'Een van je duurdere flessen' : 'Waarschijnlijk een van je duurdere flessen';

const hoofd = s => s.charAt(0).toUpperCase() + s.slice(1);
/* Het antwoord op "is dit er een voor vanavond of om te bewaren", in één zin.

function verdict(w){

  if(st.k === 'rijp') return `Op z’n rijpst. Het venster liep in ${t} af, maar deze gaat langer mee: geen paniek, wel niet langer wachten.`;
  if(st.k === 'over') return `Open hem gauw, het venster liep in ${t} af.`;

/* medaille: gevuld bij een prijs met bron, open bij een schatting */
const MEDAL = vol => `<svg class="medal" width="11" height="13" viewBox="0 0 22 26" aria-hidden="true"><path d="M6 1h4l1 8h-4zM16 1h-4l-1 8h4z" fill="currentColor" opacity=".8"/><circle cx="11" cy="17" r="7.2" fill="${vol?'currentColor':'none'}" stroke="currentColor" stroke-width="2"/></svg>`;

/* De prijsagent vindt geregeld alleen een ándere jaargang van dezelfde wijn, en tot nu toe zei de
   app daarover niets meer dan het jaartal. Dat is te weinig. Gemeten in de gedeelde prijstabel op
   16 sep 2026: van de 42 rijen stonden er vier op een andere jaargang dan gevraagd, en de scheefste
   was een zoete Jurançon uit 2006 met de prijs van de 2020, veertien jaar jonger. Zo'n fles is in
   het echt duurder dan de huidige oogst, en de app liet dat stil passeren.
   Wat hier gebeurt, en vooral wat hier niet gebeurt: we rekenen het prijsverschil NIET uit. Daar is
   geen grond voor, want de tabel bevat geen enkele wijn waarvan twee jaargangen een prijs hebben,
   dus elke vermenigvuldiger zou verzonnen zijn. Wat we wel kunnen, is zeggen hoe groot het gat is
   en welke kant het op wijst, met de jaargangtabel erbij als die er iets over te melden heeft. De
   gebruiker kan dat zelf wegen; een verzonnen getal kan hij niet wegen. */
function jaargangKloof(w){
  const gevonden = w.valueBron && Number(w.valueBron.vintage) || 0;
  const eigen = Number(w.vintage) || 0;
  if(!gevonden || !eigen || gevonden === eigen) return '';
  const jaren = Math.abs(eigen - gevonden);
  const ouder = eigen < gevonden;
  let uit = `dit is de prijs van de ${gevonden}, en jouw fles is ${jaren} ${plur(jaren,'jaar','jaar')} ${ouder ? 'ouder' : 'jonger'}`;
  if(typeof jaargangOordeel === 'function'){
    const mijn = jaargangOordeel(w), die = jaargangOordeel({...w, vintage: gevonden});
    if(mijn && die && mijn.woord && die.woord && mijn.niveau !== die.niveau)
      uit += `, uit een ${mijn.niveau > die.niveau ? 'sterker' : 'zwakker'} jaar (${eigen} ${mijn.woord}, ${gevonden} ${die.woord})`;
  }
  return uit;
}
function waardeSub(w){
  const b = bronWaarde(w), ind = indicatie(w);
  if(!b) return ind ? `<div class="small tnum">indicatie ${money(ind.low)} – ${money(ind.high)}</div>` : '';
  const oud = w.vintage && (YR() - w.vintage) >= 8;
  const marge = oud ? 0.3 : 0.2;
  const plat = !(Number(w.valueLow) > 0) || !(Number(w.valueHigh) > 0) || Number(w.valueLow) === Number(w.valueHigh);
  const lo = plat ? Math.round(b * (1 - marge)) : Number(w.valueLow);

  let bron = '';

  } else if(w.valueSrc === 'samen' && w.valueBron) bron = `wat ${w.valueBron.n || 2} CellarMentor-gebruikers betaalden`;

/* Het drinkvenster als streepjesschaal: één streepje per jaar, de jaren binnen het venster
   donker, dit jaar in bordeaux. Geen regenboog. */
function schaalHtml(w){
  const y = YR(), f = w.drinkFrom || null, t = w.drinkTo || null;

  const van = (f || t), tot = (t || f);
  let start = Math.min(van, y) - 2, eind = Math.max(tot, y) + 2;
  if(eind - start > 36){ start = Math.max(start, y - 16); eind = Math.min(eind, start + 36); }
  let h = '';
  for(let j = start; j <= eind; j++) h += `<i class="${j === y ? 'nu' : (j >= van && j <= tot ? 'in' : '')}"></i>`;
  return `<div class="schaal">${h}</div><div class="schaal-as"><span>${start}</span><span>nu · ${y}</span><span>${eind}</span></div>`;
}
/* De waarde als het grootste getal op het scherm, met bron en datum eronder. */
function waardeBlok(w){

  const samen = (w.samen && w.samen.n >= 2 && w.valueSrc !== 'samen') ? `<div class="small">${w.samen.n} CellarMentor-gebruikers betaalden ${money(w.samen.low)} tot ${money(w.samen.high)}</div>` : '';
  /* geen bron: geen groot getal. De schatting van het model staat klein en heet wat hij is. */
  if(!b && prijsBezig.has(w.id)) return `<div class="waarde"><span class="pulse">${ik('zoek')} De sommelier zoekt de prijs bij wijnhandels…</span>${samen}</div>`;
  if(!b) return `<div class="waarde"><span>Nog geen prijs met bron.${ind ? ` Indicatie van de sommelier: ${money(ind.low)} tot ${money(ind.high)}, geen echte prijs.` : ''}</span>${samen}</div>`;
  const oud = w.vintage && (YR() - w.vintage) >= 8;
  /* Een bandbreedte waarvan onder- en bovenkant gelijk zijn, of nul, is geen marktbereik: dat is

     2026 voor 14 van de 42 rijen. Dan liever de eerlijke marge rond het gevonden bedrag. */
  const plat = !(Number(w.valueLow) > 0) || !(Number(w.valueHigh) > 0) || Number(w.valueLow) === Number(w.valueHigh);
  const lo = plat ? Math.round(b * (oud ? 0.7 : 0.8)) : Number(w.valueLow);

  let regel;
  if(w.valueSrc === 'zoek' && w.valueBron){

  } else if(w.valueSrc === 'samen' && w.valueBron) regel = `wat ${w.valueBron.n || 2} CellarMentor-gebruikers betaalden, ${money(lo)} tot ${money(hi)}${dat ? ', ' + dat : ''}`;
  else if(w.value != null) regel = `${w.valueVia === 'aankoop' ? 'aankoopprijs' : 'zelf ingevuld'}${dat ? ', ' + dat : ''}`;
  else regel = 'je aankoopprijs';
  return `<div class="waarde"><b class="tnum">${money(b)}</b><span>${regel}${koop && w.valueVia !== 'aankoop' && w.value != null ? '<br>' + koop : ''}</span>${samen}</div>`;
}

/* ---- streepjescode scannen: los van de etiketscan, alleen als er nog geen prijs met bron is (v83) ----
   Nooit in de scanflow: de code zit op de achterkant en niemand wil bij elke fles omdraaien. */
function eanKnop(w){
  if(metBron(w) || w.ean || IN_SANDBOX || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return '';
  return `<div class="mb8" style="margin-bottom:12px"><button class="linkbtn" data-act="eanScan" data-id="${w.id}">${ik('zoek')} Streepjescode scannen</button><div class="small" style="margin-top:4px">Staat op de achterkant. Een winkel zet dat nummer bij het product, dus dan is de fles precies te vinden.</div></div>`;
}
let barcodeDoel = null, barcodeDet = null, barcodeBezig = false;
ACT.eanScan = el => { barcodeDoel = el.dataset.id; openLiveScan('barcode'); };
async function barcodeTick(v, knop){
  if(barcodeBezig || !v || !v.videoWidth) return; barcodeBezig = true;
  try{
    let code = null;
    if('BarcodeDetector' in window){
      try{ barcodeDet = barcodeDet || new BarcodeDetector({formats:['ean_13','ean_8']}); const r = await barcodeDet.detect(v); const hit = (r || []).find(x => eanGeldig(x.rawValue)); if(hit) code = eanSchoon(hit.rawValue); }catch(e){ /* niet ondersteund of geen code: eigen lezer */ }
    }
    let c = null;
    if(!code){
      /* altijd op volle resolutie: op een verkleind beeld is een streepje anderhalve pixel en dan is er niets te lezen */
      c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
      const ctx = c.getContext('2d', {willReadFrequently:true}); ctx.drawImage(v, 0, 0, c.width, c.height);
      code = eanUitBeeld(ctx, c.width, c.height);
    }
    if(code) eanGevonden(code);
    else if(knop && c) eanViaModel(c);   /* de sluiterknop: de foto naar de sommelier, die leest de cijfers eronder */
    else { const h = document.getElementById('liveHint'); if(h && Date.now() - liveStartAt > 5000) h.textContent = 'Nog niets herkend: dichterbij, of tik op de knop en laat de sommelier de cijfers lezen (1 credit)'; }
  } finally { barcodeBezig = false; }
}
/* Vangnet: de lezer in de app redt het niet (schuin, glans, bewogen), maar de cijfers onder de code staan
   op de foto. Eén credit, Haiku op de server, alleen JSON terug. */
async function eanViaModel(c){
  if(!aiReady()){ toast(hoofd(aiRedenUit()), null, null, 5000); return; }
  const w = findWine(barcodeDoel); closeLiveScan();
  if(!w){ toast('Deze fles ligt niet meer in je kelder'); return; }
  const sc = Math.min(1, 1400 / Math.max(c.width, c.height));
  const k = document.createElement('canvas'); k.width = Math.round(c.width * sc); k.height = Math.round(c.height * sc);
  k.getContext('2d').drawImage(c, 0, 0, k.width, k.height);
  const b64 = k.toDataURL('image/jpeg', 0.85).split(',')[1];
  toast('De sommelier leest de streepjescode…', null, null, 15000);
  try{
    const out = await callClaude([{type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
      {type:'text', text:'Op deze foto staat een streepjescode (EAN-13 of EAN-8) met de cijfers eronder, mogelijk gedraaid. Lees die cijfers letterlijk af. Antwoord alleen met JSON: {"ean":"cijfers"} of {"ean":null} als er geen streepjescode te lezen is.'}], 200, 'ean');
    const d = parseJsonLoose(out), code = eanSchoon(d && d.ean);
    if(code) eanGevonden(code);
    else toast('Geen streepjescode te lezen op deze foto. Probeer het nog eens met de cijfers scherp in beeld', null, null, 6000);
  }catch(e){ toast('Lezen mislukte: ' + String(e.message || e).slice(0, 90), null, null, 6000); }
}
function eanGevonden(code){
  const w = findWine(barcodeDoel); closeLiveScan();
  if(!w){ toast('Deze fles ligt niet meer in je kelder'); return; }
  try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){}
  w.ean = code; save(); renderTenzijFormulier();
  toast(`Streepjescode gelezen: ${code}`, null, null, 3000);
  /* meteen zoeken op het nummer: dat is de exacte identiteit */
  if(aiReady() && !metBron(w)) setTimeout(() => prijsAchteraf(w, true), 600);
}

/* ---- prijstabel: gratis raadplegen, voor nieuwe én oude scans ----
   Dezelfde sleutel als in de Edge Function (producent|naam|jaargang, genormaliseerd). */
function prijsSleutel(w){
  const n = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  const jaar = Number(w.vintage) || 0;
  /* sinds v82 op de zoekidentiteit van de scanner als die er is; oudere flessen houden producent en naam */
  return `${n(w.zoekProducer || w.producer)}|${n(w.zoekNaam || w.name)}|${jaar || 'nv'}`;
}
/* wat er van een fles naar de server gaat om hem te herkennen: naam, producent, jaargang en de zoekidentiteit; geen notities, geen prijzen */
const wijnId = w => ({name:w.name, producer:w.producer, vintage:w.vintage, zoekProducer:w.zoekProducer || undefined, zoekNaam:w.zoekNaam || undefined, ean:eanSchoon(w.ean) || undefined});
/* Mag een prijs uit de gedeelde tabel deze fles overschrijven? Nooit een zelf ingevulde waarde of
   aankoopprijs ('eigen'). Wel een fles zonder bron, een gemeenschapsprijs ('samen', de tabel kent de
   bron), en een eerder opgezochte prijs ('zoek') zodra de tabel een nieuwer datapunt heeft: zo komt een
   verversing door een ander of door de server ook hier aan. Zelfde dag = niets nieuws. */
function tabelPrijsPast(w, p){
  if(!metBron(w) || w.valueSrc === 'samen') return true;
  if(w.valueSrc !== 'zoek') return false;
  const nieuw = String((p && p.at) || '').slice(0, 10), oud = String(w.valueAt || '').slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(nieuw) && (!oud || nieuw > oud);
}
async function prijzenUitTabel(wines){
  if(!wines.length || typeof loggedIn !== 'function' || !loggedIn()) return 0;
  /* de server kijkt naar hoogstens 100 flessen per aanroep; met meer werd de rest stil overgeslagen */
  if(wines.length > 100){ let n = 0; for(let i = 0; i < wines.length; i += 100) n += await prijzenUitTabel(wines.slice(i, i + 100)); return n; }
  let d = {};
  try{
    const res = await fnFetch('ai', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ kind:'prijscache', wines: wines.slice(0, 100).map(wijnId) })
    });
    if(!res.ok) return 0;
    d = await res.json().catch(() => ({}));
  }catch(_){ return 0; }
  const map = new Map((d.prices || []).map(p => [p.key, p]));
  const paid = new Map((d.paid || []).map(p => [p.key, p]));
  let n = 0, gewijzigd = false;
  for(const w of wines){
    const k = prijsSleutel(w), p = map.get(k), b = paid.get(k);
    if(p && tabelPrijsPast(w, p) && pasPrijsToe(w, {...p, cached:true})) n++;
    if(b && getalOk(b.n) >= 2 && getalOk(b.med) > 0){
      w.samen = {n: Math.round(b.n), low: getalOk(b.low), high: getalOk(b.high), med: getalOk(b.med), at: tekstOk(b.at, 40)}; gewijzigd = true;
      /* geen echte prijs? dan geldt wat anderen betaalden, met de spreiding als band; pas vanaf drie
         mensen, bij twee staat het alleen ter info in het detail */
      if(!metBron(w) && b.n >= 3){ w.value = Math.round(b.med); w.valueLow = Math.round(b.low); w.valueHigh = Math.round(b.high); w.valueSrc = 'samen'; w.valueAt = datumOf(b.at); w.valueBron = {name:'CellarMentor-gebruikers', n: Math.round(b.n)}; n++; }
    }
  }
  if(n || gewijzigd){ save(); renderTenzijFormulier(); }
  return n;
}
/* Na een scan: eerst gratis in de tabel kijken. Staat hij er niet in en is de fles
   het waard, dan één tik om precies te zoeken. Nooit ongevraagd credits uitgeven. */
async function prijsNaScan(w){
  try{
    const n = await prijzenUitTabel([w]);
    if(n){ toast(`Prijs uit de CellarMentor-prijstabel: ${money(w.value)}${w.valueBron && w.valueBron.name ? ' · ' + w.valueBron.name : ''}`, null, null, 5000); return; }
  }catch(_){}
  if(!aiReady() || metBron(w)) return;
  /* elke fles een echte prijs: standaard meteen zoeken (1 credit); uit te zetten in Instellingen */
  if(S.settings.prijsAuto === false){
    toast('Geen prijs met bron. Opzoeken bij wijnhandels?', ownKey() ? 'Zoek op' : `Zoek op · ${creditCost('prijs')} credit`, () => prijsAchteraf(w, true), 9000);
    return;
  }

}
/* Gemeenschapsprijzen: wat je betaalde gaat, als je dat aanzet, anoniem naar de gedeelde tabel. */
function deelBetaald(w){

/* Eén keer per dag, bij het openen: alle flessen langs de tabel, behalve die met een eigen waarde.
   Ook flessen met een opgezochte prijs gaan mee: de tabel kan een nieuwer datapunt hebben (iemand

/* ---- zoekagent: echte prijs met bron en datum ---- */
async function aiPrijs(w, diep){
  const wie = `${w.name}${w.producer && w.producer !== w.name ? ', ' + w.producer : ''}, jaargang ${w.vintage || 'NV'}, ${[w.appellation, w.region, w.country].filter(Boolean).join(', ') || 'herkomst onbekend'}`;
  const zoek = [w.producer, w.name, w.vintage].filter(Boolean).join(' ');
  const prompt = `Zoek de actuele marktprijs in euro's van deze wijn: ${wie}.
Zo werk je: zoek eerst met de zoekfunctie op "${zoek} prijs". Levert dat geen prijs op, zoek dan op "${[w.producer, w.name].filter(Boolean).join(' ')} prijs" zonder jaargang. Een prijs die in een zoekresultaat staat telt, je hoeft de pagina niet te openen. Let op de flesmaat: Quarts de Chaume, Sauternes, Tokaji en veel zoete wijnen worden vaak per 50 cl of 37,5 cl verkocht. Zet de maat die je bij de prijs zag in size_seen en reken de prijs om naar 75 cl (50 cl × 1,5; 37,5 cl × 2; magnum ÷ 2), inclusief btw. Zie je geen maat, ga dan uit van 75 cl.
Regels voor het antwoord, in deze volgorde:
1. Vind je een prijs van precies jaargang ${w.vintage || 'NV'}: geef die, confidence "hoog".
2. Vind je alleen andere jaargangen van dezelfde wijn: geef VERPLICHT de prijs van de dichtstbijzijnde jaargang, zet die jaargang in vintage_found en confidence "middel". Dit is geen mislukking, dit is het gewenste antwoord. Nooit value null zolang je van deze wijn een prijs van welke jaargang dan ook hebt gezien.
3. Alleen als je van deze wijn helemaal geen enkele prijs vindt: {"value":null,"note":"reden"}.
Antwoord als allerlaatste met alleen dit JSON-object, zonder tekst ervoor of erna en zonder codeblok:
{"value":42,"low":38,"high":48,"source":"naam van de winkel of site","url":"adres van de pagina waar de prijs staat","vintage_found":2014,"size_seen":"75cl|50cl|37.5cl|magnum|onbekend","confidence":"hoog|middel|laag","note":"één korte zin in het Nederlands over waar de prijs vandaan komt, met de flesmaat als die geen 75 cl was"}${STIJLREGELS}`;
  const out = await callClaude([{type:'text', text:prompt}], 1500, diep ? 'prijsdiep' : 'prijs', null, {web:true, wine:{...wijnId(w), appellation:w.appellation, region:w.region, country:w.country, type:w.type, est:(w.valueSrc === 'ai' && w.value != null) ? w.value : null}, refresh: w.valueSrc === 'zoek'});
  return parsePrijs(out);
}
/* Het model mag om het JSON heen praten of citeren; we nemen het laatste object met "value". */
function parsePrijs(out){
  const m = String(out || '').match(/\{[^{}]*"value"[^{}]*\}/g);
  if(m && m.length){ try{ return JSON.parse(m[m.length - 1]); }catch(e){} }
  return parseJsonLoose(out);
}
function pasPrijsToe(w, r){
  const v = getalOk(r && r.value); if(!(v > 0 && v < 100000)) return false;
  w.value = Math.round(v);
  w.valueLow = getalOk(r.low) != null ? Math.round(getalOk(r.low)) : null;
  w.valueHigh = getalOk(r.high) != null ? Math.round(getalOk(r.high)) : null;
  w.valueSrc = 'zoek'; w.valueAt = datumOf(r.at);   /* uit de tabel: de dag dat er gezocht is; vers gezocht: vandaag */
  w.valueBron = { name: tekstOk(r.source, 80), url: safeUrl(r.url),
    vintage: jaarOk(r.vintage_found), conf: tekstOk(r.confidence, 10) || null, note: tekstOk(r.note, 200), cached: !!r.cached };
  return true;
}
/* Voor welke flessen loont opzoeken: oud, of aan de bovenkant van de kelder. */
const prijsWaardig = w => (w.vintage && YR() - w.vintage >= 8) || !!plekInKelder(w);
/* Welke flessen nu een prijs zoeken op de achtergrond: het detail toont dat, en de knop "Prijs opzoeken"
   staat zolang uit (anders kost dezelfde fles twee credits). */
const prijsBezig = new Set();
/* Een open detailvenster ter plekke bijwerken (v85). Zolang een venster open staat tekent renderTenzijFormulier
   niets, dus na een prijs op de achtergrond bleef daar "Nog geen prijs met bron" staan; de lijst erachter komt
   pas bij het sluiten (renderNaSluiten). Alleen de vakken die van de prijs afhangen, zonder het venster te
   sluiten en zonder stap in de geschiedenis. */
function versPrijsvakken(){
  if(typeof document === 'undefined' || !document.querySelectorAll) return;
  for(const [vak, html] of [['prijsvak', waardeBlok], ['plekvak', plekHtml]]){
    for(const el of document.querySelectorAll(`[data-${vak}]`)){ const w = findWine(el.dataset[vak]); if(w) el.innerHTML = html(w); }
  }
}
async function prijsAchteraf(w, meld, diep){
  if(prijsBezig.has(w.id)) return false;   /* loopt al */
  if(meld) toast(diep ? 'Diep zoeken bij wijnhandels en veilingen…' : 'Prijs zoeken bij wijnhandels…', null, null, 20000);
  prijsBezig.add(w.id); versPrijsvakken();
  try{
    const r = await aiPrijs(w, diep);
    prijsBezig.delete(w.id);
    if(pasPrijsToe(findWine(w.id) || w, r)){ save(); renderTenzijFormulier(); toast(`Prijs opgezocht: ${money(w.value)}${w.valueBron.name ? ' · ' + w.valueBron.name : ''}`, null, null, 5000); return true; }
    /* de zoeklaag vond niets: één tik voor de zware zoekagent, die verder kijkt */
    if(meld && !diep) toast('Geen prijs gevonden bij wijnhandels. Dieper zoeken?', ownKey() ? 'Zoek diep' : `Zoek diep · ${creditCost('prijsdiep')} credits`, () => prijsAchteraf(w, true, true), 9000);
    else if(meld) toast(r && r.note ? 'Geen prijs gevonden: ' + String(r.note).slice(0, 80) : 'Geen prijs gevonden', null, null, 5000);
  }catch(e){ if(meld) toast('Opzoeken mislukte: ' + String(e.message || e).slice(0, 90), null, null, 6000); }
  finally{ prijsBezig.delete(w.id); versPrijsvakken(); }
  return false;
}

ACT.prijsBulk = () => {
  if(!aiReady()){ toast('Log in (Meer → Account) om prijzen op te zoeken'); return; }
  const targets = S.wines.filter(w => (w.qty || 0) > 0 && !metBron(w));
  if(!targets.length){ toast('Elke fles op voorraad heeft al een prijs met bron'); return; }
  const n = targets.length;
  confirmSheet('Prijzen opzoeken?', `Voor <b>${n}</b> ${plur(n, 'fles', 'flessen')} zonder prijs met bron zoekt de sommelier de marktprijs op bij wijnhandels, met bron en datum.${ownKey() ? '' : ` Kost hoogstens ${n} credits; staat een wijn al in de CellarMentor-prijstabel, dan is die gratis.`}`, 'Zoek op', async () => {
    let ok = 0, i = 0;
    toast(`Bezig: 0 van ${n}…`, null, null, 60000);
    try{ ok += await prijzenUitTabel(targets); }catch(_){}
    for(const w of targets.filter(w => w.valueSrc !== 'zoek')){
      i++;
      try{ const r = await aiPrijs(w); const w2 = findWine(w.id); if(w2 && pasPrijsToe(w2, r)) ok++; }catch(e){ if(e && (e.status === 402 || e.status === 429)){ toast(e.message, null, null, 6000); break; } }
      save(true); toast(`Bezig: ${i} van ${n}…`, null, null, 60000);

/* ---- waar het drinkvenster vandaan komt ----
   De eerste vraag van iedereen die de app serieus neemt is "waar haalt hij die drinkbaarheid
   vandaan". Een app die daar geen antwoord op heeft, wordt niet vertrouwd, en terecht: een
   venster is een oordeel, niet een meting. Dus staat er bij elke fles wat het oordeel is, waar
   het op rust en waar het ophoudt. */
const VENSTER_BRON = {
  regels: 'de kelderregels van CellarMentor',
  ai: 'de etiketscan',
  bestand: 'het bestand dat je importeerde',
  eigen: 'jouw eigen invoer',
};
/* Waar het opgeslagen venster vandaan komt. Staat het niet vastgelegd (flessen van vóór deze
   versie), dan is het nog te herkennen: is het precies wat de regels nu zeggen, dan komt het van
   de regels. Anders zeggen we niets, want een gok over de herkomst is erger dan een leeg veld. */
function vensterBron(w){
  if(w.drinkSrc) return w.drinkSrc;
  if(!w.drinkFrom && !w.drinkTo) return null;
  const r = estimateWindow(w);
  return (w.drinkFrom === r.from && w.drinkTo === r.to) ? 'regels' : null;
}
function vensterHtml(w){
  const f = w.drinkFrom || null, t = w.drinkTo || null;
  const o = jaargangOordeel(w);
  if(!f && !t && !o) return '';
  const chips = [];
  if(o && o.woord) chips.push(`<span class="grape">${esc(o.jaar + ' in ' + o.streek)} · ${esc(o.woord)}${o.bron ? '' : '?'}</span>`);
  /* Eén regel, nooit twee. Eerder stonden hier een producentvermelding én een citaat onder elke
     fles die toevallig in een onderzochte streek viel, en dan leest niemand ze meer. Wat blijft is
     het meest specifieke: een criticus die déze maker in dít jaar bij de besten noemt zegt iets
     over de fles in je hand, een zin over de streek zegt iets over duizend flessen. De rest staat
     achter de knop, waar je er om vraagt. */
  const g = genoemdDoor(w), v = vaakGenoemd(w), a = achtergrondVan(w), c = citaatVan(w);
  let regel = '';
  if(g){
    /* "Raadt aan" en niet "bij de beste wijnen van". De lijsten komen uit twee soorten stukken:
       de rubriek "Best Producers" in een jaargangsgids, en proefverslagen met een kop die zelf
       zegt dat het een selectie is. Bij het tweede soort zit ook een thematische keuze ("20
       amphora wines to seek out"), en dan is "de beste wijnen van die jaargang" een bewering die
       de bron niet doet. Dit is in beide gevallen waar. */
    regel = `${esc(g.bron)} raadt <span class="q">${esc(g.naam)}</span> aan bij ${esc(String(g.jaar))} in ${esc(g.streek)}.`;
  }else if(v){
    /* De maker, niet deze fles. Dat de 2015 werd aangeraden zegt niets over de 2018, en die
       redenering maakt de app dan ook niet: er staat hoe vaak en verder niets. */
    regel = `${esc(v.bron)} raadt <span class="q">${esc(v.naam)}</span> aan bij ${esc(String(v.aantal))} andere jaargangen in ${esc(v.streek)}.`;
  }else if(a){
    /* Wat voor plek dit is, gaat voor wat de jaargang deed: het chipje erboven noemt het oordeel
       al, en de grond onder een wijngaard verandert niet per oogst. */
    regel = esc(a.zin);
  }else if(c && c.tekst && !c.rijptaal){
    /* Een zin over rijpheid slaat op de wijn zoals die was toen het stuk verscheen, en dat kan
       jaren geleden zijn. Die staat alleen in het blad erachter, met het jaartal erbij. */
    /* Waar het citaat over gaat hoort erbij te staan. Zonder dat zweeft het: onder een Bardolino
       2018 stond alleen "2019, a promising vintage" met de naam van de uitgever, en dan lijkt het
       over de verkeerde fles te gaan. Het jaar waarin het stuk verscheen staat in het blad
       erachter; twee jaartallen naast elkaar op één regel leest niemand goed. */
    regel = `<span class="q">\u201c${esc(c.tekst)}\u201d</span> \u2014 ${esc(c.uitgever)} over ${esc(c.jaar + ' in ' + c.streek)}`;
  }
  return `${chips.length ? `<div class="grapes" style="margin-bottom:8px">${chips.join('')}</div>` : ''}${
    regel ? `<p class="small" style="margin:-2px 0 10px">${regel}</p>` : ''}
    <div class="small" style="margin:-2px 0 12px"><button type="button" class="linkbtn" data-act="vensterUit" data-id="${w.id}">Waar komt dit venster vandaan?</button></div>`;
}

/* De hele onderbouwing in één sheet: de soort fles en wat die in een kelder haalt, wat de
   jaargang in die streek deed, wat er van jouw eigen gegevens in zit, en waar het ophoudt. */

  openSheet(`${sheetHead('Waar dit venster vandaan komt')}
    <div class="wname" style="font-size:17px">${esc(w.name)}</div>
    <div class="wsub" style="font-size:14px;margin-bottom:10px">${esc([w.producer, w.vintage || 'NV'].filter(Boolean).join(' · '))}</div>
    ${stukken.join('')}
    ${verschil}
    ${(() => { const g = genoemdDoor(w); if(!g) return '';
      return `<div class="eyebrow mb8 mt14">Genoemd door een criticus</div>
      <p class="small">${esc(g.bron)} raadt <span class="q">${esc(g.naam)}</span> aan bij ${esc(String(g.jaar))} in ${esc(g.streek)}${g.geschreven ? `, in een gids uit ${g.geschreven}` : ''}.
        Dat oordeel veroudert niet — een goede maker was dat jaar een goede maker — maar het gaat over de
        producent in dat jaar, niet over deze fles: hoe jouw fles lag telt zwaarder.
        ${g.url ? `<br><a class="linkbtn" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">Lees het stuk bij ${esc(g.bron)}</a>` : ''}</p>`; })()}
    ${(() => { const c = citaatVan(w); if(!c) return '';
      return `<div class="eyebrow mb8 mt14">Wat een bron erover schrijft</div>
      <p class="small">${c.tekst ? `\u201c${esc(c.tekst)}\u201d<br><span class="muted">${esc(c.uitgever)} over ${esc(c.jaar + ' in ' + c.streek)}${c.geschreven ? ', geschreven in ' + c.geschreven : ''}</span>`
        : `${esc(c.uitgever)} beoordeelde ${esc(c.jaar + ' in ' + c.streek)}${c.geschreven ? ' in ' + c.geschreven : ''}. Die uitgever wil niet geciteerd worden, dus staat hier de vindplaats en niet de zin.`}
        ${c.rijptaal && c.geschreven ? `<br><span class="muted">Die zin gaat over rijpheid, en is geschreven toen deze jaargang ${c.geschreven - c.jaar} jaar oud was. Nu is dat ${YR() - c.jaar}; reken er dus ${YR() - c.geschreven} jaar bij.</span>` : ''}
        <br><a class="linkbtn" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">Lees het bij ${esc(c.uitgever)}</a></p>`; })()}
    ${(() => { const v = vaakGenoemd(w); if(!v) return '';
      const lijst = v.jaren.length > 8 ? v.jaren.slice(-8).join(', ') + ' en eerder' : v.jaren.join(', ');
      return `<div class="eyebrow mb8 mt14">De maker, niet deze fles</div>
      <p class="small">${esc(v.bron)} raadt <span class="q">${esc(v.naam)}</span> aan bij ${esc(String(v.aantal))} andere jaargangen in ${esc(v.streek)}: ${esc(lijst)}.
        Over ${esc(String(w.vintage || ''))} staat er niets, en dat is geen oordeel \u2014 het betekent alleen dat we het

        niets over deze fles.
        ${v.url ? `<br><a class="linkbtn" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">Lees een van die stukken bij ${esc(v.bron)}</a>` : ''}</p>`; })()}
    ${(() => { const a = achtergrondVan(w); if(!a) return '';
      return `<div class="eyebrow mb8 mt14">Over deze plek</div><p class="small">${esc(a.zin)}</p>`; })()}
    <div class="eyebrow mb8 mt14">Hoe we dit weten</div>
    <p class="small">De kelderregels van CellarMentor rekenen zo: per soort fles een rijpingsduur, vermenigvuldigd met wat de jaargang in die streek deed. Beide staan open in de app en veranderen niet achter je rug om. Er worden geen punten van critici gebruikt: die hangen aan één fles, zijn eigendom van de uitgever, en een taalmodel verzint ze overtuigend. Een jaargang wél: dat is openbare, breed gedragen kennis.</p>
    <p class="small">Een vraagteken achter het jaargangwoord betekent dat dat jaar in die streek nog niet is nagetrokken: het is dan onze eigen schatting. Zonder vraagteken is het jaar tegen minstens twee onafhankelijke gepubliceerde bronnen gelegd, met de vindplaats erbij in JAARGANGEN.md in de broncode. Die twee door elkaar halen zou de app zelfverzekerder laten klinken dan hij is.</p>
    <p class="small">Waar het ophoudt: het oordeel geldt per streek, niet per producent. Een goede maker haalt in een moeilijk jaar meer dan een slordige in een groot jaar, en hoe jouw fles lag weegt zwaarder dan allebei. Een koele, donkere, rustige plek verlengt alles; een keukenkast bij de oven halveert het. Corrigeer daarom gerust met de hand: zet je het venster zelf, dan laat de app het staan.</p>
    <div class="btnrow mt14"><button class="btn ghost" data-act="wineEdit" data-id="${w.id}">Venster zelf zetten</button>
      <button class="btn soft" data-act="detail" data-id="${w.id}">Terug naar de fles</button></div>`);
};
function timelineHtml(w){
  const f = w.drinkFrom, t = w.drinkTo;
  if(!f && !t) return '';
  const y = YR(), lo = Math.min(f||y, y) - 1, hi = Math.max(t||y, y) + 1, span = Math.max(1, hi-lo);
  const L = v => Math.min(100, Math.max(0, (v-lo)/span*100)).toFixed(1);
  /* valt "nu" samen met het begin of einde van het venster, dan één label i.p.v. twee
     die over elkaar heen vallen; ligt het er vlak naast, dan wint de jaargrens */
  let labs = [];
  if(f) labs.push([f, f === y ? `nu · ${f}` : String(f), f === y ? 'now' : '']);
  if(t && t !== f) labs.push([t, t === y ? `nu · ${t}` : String(t), t === y ? 'now' : '']);
  if(y !== f && y !== t){
    const near = labs.some(l => Math.abs(Number(L(l[0])) - Number(L(y))) < 7);
    if(!near) labs.push([y, `nu · ${y}`, 'now']);
  }
  labs.sort((a,b) => a[0] - b[0]);
  /* elk label staat onder zijn eigen punt; aan de randen schuift het naar binnen */
  const place = v => { const x = Number(L(v));
    return `left:${x}%;transform:translateX(${x < 12 ? '0' : x > 88 ? '-100%' : '-50%'})`; };
  return `<div class="tl" role="img" aria-label="Drinkvenster ${f||'?'} tot ${t||'?'}"><div class="tl-track">
    ${(f&&t)?`<div class="tl-fill" style="left:${L(f)}%;right:${(100-Number(L(t))).toFixed(1)}%"></div>`:''}
    <div class="tl-now" style="left:${L(y)}%"></div></div>

   opruim: vanuit Opruimen, dan verlaat de wijn na het vastleggen ook de kelder.

let drinkAchteraf = false, drinkOpruim = false, drinkNa = null;
/* Foto pas weg als de ongedaan-knop van de toast voorbij is; een wijn die terugkomt houdt zo zijn etiket.

ACT.drinkOpen = el => openDrink(el.dataset.id);
/* Een fles kan de kelder ook anders verlaten dan door het glas: weggegeven, verkocht,
   gebroken of een kurk. De regel blijft in de historie staan, met de reden erbij; alleen

const WEG = { cadeau:{l:'Weggegeven', i:ik('cadeau')}, verkocht:{l:'Verkocht', i:ik('euro')}, kapot:{l:'Gebroken of kurk', i:ik('gebroken')} };

    const l = document.getElementById('drNoteLbl'); if(l) l.textContent = weg ? 'Notitie (optioneel)' : 'Proefnotitie (optioneel)';

}

function openDrink(id, opts){
  const w = findWine(id); if(!w) return;

    <div class="small">${drinkOpruim ? 'Deze fles was al weg. Hij krijgt alsnog een regel in je historie en gaat daarna uit je kelder' : drinkAchteraf ? `Voorraad blijft ×${w.qty||0}; deze fles was al weg en krijgt alsnog een regel in je historie` : `Voorraad gaat van ${w.qty} naar ${Math.max(0,(w.qty||0)-1)}`}</div>
    <div class="seg" id="drWeg" style="margin:10px 0 6px">${[['','Gedronken'],['cadeau','Cadeau'],['verkocht','Verkocht'],['kapot','Kapot']].map(([v,l]) =>

    <div class="small center" id="starLbl" style="margin:-2px 0 10px">Tik een ster (nogmaals dezelfde = 0 sterren)</div>
    <div class="field"><label>Datum${drinkAchteraf ? ' (wanneer was het, ongeveer?)' : ''}</label><input type="date" class="inp" id="drDate" value="${today}"></div>

    <button class="btn" data-act="drinkSave" data-id="${w.id}" id="drBtn">Proost, leg vast</button>`);
  wireStars(); wireWeg();
}
function wireStars(){
  const paint = () => {
    document.querySelectorAll('#drinkStars button').forEach(x => {
      const n = Number(x.dataset.star);
      x.classList.toggle('on', drinkRating != null && drinkRating >= n);
      x.classList.toggle('half', drinkRating != null && drinkRating === n - 0.5);
    });
    const l = document.getElementById('starLbl');
    if(l) l.textContent = drinkRating == null ? 'Tik een ster. Linkerhelft is een halve ster, nogmaals dezelfde maakt er nul van'
      : drinkRating === 0 ? '0 van 5, die was niks' : `${String(drinkRating).replace('.',',')} van 5`;
  };
  document.querySelectorAll('#drinkStars button').forEach(b => b.onclick = ev => {
    const n = Number(b.dataset.star);
    const rect = b.getBoundingClientRect();
    const half = ev.clientX && (ev.clientX - rect.left) < rect.width / 2;
    const v = half ? n - 0.5 : n;
    drinkRating = (drinkRating === v) ? 0 : v;
    paint();
  });
}


/* ---- al geproefd bij het toevoegen ----

/* lezen vóór het venster sluit; schrijven zodra de wijn een id heeft */

function proefSchrijf(w, pr){

    <div class="small center" id="starLbl" style="margin:-2px 0 10px">Tik een ster (nogmaals dezelfde = 0 sterren)</div>

ACT.drinkExternSave = async el => {
  const g = id => (document.getElementById(id)||{}).value || '';
  const name = g('dx_name').trim();
  if(!name){ toast('Geef de wijn een naam'); return; }
  const vint = parseInt(g('dx_vint'),10);
  const entry = { id:uid(), wineId:null, extern:true, place:g('dx_place').trim(),
    date:g('drDate') || new Date().toISOString().slice(0,10),
    name, producer:g('dx_prod').trim(), vintage:(vint>=1900&&vint<=2100)?vint:null,
    type:el.dataset.type||'rood', rating:drinkRating, note:g('drNote').trim() };
  S.history.unshift(entry);
  if((document.getElementById('dx_wish')||{}).checked){
    const it = { id:uid(), name, producer:entry.producer, vintage:entry.vintage, type:entry.type,
      price:null, note:['Geproefd', entry.place].filter(Boolean).join(', '), photo:!!drinkExternThumb, addedAt:Date.now() };
    S.wishlist.unshift(it);
    if(drinkExternThumb) await pSet(it.id, drinkExternThumb);
  }
  save(); drinkExternThumb = null;
  if(scan.stage === 'confirm') scanReset();
  closeSheet(true); render();
  toast('Proefnotitie vastgelegd. Santé!');
};
ACT.drinkSave = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  const wegEl = document.querySelector('#drWeg button.on');
  const weg = (wegEl && WEG[wegEl.dataset.val]) ? wegEl.dataset.val : null;
  const entry = { id:uid(), wineId:w.id, date:(document.getElementById('drDate')||{}).value || new Date().toISOString().slice(0,10),
    name:w.name, producer:w.producer||'', vintage:w.vintage||null, type:w.type, grapes:(w.grapes||[]).slice(0,4), region:w.region||'',
    rating: weg ? null : drinkRating, note:((document.getElementById('drNote')||{}).value||'').trim() };
  if(weg) entry.weg = weg;
  if(drinkAchteraf){
    /* de fles was al weg: alleen de historie verandert; vanuit Opruimen verlaat de wijn ook de kelder */
    const na = drinkNa, opruim = drinkOpruim; drinkAchteraf = false; drinkOpruim = false; drinkNa = null;
    S.history.unshift(entry);
    if(opruim){ S.wines = S.wines.filter(x => x.id !== w.id); rekVrij(w.id, Infinity); S.tonight = (S.tonight||[]).filter(t => t.wineId !== w.id); fotoWegLater(w.id); }
    save();
    if(na){ closeSheet(); render(); na(); } else { closeSheet(true); render(); }
    toast(weg ? `${WEG[weg].l}, achteraf vastgelegd` : 'Achteraf genoteerd. Santé!', 'Ongedaan', () => {
      S.history = S.history.filter(h => h.id !== entry.id);
      if(opruim && !findWine(w.id)) S.wines.unshift(w);
      save(); render(); if(na && opruimOpen()) na(); });
    if(!weg) smaakWink();
    return;
  }
  const prevQty = w.qty||0;
  w.qty = Math.max(0, prevQty - 1);
  const vakWeg = rekBijQty(w);
  S.tonight = (S.tonight||[]).filter(t => t.wineId !== w.id);
  S.history.unshift(entry); save(); closeSheet(true); render();
  toast(weg ? `${WEG[weg].l}, afgeboekt` : 'Genoteerd. Santé!', 'Ongedaan', () => { const w2 = findWine(w.id); if(w2) w2.qty = prevQty; rekHerstel(vakWeg, w.id); S.history = S.history.filter(h => h.id !== entry.id); save(); render(); });
  if(!weg) smaakWink();
};

  ${opts.rek ? `<div id="rekKies">${rekKiesHtml(w.location)}</div>` : ''}
  <div class="field"><label>Notitie</label><textarea class="inp" id="f_note" placeholder="karakter, advies, herinnering…">${esc(w.note||'')}</textarea></div>`;

/* locatie-register: namen komen uit wijnen; register bewaart optionele foto per locatie */
function locEntry(name, createIfMissing){
  if(!S.locations) S.locations = [];
  let e = S.locations.find(l => l.name === name);
  if(!e && createIfMissing){ e = {id:uid(), name, photo:false}; S.locations.push(e); }
  return e || null;
}
function allLocations(){
  const set = new Set((S.locations||[]).map(l => l.name));
  S.wines.forEach(w => { if(w.location) set.add(w.location); });
  return [...set].sort((a,b) => a.localeCompare(b,'nl'));
}
function locOptions(){
  const set = new Set([...(S.locations||[]).map(l => l.name), ...S.wines.map(w => w.location).filter(Boolean)]);
  ['Vintec, zone boven','Vintec, zone onder','Wijnrek','Kelder','Doos'].forEach(d => set.add(d));
  return [...set];
}
function locSelectOptions(sel){
  return `<option value=""${!sel?' selected':''}>geen locatie</option>` +
    locOptions().map(l => `<option value="${esc(l)}"${l===sel?' selected':''}>${esc(l)}</option>`).join('') +
    `<option value="::nieuw">+ Nieuwe plek…</option>`;
}

/* ---- rek met vakjes: een locatie kan rijen × kolommen hebben, elk vak houdt hoogstens één fles.
   Het rek bezit de kaart (rek.vakken = {"B3": wineId}); de wijn zelf weet er niets van. ---- */
const VAK_KLEUR = {rood:'--t-rood', wit:'--t-wit', rose:'--t-rose', mousserend:'--t-mous', zoet:'--t-zoet', versterkt:'--t-vers'};
function rekVan(name){ const e = name ? locEntry(name) : null; return (e && e.rek && e.rek.rijen > 0 && e.rek.kolommen > 0) ? e.rek : null; }
const vakNaam = (r, c) => String.fromCharCode(65 + r) + (c + 1);
const vakSort = (a, b) => a[0] === b[0] ? parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10) : (a < b ? -1 : 1);
function rekVakken(name, wineId){ const rek = rekVan(name); if(!rek || !rek.vakken) return []; return Object.keys(rek.vakken).filter(k => rek.vakken[k] === wineId).sort(vakSort); }
/* alle vakken van een wijn, in welk rek ook (na een verhuizing kan er iets achterblijven) */
function vakkenVan(wineId){
  const uit = [];
  (S.locations||[]).forEach(e => { const rek = rekVan(e.name); if(rek && rek.vakken) Object.keys(rek.vakken).forEach(k => { if(rek.vakken[k] === wineId) uit.push({loc:e.name, key:k}); }); });
  return uit;
}
function rekVoegToe(name, wineId, keys){ const rek = rekVan(name); if(!rek) return; rek.vakken = rek.vakken || {}; keys.forEach(k => { if(vakGeldig(rek, k) && !rek.vakken[k]) rek.vakken[k] = wineId; }); }
/* vervangt de vakken van deze wijn in dit rek */
function rekZet(name, wineId, keys){ const rek = rekVan(name); if(!rek) return; rek.vakken = rek.vakken || {}; Object.keys(rek.vakken).forEach(k => { if(rek.vakken[k] === wineId) delete rek.vakken[k]; }); rekVoegToe(name, wineId, keys); }
/* haalt n vakken van een wijn weg (de laatste eerst); geeft terug wat er vrijkwam, voor "ongedaan" */
function rekVrij(wineId, n){
  const alle = vakkenVan(wineId).sort((a, b) => a.loc === b.loc ? vakSort(a.key, b.key) : a.loc.localeCompare(b.loc, 'nl'));
  const weg = alle.slice(Math.max(0, alle.length - n));
  weg.forEach(v => { const rek = rekVan(v.loc); if(rek && rek.vakken) delete rek.vakken[v.key]; });
  return weg;
}
function rekHerstel(weg, wineId){ weg.forEach(v => rekVoegToe(v.loc, wineId, [v.key])); }
/* meer vakken dan flessen (na afboeken) → de overtollige vrijgeven */
function rekBijQty(w){ const teveel = vakkenVan(w.id).length - (w.qty||0); return teveel > 0 ? rekVrij(w.id, teveel) : []; }
function rekVrijeVakken(name, behalve){
  const rek = rekVan(name); if(!rek) return [];
  const uit = [];
  for(let r = 0; r < rek.rijen; r++) for(let c = 0; c < rek.kolommen; c++){ const k = vakNaam(r, c); const id = (rek.vakken||{})[k]; if((!id || !findWine(id)) && !(behalve && behalve.has(k))) uit.push(k); }
  return uit;
}
const vakKort = (keys, max=4) => keys.length <= max ? keys.join(', ') : keys.slice(0, max).join(', ') + ` +${keys.length - max}`;

/* het raster; mode 'kies' (in een formulier) of 'bekijk' (het rekvenster, tik op een fles opent het detail) */
function rekGridHtml(name, mode, wineId, gekozen){
  const rek = rekVan(name); if(!rek) return '';
  const vakken = rek.vakken || {};
  let h = `<div class="rekwrap"><div class="rek ${mode}" style="grid-template-columns:26px repeat(${rek.kolommen}, minmax(22px, 30px))" role="grid" aria-label="Rek ${esc(name)}"><span class="rl"></span>`;
  for(let c = 0; c < rek.kolommen; c++) h += `<span class="rl">${c + 1}</span>`;
  for(let r = 0; r < rek.rijen; r++){
    h += `<span class="rl">${String.fromCharCode(65 + r)}</span>`;
    for(let c = 0; c < rek.kolommen; c++){
      const k = vakNaam(r, c), id = vakken[k], w = id ? findWine(id) : null;
      const ander = w && id !== wineId;
      const mijn = mode === 'kies' ? !!(gekozen && gekozen.has(k)) : !!(w && wineId && id === wineId);
      const vol = mode === 'kies' ? (mijn || ander) : !!w;
      const kleur = !vol ? '' : (mode === 'kies' && mijn) ? 'background:var(--acc)' : `background:var(${VAK_KLEUR[w.type] || '--t-rood'})`;
      const lbl = w ? `${w.name} ${w.vintage||''}`.trim() + ` in ${k}` : `vak ${k}`;
      const cls = `vak${vol?' vol':''}${mijn?' mijn':''}`;
      h += mode === 'kies'
        ? `<button type="button" class="${cls}" data-act="vakTik" data-k="${k}" ${ander ? 'disabled' : ''} style="${kleur}" title="${esc(lbl)}" aria-label="${esc(lbl)}${mijn?', gekozen':''}" aria-pressed="${mijn}"></button>`
        : `<button type="button" class="${cls}" ${w ? `data-act="detail" data-id="${w.id}"` : 'disabled'} style="${kleur}" title="${esc(lbl)}" aria-label="${esc(lbl)}"></button>`;
    }
  }
  return h + `</div></div>`;
}

/* keuze in het formulier: formVakken zijn de gekozen vakken, formVakLoc het rek waar ze bij horen,
   formVakWine de wijn die bewerkt wordt (null bij nieuw of scan) */
let formVakken = new Set(), formVakLoc = '', formVakWine = null;
function formVakReset(w){ formVakWine = w || null; formVakLoc = ''; formVakken = new Set(); }
const rekQtyNu = () => formVakWine ? (formVakWine.qty||0) : formQty;
function rekKiesHtml(name){
  name = (name||'').trim();
  if(!rekVan(name)) return '';
  if(formVakLoc !== name){ formVakLoc = name; formVakken = new Set(formVakWine ? rekVakken(name, formVakWine.id) : []); }
  const n = formVakken.size, qty = rekQtyNu(), vrij = rekVrijeVakken(name, formVakken).length;
  return `<div class="field" style="margin-top:-4px"><label>Vak in ${esc(name)}</label>
    ${rekGridHtml(name, 'kies', formVakWine ? formVakWine.id : null, formVakken)}
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px">
      <span class="small tnum">Vak voor ${n} van ${qty} ${plur(qty,'fles','flessen')}</span>
      <button type="button" class="chip" data-act="vakVolgende" ${vrij ? '' : 'disabled'}>Volgende vrije vak</button></div></div>`;
}
function rekRefresh(){
  const box = document.getElementById('rekKies'); if(!box) return;
  const f = document.getElementById('f_loc');
  box.innerHTML = rekKiesHtml(f ? f.value : '');
}
function vakErbij(k){
  const qty = rekQtyNu();
  if(formVakken.size >= qty){
    if(formVakWine){ toast(`Alle ${qty} ${plur(qty,'fles heeft','flessen hebben')} al een vak`); return false; }
    formQty = formVakken.size + 1; syncQty();
  }
  formVakken.add(k); return true;
}
ACT.vakTik = el => { const k = el.dataset.k; if(formVakken.has(k)) formVakken.delete(k); else vakErbij(k); rekRefresh(); };
ACT.vakVolgende = () => { const vrij = rekVrijeVakken(formVakLoc, formVakken); if(!vrij.length) return; vakErbij(vrij[0]); rekRefresh(); };
/* na het bewaren: de gekozen vakken in het rek zetten (alleen als de keuze bij de uiteindelijke locatie hoort) */
function rekNaBewaren(w, oudeLoc){
  if(oudeLoc && oudeLoc !== w.location) rekZet(oudeLoc, w.id, []);
  if(rekVan(w.location) && formVakLoc === w.location) rekZet(w.location, w.id, [...formVakken]);
}
function wireSeg(id, root){
  const seg = (root || document).querySelector('#' + id); if(!seg) return;
  seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    seg.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    if(id === 'f_type') scanTouched.add('f_type'); });
}
function readForm(root){
  const R = root || document;
  const g = v => (R.querySelector('#' + v)||{}).value || '';
  const num = v => { const x = parseFloat(String(g(v)).replace(',','.')); return isNaN(x) ? null : x; };
  const yr  = v => { const x = parseInt(g(v),10); return (x>=1900 && x<=2100) ? x : null; };
  const segEl = R.querySelector('#f_type button.on');
  return {
    name:g('f_name').trim(), producer:g('f_producer').trim(), vintage:yr('f_vintage'),
    type:segEl ? segEl.dataset.val : '',
    grapes:g('f_grapes').split(',').map(s=>s.trim()).filter(Boolean),
    country:g('f_country').trim(), region:g('f_region').trim(), appellation:g('f_app').trim(),
    drinkFrom:yr('f_from'), drinkTo:yr('f_to'),
    price:num('f_price'), value:num('f_value'),
    location:g('f_loc').trim(), note:g('f_note').trim(), score:g('f_score').trim()
  };
}

let formQty = 1;
let recalcPairing = null;
let recalcValueRange = null;
let vensterAuto = true; /* venster is (nog) een schatting → mag automatisch herberekend worden */

/* ---- "Op tafel": fles gekozen om vanavond te drinken, nog niet afgestreept ---- */
/* Schenkadvies uit vaste sommelierregels: temperatuur, glas en karafferen.
   Kost geen tegoed en werkt offline; de AI is er voor de rest ("Vraag"). */
function serveAdvice(w){
  const g = (w.grapes||[]).map(norm).join(' ') + ' ' + norm(w.name) + ' ' + norm(w.appellation||'') + ' ' + norm(w.region||'');
  const has = list => list.some(x => g.includes(x));
  const age = w.vintage ? YR() - w.vintage : null;
  const st = windowStatus(w);
  let temp = '14–16 °C', glass = 'een tulpvormig wijnglas', tips = [];

  if(w.type === 'mousserend'){
    temp = (age !== null && age > 8) ? '8–10 °C' : '6–8 °C';
    glass = 'een fluit, of liever een smal tulpglas, want daar komt meer geur uit';
    tips.push(age !== null && age > 8
      ? 'Een gerijpte bubbel wil niet ijskoud; te koud smoort de complexiteit.'
      : 'Drie uur in de koelkast koelt beter en rustiger dan een kwartier in de vriezer.');
  } else if(w.type === 'wit'){
    const rijk = has(['chardonnay','semillon','viognier','marsanne','roussanne','gruner']) || (age !== null && age > 5);
    temp = rijk ? '10–12 °C' : '8–10 °C';
    glass = rijk ? 'een ruimer wijnglas' : 'een tulpvormig wijnglas';
    tips.push('Recht uit de koelkast is meestal te koud. Zet hem twintig minuten van tevoren op tafel.');
  } else if(w.type === 'oranje'){
    temp = '12–14 °C'; glass = 'een ruimer wijnglas';
    tips.push('Oranje wijn heeft tannine als een lichte rode: niet ijskoud, en hij houdt van lucht. Een karaf doet hem goed.');
  } else if(w.type === 'rose'){
    temp = '8–10 °C';
  } else if(w.type === 'zoet'){
    temp = '6–8 °C'; glass = 'een klein glas';
    tips.push('Schenk kleine glazen: koel en zoet werkt het best in kleine hoeveelheden.');
  } else if(w.type === 'versterkt'){
    if(has(['fino','manzanilla','sherry'])){ temp = '7–9 °C'; tips.push('Fino en manzanilla drink je koud en jong. Een geopende fles blijft maar een paar dagen goed.'); }
    else { temp = '16–18 °C'; tips.push('Een geopende fles port of oloroso houdt zich weken; koel bewaren na openen.'); }
  } else { /* rood */
    const licht = has(G_LIGHT_RED), groot = has(G_BIG_RED);
    temp = licht ? '12–14 °C' : groot ? '16–18 °C' : '14–16 °C';
    glass = has(['pinot','nebbiolo']) ? 'een bourgogneglas (bolle kelk)' : groot ? 'een ruim bordeauxglas' : 'een tulpvormig wijnglas';
    if(licht) tips.push('Kelderkoud is beter dan kamertemperatuur. Een half uur in de koelkast doet wonderen.');
    if(groot || licht === false){
      if(age !== null && age >= 15) tips.push('Decanteren: voorzichtig overschenken zodat het bezinksel in de fles blijft, en pas kort van tevoren, want oude wijn kan snel omvallen.');
      else if(age !== null && age <= 7) tips.push('Geef hem wat lucht in een karaf, een uur of twee. Jong en stevig, hij heeft het nodig.');
      else if(age !== null) tips.push('Een half uur in een karaf is genoeg.');
    }
  }
  if(st.k === 'jong') tips.push('Nog aan de jonge kant. Wat extra tijd in de karaf helpt.');
  if(st.k === 'rijp') tips.push('Voorbij zijn venster en op z’n rijpst: schenk voorzichtig, en beoordeel hem in het glas voordat je bijschenkt.');
  if(st.k === 'over') tips.push('Ver over zijn venster: open hem voorzichtig en drink hem dezelfde avond op.');
  return { temp, glass, tips: tips.slice(0,2) };
}
function serveHtml(w){
  const a = serveAdvice(w);
  return `<div class="serve">
    <div class="srow"><span class="k">Schenken op</span><span class="v">${a.temp}</span></div>
    <div class="srow"><span class="k">Glas</span><span class="v">${esc(a.glass)}</span></div>
    ${a.tips.map(t => `<p class="stip">${esc(t)}</p>`).join('')}</div>`;
}

function onTable(id){ return (S.tonight||[]).some(t => t.wineId === id); }
/* Alles wat je nog wilt doen met de fles die op tafel staat: schenkadvies,
   een vraag stellen, de fles er weer bij pakken, of toch een andere kiezen. */
function openServe(id){
  const w = findWine(id); if(!w) return;
  const st = windowStatus(w);
  openSheet(`${sheetHead('Klaar om te schenken')}
    <div class="wname" style="font-size:18px">${esc(w.name)}</div>
    <div class="wsub" style="font-size:14px">${esc([w.producer, w.vintage||'NV'].filter(Boolean).join(' · '))}</div>
    <div class="wmeta mb8" style="margin-top:8px">${typeHtml(w.type)}<span class="badge ${st.cls}">${st.label}</span></div>
    <div class="small mb8">${ik('speld')} ${w.location ? `Ligt in <b>${esc(w.location)}</b>${(()=>{ const vk = rekVakken(w.location, w.id); return vk.length ? `, vak <b class="tnum">${vakKort(vk)}</b>` : ''; })()}` : 'Nog zonder plek in de kelder'}</div>
    ${serveHtml(w)}
    ${(w.pairing&&w.pairing.length)?`<div class="eyebrow mb8 mt14">Lekker bij</div><div class="grapes" style="margin-bottom:12px">${w.pairing.slice(0,4).map(p=>`<span class="grape">${esc(p)}</span>`).join('')}</div>`:''}
    <div class="btnrow mb8"><button class="btn soft" data-act="askSomm" data-id="${w.id}">${ik('chat')} Vraag</button>

/* Herbereken drinkvenster + pairing op basis van wat er nu in het formulier staat
   (bv. na het zelf invullen van jaargang of druiven). AI indien beschikbaar, anders kelderregels. */
/* Is de waarde in het veld nog de schatting van de AI (of leeg)? Dan mag een herberekening hem
   overschrijven. Een zelf getypte of opgezochte waarde blijft altijd staan. */
function waardeIsSchatting(v){
  if(v == null) return true;
  if(scan.stage === 'confirm' && scan.data && scan.data.value_eur != null && v === Math.round(scan.data.value_eur)) return true;
  if(recalcValueRange && v === recalcValueRange.value) return true;
  if(formVakWine && formVakWine.valueSrc === 'ai' && v === formVakWine.value) return true;
  return false;
}
async function doRecalc(el, silent, opts){
  opts = opts || {};
  const d = readForm();
  /* automatisch na een jaargangwijziging: het venster alleen bijrekenen zolang het een schatting is */
  const venster = !opts.auto || vensterAuto;
  if(!d.name && !(d.grapes||[]).length && !d.region && !d.appellation){
    if(!silent) toast('Vul eerst minstens een naam, druif of regio in');
    return;
  }
  const orig = el ? el.innerHTML : '';
  if(el){ el.innerHTML = 'Herberekenen…'; el.style.pointerEvents = 'none'; }
  const setVal = (id, v) => { const x = document.getElementById(id); if(x && v != null && v !== '') x.value = v; };
  let src = 'Kelderregels', done = false;
  /* de stille route (jaargang aangepast) rekent met de kelderregels: gratis en meteen; de AI alleen op de knop */
  if(!silent && aiReady()){
    try{
      const r = await aiRecalc(d);
      if(venster && r.drink_from) setVal('f_from', r.drink_from);
      if(venster && r.drink_to) setVal('f_to', r.drink_to);
      if(!(d.grapes||[]).length && Array.isArray(r.grapes) && r.grapes.length) setVal('f_grapes', r.grapes.join(', '));
      if(!d.note && r.note) setVal('f_note', r.note);
      if(Array.isArray(r.pairing) && r.pairing.length){
        recalcPairing = r.pairing;
        if(scan.stage === 'confirm' && scan.data) scan.data.pairing = r.pairing;
      }
      /* de waarde hoort bij een jaargang: een schatting wordt overschreven, eigen of opgezochte cijfers niet */
      if(waardeIsSchatting(d.value)){
        const fv = document.getElementById('f_value');
        if(r.value_eur != null && r.value_confidence !== 'laag'){
          if(fv){ fv.value = ''; fv.placeholder = 'indicatie ' + Math.round(r.value_eur); }
          recalcValueRange = {low:(r.value_low!=null?Math.round(r.value_low):null), high:(r.value_high!=null?Math.round(r.value_high):null), value:Math.round(r.value_eur)};
          if(scan.stage === 'confirm' && scan.data) scan.data.prijs_onzeker = false;
        } else if(r.value_confidence === 'laag'){
          if(fv){ fv.value = ''; fv.placeholder = '= prijs'; } recalcValueRange = null;
          if(scan.stage === 'confirm' && scan.data) scan.data.prijs_onzeker = true;
        }
      }
      src = 'Sommelier-AI'; done = true;
    }catch(e){ /* val terug op regels */ }
  }
  if(!done && venster){
    const est = estimateWindow(d);
    setVal('f_from', est.from); setVal('f_to', est.to);
  }
  if(el){ el.innerHTML = orig; el.style.pointerEvents = ''; }
  if(opts.auto && done) toast(`Waarde${venster ? ' en venster' : ''} bijgerekend voor ${d.vintage || 'NV'}${ownKey() ? '' : ' · 1 credit'}`);
  else if(!opts.auto || venster) toast(`Drinkvenster bijgewerkt (${src})`);
}
ACT.recalc = el => doRecalc(el, false);

/* Welke velden heeft de gebruiker zelf aangeraakt? Die laat het live invullen
   met rust, en ze winnen ook als het antwoord binnen is. Anders typ je een naam
   over terwijl de sommelier nog aan het lezen is, en verdwijnt hij weer. */
let scanTouched = new Set();
/* venster met de hand aangepast → niet meer automatisch overschrijven */
document.addEventListener('input', e => {
  const t = e.target;
  if(t && t.id && t.id.startsWith('f_')) scanTouched.add(t.id);
  if(t && (t.id === 'f_from' || t.id === 'f_to')) vensterAuto = false;
});
/* jaargang ingevuld of gewijzigd → venster automatisch bijrekenen zolang het een schatting is */
document.addEventListener('change', e => {
  if(!e.target || e.target.id !== 'f_vintage') return;
  if(scan.stage === 'confirm' && scan.busy) return;   /* de scan loopt nog; scanLezen rekent straks zelf bij */
  const d = readForm(), btn = document.getElementById('recalcBtn');
  /* De waarde hoort bij een jaargang. Was hij door de AI geschat (of leeg), dan rekent de AI
     opnieuw mét de nieuwe jaargang (1 credit). Opgezocht of zelf ingevuld blijft staan. */
  if(aiReady() && d.name && waardeIsSchatting(d.value)){ doRecalc(btn, false, {auto:true}); return; }
  const b = formVakWine && formVakWine.valueSrc === 'zoek' ? formVakWine.valueBron : null;
  if(b && b.vintage && d.vintage && b.vintage !== d.vintage) toast(`De opgezochte prijs gold voor jaargang ${b.vintage}. Zoek in het detail opnieuw op`, null, null, 6000);
  if(vensterAuto) doRecalc(btn, true);
});
function openWineForm(w){
  formQty = 1; recalcPairing = null; recalcValueRange = null; proefRating = null; vensterAuto = !w || (!w.drinkFrom && !w.drinkTo);
  formVakReset(w);
  const isNew = !w;
  openSheet(`${sheetHead(isNew ? 'Fles toevoegen' : 'Bewerken')}
    ${formFields(w || {location:(S.settings.lastLocation||'')}, {rek:true})}
    ${isNew ? `${proefHtml()}<div class="field"><label>Aantal flessen</label>
      <div class="stepper"><button class="stepbtn" data-act="fq" data-d="-1">−</button><span class="stepval tnum" id="fQty">1</span><button class="stepbtn" data-act="fq" data-d="1">+</button></div>
      <div class="qquick"><button data-act="fqset" data-n="6">doos van 6</button><button data-act="fqset" data-n="12">doos van 12</button></div></div>` : ''}
    <div class="btnrow mt8"><button class="btn plain" data-act="closeSheet">Annuleer</button>
    <button class="btn" data-act="wineSave" data-id="${w?w.id:''}">Bewaren</button></div>
    <div class="small center mt8">Laat het drinkvenster leeg om het automatisch te laten schatten.</div>`, {onClose: () => formVakReset(null)});
  wireSeg('f_type'); wireProefStars();
}
function syncQty(){ const q = document.getElementById('fQty'); if(q) q.textContent = formQty;
  const m = document.getElementById('mq'); if(m) m.textContent = formQty; }
ACT.fq = el => { formQty = Math.max(1, formQty + Number(el.dataset.d)); syncQty(); rekRefresh(); };
ACT.fqset = el => { formQty = Number(el.dataset.n); syncQty(); rekRefresh(); };
ACT.wineSave = el => {
  const d = readForm();
  const pr = proefLees();
  if(!d.name){ toast('Geef de wijn een naam'); return; }
  if(!d.type) d.type = 'rood';
  if(d.location) S.settings.lastLocation = d.location;
  if(!d.drinkFrom && !d.drinkTo){ const est = estimateWindow(d); d.drinkFrom = est.from; d.drinkTo = est.to; d.drinkSrc = 'regels'; }
  else { const est = estimateWindow(d); d.drinkSrc = (d.drinkFrom === est.from && d.drinkTo === est.to) ? 'regels' : 'eigen'; }
  const id = el.dataset.id;
  if(id){ const w = findWine(id); if(!w) return; const vOud = w.value, pOud = w.price, locOud = w.location;
    if(d.value == null && w.valueSrc === 'ai' && w.value != null && !recalcValueRange) d.value = w.value;   /* indicatie stond niet in het veld, blijft bewaard */
    Object.assign(w, d); rekNaBewaren(w, locOud);
    if(recalcPairing) w.pairing = recalcPairing;
    if(recalcValueRange){ if(w.value == null) w.value = recalcValueRange.value; w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; w.valueSrc = 'ai'; w.valueAt = vandaag(); w.valueBron = null; }
    if(d.value != null && d.value !== vOud && !(recalcValueRange && d.value === recalcValueRange.value)){ w.valueSrc = 'eigen'; w.valueVia = null; w.valueAt = vandaag(); w.valueBron = null; }
    prijsAlsBron(w); if(d.price != null && d.price !== pOud) deelBetaald(w);
    save(); closeSheet(true); render(); toast('Bijgewerkt'); }
  else {
    const w = { id:uid(), ...d, qty:formQty, pairing:recalcPairing||[], photo:false, addedAt:Date.now() };
    if(recalcValueRange){ if(w.value == null) w.value = recalcValueRange.value; w.valueLow = recalcValueRange.low; w.valueHigh = recalcValueRange.high; w.valueSrc = 'ai'; w.valueAt = vandaag(); }
    if(d.value != null && !(recalcValueRange && d.value === recalcValueRange.value)){ w.valueSrc = 'eigen'; w.valueAt = vandaag(); }
    prijsAlsBron(w); deelBetaald(w);
    const geproefd = proefSchrijf(w, pr);
    rekNaBewaren(w, null);
    S.wines.unshift(w); save(); closeSheet(true); UI.tab = 'kelder'; render();
    const gelegd = `${formQty} ${plur(formQty,'fles','flessen')} toegevoegd${geproefd ? ', proefnotitie bewaard' : ''}`;
    if(!w.location) toast(gelegd + ', nog zonder plek', 'Plek geven', () => openPlekGeven(w.id), 5500);
    else toast(gelegd);
  }
};

/* Gerechten bij een wijn (detail & pairing), met richting-voorkeur en cache */
ACT.wineDishes = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  openSheet(`${sheetHead('Lekker bij ' + esc(w.name))}
    <div class="field"><label>Richting (optioneel)</label>
      <div style="display:flex;gap:8px">
        <input class="inp" id="pd_dir" placeholder="bv. Aziatisch, vegetarisch, licht &amp; zomers" style="flex:1">
        <button class="btn sm soft" data-act="dishGo" data-id="${w.id}" style="flex:none">Toon</button>
      </div></div>
    <div id="dishOut"></div>`);
  runWineDishes(w, '', false);
};
ACT.dishGo = el => { const w = findWine(el.dataset.id); runWineDishes(w, ((document.getElementById('pd_dir')||{}).value||'').trim(), false); };
ACT.dishFresh = el => { const w = findWine(el.dataset.id); runWineDishes(w, el.dataset.dir||'', true); };

async function runWineDishes(w, richting, force){
  const out = document.getElementById('dishOut'); if(!out || !w) return;
  const key = norm(richting||'') || '_';
  const cached = !force && w.dishCache && w.dishCache[key];
  if(cached && cached.list && cached.list.length){
    const dt = new Date(cached.at).toLocaleDateString(LOCALE(), {day:'numeric', month:'short'});
    renderDishes(out, w, richting, cached.list, `Opgeslagen · ${dt}`, true);
    return;
  }
  let dishes = null, src = 'Kelderregels', aiFout = aiRedenUit();
  if(aiReady()){
    out.innerHTML = `<div class="banner">${pourSvg}<span class="pulse">De sommelier denkt na…</span></div>`;
    try{
      const r = await aiWine(w, richting);
      dishes = (r.dishes||[]).map(d => ({dish:d.dish, reason:d.reason})).filter(d => d.dish);
      if(dishes.length){ src = 'Sommelier-AI'; w.dishCache = w.dishCache || {}; w.dishCache[key] = {at:Date.now(), list:dishes};
        /* hoogstens drie richtingen per wijn bewaren, anders groeit het document en de sync zonder grens */
        const ks = Object.keys(w.dishCache); if(ks.length > 3) delete w.dishCache[ks.sort((a, b) => (w.dishCache[a].at||0) - (w.dishCache[b].at||0))[0]];
        save(); }
    }catch(e){ dishes = null; aiFout = leesFout(e); }
    if(!aiFout) aiFout = 'de sommelier vond niets';
  }
  if(!dishes || !dishes.length){ dishes = dishesForWine(w); src = 'Kelderregels'; }
  if(!dishes.length){ out.innerHTML = '<p class="small">Geen suggesties gevonden. Vul type of druiven aan.</p>'; return; }
  renderDishes(out, w, richting, dishes, src, false, aiFout);
}
function renderDishes(out, w, richting, list, srcLabel, cached, aiFout){
  out.innerHTML = (srcLabel === 'Kelderregels' ? zonderAiHtml(aiFout) : '') + `<div class="mb8" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="srcchip">${esc(bronLabel(srcLabel))}</span>${richting?`<span class="small">richting: ${esc(richting)}</span>`:''}${cached?`<button class="linkbtn" style="font-size:12.5px" data-act="dishFresh" data-id="${w.id}" data-dir="${esc(richting||'')}">↻ vernieuw</button>`:''}</div>` +
    list.map(d => `<div class="dishcard"><div class="d">${esc(d.dish)}</div><div class="r">${esc(d.reason||'')}</div><div class="mt8"><button class="linkbtn" style="font-size:13px" data-act="recipeAsk" data-dish="${esc(d.dish)}" data-wid="${w.id}">${ik('boek')} Recept tonen</button></div></div>`).join('');
}

/* ---- recepten (met personen-keuze en cache) ---- */
ACT.recipeAsk = el => {
  if(!aiReady() && !(S.recipeCache||[]).some(r => r.dish === el.dataset.dish)){
    toast(hoofd(aiRedenUit())); return;
  }
  const dish = el.dataset.dish, wid = el.dataset.wid || '';
  openSheet(`${sheetHead('Recept: ' + esc(dish))}
    <p class="small mb8">Voor hoeveel personen?</p>
    <div class="btnrow">${[2,4,6,8].map(n => `<button class="btn soft" data-act="recipeGo" data-dish="${esc(dish)}" data-wid="${wid}" data-p="${n}">${n}</button>`).join('')}</div>`);
};
ACT.recipeGo = async el => {
  const dish = el.dataset.dish, p = Number(el.dataset.p) || 4, wid = el.dataset.wid || null;
  const key = norm(dish) + '|' + p;
  closeSheet();
  const hit = (S.recipeCache||[]).find(r => r.key === key);
  if(hit){ showRecipe({...hit, cached:true}); return; }
  if(!aiReady()){ toast(hoofd(aiRedenUit())); return; }
  const sh = openSheet(`${sheetHead('Recept: ' + esc(dish))}<div class="banner">${pourSvg}<span class="pulse">Recept schrijven…</span></div>`);
  try{
    const r = await aiRecipe(dish, p);
    const wijn = wid ? findWine(wid) : null;
    const entry = {key, dish, persons:p, at:Date.now(), wineId:wid, wineName:wijn?`${wijn.name}${wijn.vintage?' '+wijn.vintage:''}`:null, recipe:r};
    S.recipeCache = (S.recipeCache||[]).filter(x => x.key !== key);
    S.recipeCache.unshift(entry);
    S.recipeCache = S.recipeCache.slice(0, 50);
    save();
    closeSheet(); showRecipe({...entry, cached:false});
  }catch(e){
    const inner = sh.querySelector('.sheet-in');
    if(inner) inner.innerHTML = `${sheetHead('Recept')}<div class="banner"><span>${ik('waarschuwing')}</span><span>Recept ophalen lukte niet (${esc(String(e.message||e).slice(0,90))}). Probeer het zo nog eens.</span></div>`;
  }
};
function showRecipe(e){
  const r = e.recipe || {};
  const wijn = e.wineId ? findWine(e.wineId) : null;
  const wijnRow = wijn
    ? `<button class="linkbtn" style="font-size:13px" data-act="detail" data-id="${wijn.id}">${ik('glas')} ${esc(e.wineName||wijn.name)} →</button>`
    : (e.wineName ? `<span class="small">${ik('glas')} ${esc(e.wineName)} (niet meer in je kelder)</span>` : '');
  openSheet(`${sheetHead(esc(r.title || e.dish))}
    <div class="small mb8" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${Number(e.persons)||0} personen${r.time ? ` · ${esc(r.time)}` : ''} · <span class="srcchip">${e.cached ? 'Opgeslagen' : 'Sommelier-AI'}</span>${wijnRow}</div>
    <div class="eyebrow mb8">Ingrediënten</div>
    <div class="panel" style="margin-bottom:14px">${lijstOk(r.ingredients, 40, 200).map(i => `<div class="rowline" style="padding:6px 0"><span class="a" style="font-size:14px">${esc(i)}</span></div>`).join('')}</div>
    <div class="eyebrow mb8">Bereiding</div>
    ${lijstOk(r.steps, 30, 600).map((s,i) => `<div style="display:flex;gap:10px;margin-bottom:10px"><span style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center">${i+1}</span><span style="font-size:14px;flex:1">${esc(s)}</span></div>`).join('')}`);
}
ACT.recipeOpen = el => {
  const r = (S.recipeCache||[]).find(x => x.key === el.dataset.k);
  if(r) showRecipe({...r, cached:true});
};

/* ---- vraag de sommelier (vrije vraag over wijn/pairing) ---- */
ACT.askSomm = el => {
  const w = findWine(el.dataset.id); if(!w) return;
  if(!aiReady()){ toast(hoofd(aiRedenUit())); return; }
  const dish = el.dataset.dish || '';
  openSheet(`${sheetHead('Vraag de sommelier')}
    <div class="small mb8">${esc(w.name)} ${w.vintage||''}${dish?` · bij "${esc(dish)}"`:''}</div>
    <div id="askOut"></div>
    <div class="field"><div style="display:flex;gap:8px">
      <input class="inp" id="askQ" placeholder="bv. past dit bij paddenstoelen?" style="flex:1;min-width:0">
      <button class="btn sm" data-act="askGo" data-id="${w.id}" data-dish="${esc(dish)}" style="flex:none">Vraag</button></div></div>
    <div class="chiprow">${['Moet deze gekoeld?','Decanteren?','Hoe lang van tevoren open?'].map(q=>`<button class="chip" data-act="askQuick" data-q="${esc(q)}">${q}</button>`).join('')}</div>`);
};
ACT.askQuick = el => {
  const i = document.getElementById('askQ'); if(i) i.value = el.dataset.q;
  const b = document.querySelector('[data-act="askGo"]'); if(b) ACT.askGo(b);
};
ACT.askGo = async el => {
  const w = findWine(el.dataset.id); if(!w) return;
  const inp = document.getElementById('askQ');
  const q = ((inp||{}).value||'').trim();
  if(!q){ toast('Typ eerst je vraag'); return; }
  const out = document.getElementById('askOut'); if(!out) return;
  const aid = 'ans' + Date.now();
  out.insertAdjacentHTML('beforeend', `<div class="dishcard"><div class="d">${esc(q)}</div><div class="r" id="${aid}">${pourSvg}</div></div>`);
  if(inp) inp.value = '';
  try{
    const ans = await aiAsk(w, el.dataset.dish||'', q);
    const t = document.getElementById(aid); if(t) t.textContent = String(ans||'').trim();
  }catch(e){
    const t = document.getElementById(aid); if(t) t.textContent = 'Lukte niet: ' + String(e.message||e).slice(0,80);
  }
};
</script>
<script>
'use strict';
/* ================= SCAN ================= */
let scan = { stage:'idle', photo:null, thumb:null, data:null, match:null, err:null, busy:false };
function scanReset(){ scan = { stage:'idle', photo:null, thumb:null, data:null, match:null, err:null, busy:false }; recalcPairing = null; recalcValueRange = null; proefRating = null; formVakReset(null); }

function aiBanner(){
  if(IN_SANDBOX) return `<div class="banner"><span>${ik('info')}</span><span><b>Etiket-lezen met AI staat uit</b> in deze omgeving (de app-sandbox blokkeert externe verbindingen). Foto's bewaren en zelf invullen werkt gewoon. De ingebouwde sommelier-regels schatten drinkvenster en pairing. Host je het bestand zelf, dan leest Claude etiketten automatisch.</span></div>`;
  if(!aiReady()) return `<div class="banner"><span>${ik('info')}</span><span><b>Log in en de sommelier leest je etiketten</b>: naam, druiven, drinkvenster en pairing in één foto. Je krijgt ${FREE_CREDITS} gratis credits per maand: <button class="linkbtn" data-act="goAccount">account aanmaken</button>. Zonder inloggen werkt alles behalve het automatisch lezen.</span></div>`;
  return '';
}
function viewScan(){
  if(scan.stage === 'idle'){

/* ================= live-scanner: QR-gevoel met auto-vangst ================= */
let liveStream = null, liveTimer = null, livePrev = null, liveStable = 0, liveEl = null, liveStartAt = 0;
/* zaklamp: alleen Android/Chrome kan dit via getUserMedia; iOS Safari niet.
   De knop verschijnt daarom pas als de camera zelf zegt dat hij het kan. */
let liveTorch = false;
async function liveTorchInit(){
  liveTorch = false;
  try{
    const t = liveStream && liveStream.getVideoTracks()[0];
    const caps = t && t.getCapabilities ? t.getCapabilities() : null;
    if(caps && caps.torch){
      const b = document.getElementById('liveTorchBtn');
      if(b) b.style.display = 'block';
    }
  }catch(e){}
}
ACT.liveTorch = async el => {
  const t = liveStream && liveStream.getVideoTracks()[0];
  if(!t) return;
  try{
    liveTorch = !liveTorch;
    await t.applyConstraints({ advanced:[{ torch: liveTorch }] });
    el.textContent = liveTorch ? '🔦 aan' : 'zaklamp';
    el.style.opacity = liveTorch ? '1' : '.75';
  }catch(e){ liveTorch = false; toast('De zaklamp lukt niet op dit toestel'); }
};
/* 'etiket' = automatisch vangen bij stil+scherp beeld; 'kaart' = wijnkaart, zelf afdrukken */
let liveMode = 'etiket';
/* waar een gekozen/gemaakte foto heen gaat: 'etiket' (fles) of 'kaart' (wijnkaart) */
let photoTarget = 'etiket';
/* iOS vraagt elke keer om de camera, tenzij de gebruiker dat in Safari vastzet. Of het venster
   verscheen kunnen we niet zien; wel hoe vaak de camera openging op dít apparaat. Bij de 3e, 4e,
   8e, 10e en 15e keer één wenk met de instelling, daarna nooit meer. */
const CAM_WENK_BIJ = [3, 4, 8, 10, 15];
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let camWenk = false;
function camGeteld(){
  if(!isIOS()) return;
  let n = 0; try{ n = (parseInt(localStorage.getItem('caveau_cam'), 10) || 0) + 1; localStorage.setItem('caveau_cam', String(n)); }catch(e){ return; }
  camWenk = CAM_WENK_BIJ.includes(n);
}
function camWenkToon(){
  if(!camWenk) return; camWenk = false;
  toast('Telkens toestemming voor de camera? Zet hem vast: Instellingen → Safari → Camera → Toestaan', null, null, 9000);
}
async function openLiveScan(mode){
  liveMode = mode || 'etiket'; photoTarget = liveMode;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ document.getElementById('fCam').click(); return; }
  try{
    liveStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}, audio:false });
  }catch(e){ document.getElementById('fCam').click(); return; } /* geweigerd of geen camera → systeemcamera */
  camGeteld();
  const kaart = liveMode === 'kaart' || liveMode === 'menu', code = liveMode === 'barcode';
  const div = document.createElement('div'); div.className = 'livewrap'; div.id = 'liveScan';
  div.innerHTML = `<video autoplay playsinline muted></video>
    <div class="liveframe${kaart?' page':''}">${kaart?'':'<div class="livescanline"></div>'}</div>
    <div class="livehint" id="liveHint">${kaart?'Hele pagina in beeld, tik op de knop':code?'Richt op de streepjescode, liggend of staand, zo groot mogelijk in beeld':'Houd het etiket in het kader, hij vangt vanzelf'}</div>
    <div class="liveflash" id="liveFlash"></div>
    <div class="livebar">
      <button class="livex" data-act="liveClose" aria-label="Sluiten">✕</button>
      <button class="liveshut" data-act="liveSnap" aria-label="Maak foto"></button>
      ${code ? '' : '<button class="livelib" data-act="liveLib">galerij</button>'}
      <button class="livelib" id="liveTorchBtn" data-act="liveTorch" style="display:none;opacity:.75">zaklamp</button>
    </div>`;
  document.body.appendChild(div); liveEl = div;
  const v = div.querySelector('video'); v.srcObject = liveStream;
  liveStartAt = Date.now(); livePrev = null; liveStable = 0;
  liveTorchInit();
  liveTimer = setInterval(() => liveCheck(v), 260);
}
function closeLiveScan(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
  if(liveStream){ try{ liveStream.getTracks().forEach(t => t.stop()); }catch(e){} liveStream = null; }
  if(liveEl){ liveEl.remove(); liveEl = null; }
}
ACT.liveClose = () => { const k = liveMode !== 'etiket'; closeLiveScan(); if(k) render(); };
ACT.liveLib = () => { closeLiveScan(); document.getElementById('fLib').click(); };
ACT.liveSnap = () => liveCapture();
function liveCheck(v){
  if(!v || !v.videoWidth) return;
  if(liveMode === 'barcode'){ barcodeTick(v, false); return; }
  if(liveMode !== 'etiket'){ /* kaart of menu: geen auto-vangst, de gast kadreert zelf */
    const h = document.getElementById('liveHint');
    if(h) h.textContent = 'Hele pagina in beeld, tik op de knop';
    return;
  }
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  try{ ctx.drawImage(v, 0, 0, 64, 64); }catch(e){ return; }
  const d = ctx.getImageData(0, 0, 64, 64).data;
  const g = new Float32Array(4096);
  let sum = 0;
  for(let i = 0; i < 4096; i++){ const y = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3; g[i] = y; sum += y; }
  const mean = sum / 4096;
  let edge = 0;
  for(let y = 0; y < 64; y++) for(let x = 0; x < 63; x++) edge += Math.abs(g[y*64+x] - g[y*64+x+1]);
  edge /= 4032;
  let diff = 999;
  if(livePrev){ diff = 0; for(let i = 0; i < 4096; i += 4) diff += Math.abs(g[i] - livePrev[i]); diff /= 1024; }
  livePrev = g;
  /* Scherpte en beweging worden afgezet tegen de helderheid van het beeld zelf.
     In een donker restaurant zakt het contrast van álles evenredig mee: met een
     vaste drempel haalt een perfect scherp etiket het nooit en klikt de sluiter
     dus nooit. Relatief gemeten gedraagt hij zich bij kaarslicht als bij daglicht. */
  const ref = Math.max(mean, 26);
  const edgeRel = edge / ref * 100, diffRel = diff / ref * 100;
  const donker = mean < 26, weinigLicht = mean < 70;   /* wel bruikbaar, maar de camera heeft er moeite mee */
  const stil = diffRel < 4.5, scherp = edgeRel > 5 && edge > 2;
  liveStable = (stil && scherp && !donker) ? liveStable + 1 : 0;
  const hint = document.getElementById('liveHint');
  if(hint) hint.textContent = donker ? (liveTorch ? 'Nog te donker, houd hem dichterbij' : 'Te donker, zet de zaklamp aan of zoek licht')
    : !scherp ? (weinigLicht ? 'Weinig licht, dit duurt soms even. Of tik op de knop' : 'Iets dichterbij, of even scherpstellen…')
    : !stil ? (weinigLicht ? 'Houd stil, bij weinig licht duurt het iets langer…' : 'Houd stil…') : 'Vasthouden…';
  if(liveStable >= 3 && Date.now() - liveStartAt > 1200) liveCapture();
}
function liveCapture(){
  const v = liveEl && liveEl.querySelector('video');
  if(!v || !v.videoWidth) return;
  if(liveMode === 'barcode'){ barcodeTick(v, true); return; }   /* de knop: één keer op volle resolutie */
  const kaart = liveMode === 'kaart' || liveMode === 'menu';
  if(liveTimer && !kaart){ clearInterval(liveTimer); liveTimer = null; }
  const fl = document.getElementById('liveFlash');
  if(fl){ fl.style.opacity = '0.75'; setTimeout(() => { if(fl) fl.style.opacity = '0'; }, 180); }
  /* een wijnkaart heeft meer resolutie nodig dan een etiket: kleine letters, veel regels */
  const sc = Math.min(1, (kaart ? 1568 : 1400) / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  if(kaart){
    /* camera blijft open: meerdere pagina's achter elkaar fotograferen */
    addMenuShot(c.toDataURL('image/jpeg', 0.82), liveMode);
    const n = shotList(liveMode).length;
    const h = document.getElementById('liveHint');
    if(n >= shotMax(liveMode)){ closeLiveScan(); render(); return; }
    if(h) h.textContent = `Pagina ${n} vastgelegd. Nog een pagina? Anders op ✕`;
    return;
  }
  c.toBlob(b => { closeLiveScan(); if(b) handlePhoto(b); }, 'image/jpeg', 0.88);
}
